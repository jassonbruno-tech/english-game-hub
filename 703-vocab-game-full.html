<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Combinação de Vocabulário — Turma 703</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07142f;font-family:Arial,Helvetica,sans-serif}
.cover{position:fixed;inset:0;overflow:hidden;background:#07142f;z-index:10}
.stage{position:absolute;left:50%;top:50%;width:941px;height:1672px;transform-origin:center center}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
.field{position:absolute;left:31.5%;width:43.5%;height:3.05%;border:0;outline:0;background:transparent;color:#122b5e;font-weight:800;font-size:22px;line-height:1;padding:4px 14px;border-radius:999px}
.field:focus{background:rgba(255,255,255,.13);box-shadow:0 0 0 4px rgba(255,201,42,.48)}
#n{top:76.6%}#s{top:82.55%}#c{top:88.45%}
.start{position:absolute;left:36%;top:92.0%;width:28%;height:2.9%;border:0;border-radius:999px;background:linear-gradient(180deg,#ffe66d,#ffb703);color:#07326b;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.32)}
.start:active{transform:scale(.97)}
.back{position:absolute;left:22px;top:24px;z-index:3;padding:13px 20px;border-radius:999px;background:linear-gradient(180deg,rgba(9,46,111,.96),rgba(2,18,55,.96));border:2px solid rgba(255,230,109,.82);color:#fff;text-decoration:none;font-size:22px;font-weight:1000;letter-spacing:.7px;box-shadow:0 5px 16px rgba(0,0,0,.35),0 0 16px rgba(255,230,109,.2);cursor:pointer}
.back:active{transform:scale(.96)}
.msg{position:absolute;left:23%;right:23%;top:95.2%;text-align:center;color:#fff7c2;font-size:14px;font-weight:900;text-shadow:0 2px 5px #000;min-height:18px}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#07142f;z-index:5}
</style>
</head>
<body>
<div class="cover" id="cover">
 <div class="stage" id="stage">
  <img class="art" src="703-combinacao-de-vocabulario-nova-capa.png" alt="Capa do jogo Combinação de Vocabulário">
  <button class="back" type="button" onclick="window.location.href='index_turma_703_english_game_hub.html?v=40'">← VOLTAR</button>
  <input id="n" class="field" autocomplete="name" aria-label="Nome do aluno">
  <input id="s" class="field" autocomplete="organization" aria-label="Escola">
  <input id="c" class="field" aria-label="Turma" inputmode="numeric">
  <button id="startBtn" class="start" type="button">COMEÇAR ▶</button>
  <div class="msg" id="msg"></div>
 </div>
</div>
<iframe id="game" src="703-quanticompare-challenge-core.html?v=51" title="Combinação de Vocabulário"></iframe>
<script>
const BASE_W=941,BASE_H=1672,stage=document.getElementById('stage'),frame=document.getElementById('game');
let ready=false,pending=false;
const EXTRA_BANKS={
1:[['L1-11','daughter','filha'],['L1-12','son','filho'],['L1-13','grandparents','avós'],['L1-14','nephew','sobrinho'],['L1-15','niece','sobrinha']],
2:[['L2-11','I have two brothers.','Eu tenho dois irmãos.'],['L2-12','My parents are at home.','Meus pais estão em casa.'],['L2-13','My cousin lives nearby.','Meu primo/minha prima mora perto.'],['L2-14','We visit our grandparents.','Nós visitamos nossos avós.'],['L2-15','My sister is very kind.','Minha irmã é muito gentil.']],
3:[['L3-11','writing','escrevendo'],['L3-12','listening','ouvindo'],['L3-13','running','correndo'],['L3-14','eating','comendo'],['L3-15','drinking','bebendo']],
4:[['L4-11','Who is he?','Quem é ele?'],['L4-12','Where is your mother?','Onde está sua mãe?'],['L4-13','What are they doing?','O que eles estão fazendo?'],['L4-14','Is she studying now?','Ela está estudando agora?'],['L4-15','Who is cooking now?','Quem está cozinhando agora?']],
5:[['L5-11','much','muito/muita'],['L5-12','any','algum/alguma'],['L5-13','little','pouco/pouca'],['L5-14','several','vários/várias'],['L5-15','enough','suficiente']],
6:[['L6-11','stronger','mais forte'],['L6-12','cleaner','mais limpo'],['L6-13','colder','mais frio'],['L6-14','warmer','mais quente'],['L6-15','nicer','mais agradável']],
7:[['L7-11','more exciting','mais emocionante'],['L7-12','more careful','mais cuidadoso'],['L7-13','more useful','mais útil'],['L7-14','more famous','mais famoso'],['L7-15','more peaceful','mais tranquilo']],
8:[['L8-11',"my father's brother",'meu tio'],['L8-12',"my mother's sister",'minha tia'],['L8-13',"my cousin's mother",'minha tia'],['L8-14','My grandparents live nearby.','Meus avós moram perto.'],['L8-15','My family has many cousins.','Minha família tem muitos primos.']],
9:[['L9-11','My sister is reading now.','Minha irmã está lendo agora.'],['L9-12','Some students are talking.','Alguns alunos estão conversando.'],['L9-13','My cousins are visiting us.','Meus primos estão nos visitando.'],['L9-14','Most families eat together.','A maioria das famílias come junta.'],['L9-15','My father is driving now.','Meu pai está dirigindo agora.']],
10:[['L10-11','My brother is stronger than me.','Meu irmão é mais forte que eu.'],['L10-12','This book is more interesting.','Este livro é mais interessante.'],['L10-13','My house is smaller than yours.','Minha casa é menor que a sua.'],['L10-14','Today is colder than yesterday.','Hoje está mais frio que ontem.'],['L10-15','My family is happier today.','Minha família está mais feliz hoje.']]
};
function fit(){const sc=Math.max(innerWidth/BASE_W,innerHeight/BASE_H);stage.style.transform=`translate(-50%,-50%) scale(${sc})`}
addEventListener('resize',fit,{passive:true});addEventListener('orientationchange',fit);fit();
function expandContentBank(){
 try{
  const d=frame.contentWindow.document;
  if(d.getElementById('bank-expansion-703'))return;
  const s=d.createElement('script');s.id='bank-expansion-703';
  s.textContent=`(function(){try{const extras=${JSON.stringify(EXTRA_BANKS)};Object.keys(extras).forEach(k=>{const i=Number(k)-1;if(!BANKS[i]||!Array.isArray(BANKS[i].pairs))return;extras[k].forEach(x=>{if(!BANKS[i].pairs.some(p=>p.id===x[0]))BANKS[i].pairs.push({id:x[0],en:x[1],pt:x[2]})})});}catch(e){console.error('703 bank expansion',e)}})();`;
  d.body.appendChild(s);
 }catch(e){}
}
function optimizeGameLayout(){
 try{
  const d=frame.contentWindow.document;
  let st=d.getElementById('mobile-fill-fix');
  if(!st){st=d.createElement('style');st.id='mobile-fill-fix';d.head.appendChild(st)}
  st.textContent=`
   html,body{height:100%!important;min-height:100%!important;overflow:hidden!important}
   body{height:100dvh!important;min-height:100dvh!important;display:flex!important;align-items:center!important;justify-content:center!important}
   .app{width:100%!important;max-width:none!important;height:100dvh!important;min-height:100dvh!important;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)!important;display:flex!important;flex-direction:column!important;justify-content:center!important;gap:8px!important;overflow:hidden!important}
   .game.active{display:flex!important;flex-direction:column!important;flex:1 1 auto!important;height:100%!important;min-height:0!important;justify-content:center!important}
   .hud{flex:0 0 auto!important;margin:0!important}
   .pill{font-size:14px!important;padding:10px 4px!important}
   .card{flex:1 1 auto!important;height:auto!important;min-height:0!important;display:flex!important;flex-direction:column!important;padding:12px!important;border-radius:22px!important}
   .card h2,#phaseTitle{font-size:clamp(21px,5.8vw,30px)!important;margin:0 0 6px!important}
   .status{font-size:15px!important;min-height:22px!important;margin-bottom:8px!important}
   .board{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important;flex:1 1 auto!important;height:100%!important;min-height:0!important;align-content:center!important}
   .col{display:flex!important;flex-direction:column!important;justify-content:center!important;gap:8px!important;height:100%!important;min-height:0!important}
   .word{min-height:0!important;height:58px!important;min-height:58px!important;max-height:58px!important;flex:0 0 58px!important;font-size:clamp(15px,4.2vw,19px)!important;line-height:1.2!important;padding:8px 7px!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important}
   @media(max-height:720px){.app{padding:6px!important;gap:6px!important}.col{gap:5px!important}.word{height:52px!important;min-height:52px!important;max-height:52px!important;flex-basis:52px!important;font-size:13px!important;padding:6px!important}.pill{font-size:12px!important;padding:7px 2px!important}.status{font-size:13px!important}#phaseTitle{font-size:20px!important}.card{padding:8px!important}}
  `;
 }catch(e){}
}
frame.addEventListener('load',()=>{ready=true;expandContentBank();optimizeGameLayout();if(pending)openGame()});
function validate(){
 const ids=['n','s','c'];
 for(const id of ids){const el=document.getElementById(id);if(!el.value.trim()){document.getElementById('msg').textContent='Preencha os três campos para começar.';el.focus();return false}}
 document.getElementById('msg').textContent='';return true;
}
function resumeAudio(w){try{for(const key of ['audioCtx','_audioCtx','AudioCtx']){const ctx=w[key];if(ctx&&ctx.state==='suspended'&&typeof ctx.resume==='function')ctx.resume()}if(typeof w.primeAudio==='function')w.primeAudio()}catch(e){}}
function openGame(){
 if(!validate()){pending=false;return}
 if(!ready){pending=true;document.getElementById('msg').textContent='Carregando o jogo...';return}
 expandContentBank();optimizeGameLayout();
 pending=false;
 const w=frame.contentWindow,d=w.document;
 resumeAudio(w);
 const values={name:document.getElementById('n').value.trim(),school:document.getElementById('s').value.trim(),klass:document.getElementById('c').value.trim()};
 const map={'name':'name','school':'school','klass':'klass'};
 Object.entries(map).forEach(([k,id])=>{const e=d.getElementById(id);if(e)e.value=values[k]});
 let started=false;
 if(typeof w.startWithPlayer==='function'){w.startWithPlayer(values.name,values.school,values.klass);started=true}
 if(!started){for(const fn of ['startGame']){if(typeof w[fn]==='function'){w[fn]();started=true;break}}}
 if(!started){const b=d.querySelector('.cover-start-action,.start-btn,button[onclick*="start"],button[onclick*="restart"]');if(b){b.click();started=true}}
 if(started){document.getElementById('cover').style.display='none';frame.style.display='block';setTimeout(()=>resumeAudio(w),80)}
 else document.getElementById('msg').textContent='Não foi possível iniciar. Toque novamente.';
}
document.getElementById('startBtn').addEventListener('click',openGame);
document.getElementById('c').addEventListener('keydown',e=>{if(e.key==='Enter')openGame()});
</script>
</body></html>

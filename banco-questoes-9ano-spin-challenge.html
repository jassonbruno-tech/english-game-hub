<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banco de Questões — 9º Ano Spin Challenge</title>
<style>
  :root {
    --bg1:#11071f; --bg2:#220c3e; --card:rgba(255,255,255,.095); --line:rgba(255,255,255,.18);
    --text:#fff; --muted:rgba(255,255,255,.76); --accent:#ffd166; --pink:#ff4fd8; --cyan:#00e5ff;
    --green:#70e000; --red:#ff4d6d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#4d1d95 0%,var(--bg2) 35%,var(--bg1) 100%);color:var(--text);min-height:100vh}
  .wrap{width:min(1120px,96vw);margin:0 auto;padding:18px 0 40px}
  header{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(255,79,216,.18),rgba(0,229,255,.12));box-shadow:0 18px 50px rgba(0,0,0,.3)}
  h1{margin:0;font-size:clamp(1.7rem,4vw,3.2rem);line-height:1.05}
  .subtitle{margin:8px 0 0;color:var(--muted);font-size:1rem}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .stat{background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
  .stat b{display:block;font-size:1.35rem;color:var(--accent)} .stat span{font-size:.8rem;color:var(--muted)}
  .toolbar{position:sticky;top:0;z-index:5;margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:20px;background:rgba(17,7,31,.92);backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  select,input,button{font:inherit;border:none;border-radius:14px;padding:12px}
  select,input{background:#fff;color:#1d1430;min-width:0}
  button{background:linear-gradient(135deg,var(--pink),var(--cyan));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28)}
  .bank{display:grid;gap:14px}
  .qcard{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:15px;box-shadow:0 12px 34px rgba(0,0,0,.22)}
  .qtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
  .badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.08);font-size:.85rem;color:#fff}
  .badge.phase{color:#111;background:var(--accent);font-weight:900}
  .qtext{white-space:pre-wrap;line-height:1.5;margin:8px 0 12px;font-size:1rem}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
  .opt{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:10px}
  .opt.correct{outline:2px solid var(--green);background:rgba(112,224,0,.16)}
  .answer{font-weight:900;color:var(--green);margin:10px 0}
  details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  summary{cursor:pointer;color:var(--accent);font-weight:800}
  .exp{line-height:1.48;color:var(--text)}
  .codebox{display:none;white-space:pre-wrap;background:#0b0714;border:1px solid var(--line);border-radius:18px;padding:14px;max-height:420px;overflow:auto;color:#eae6ff}
  .footer{margin-top:22px;text-align:center;color:var(--muted);font-size:.9rem}
  @media(max-width:720px){
    .wrap{width:94vw;padding-top:10px}
    header{padding:14px;border-radius:20px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .toolbar{grid-template-columns:1fr;position:static}
    .opts{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🎡 Banco de Questões — 9º Ano</h1>
  <p class="subtitle">Spin Challenge • 2º Bimestre • Connectors, Feelings, Prefixes, Suffixes, Word Formation e Review.</p>
  <div class="stats">
    <div class="stat"><b id="totalCount">60</b><span>questões</span></div>
    <div class="stat"><b>6</b><span>fases</span></div>
    <div class="stat"><b>10</b><span>por fase</span></div>
    <div class="stat"><b>9º</b><span>ano</span></div>
  </div>
</header>

<div class="toolbar">
  <select id="phaseFilter" onchange="renderBank()"><option value="all">Todas as fases</option></select>
  <select id="themeFilter" onchange="renderBank()"><option value="all">Todos os temas</option></select>
  <input id="search" oninput="renderBank()" placeholder="Buscar palavra, aluno ou conteúdo..." />
  <button onclick="copyJSON()">Copiar JSON</button>
  <button onclick="copyJS()">Copiar banco JS</button>
  <button onclick="toggleCode()">Mostrar/ocultar código</button>
</div>

<div id="bank" class="bank"></div>
<pre id="codebox" class="codebox"></pre>
<div class="footer">Jogo idealizado pelo Prof. Jasson Bruno.</div>
</div>

function stripHTML(s){const d=document.createElement('div');d.innerHTML=s||'';return d.textContent||d.innerText||''}
function fillFilters(){
  const phaseSel=document.getElementById('phaseFilter');
  PHASES_9ANO.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`Fase ${p.id} — ${p.title}`;phaseSel.appendChild(o)});
  const themes=[...new Set(QUESTION_BANK_9ANO.map(q=>q.theme))];
  const themeSel=document.getElementById('themeFilter');
  themes.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;themeSel.appendChild(o)});
}
function renderBank(){
  const phase=document.getElementById('phaseFilter').value;
  const theme=document.getElementById('themeFilter').value;
  const term=(document.getElementById('search').value||'').toLowerCase().trim();
  let list=QUESTION_BANK_9ANO.filter(q=>(phase==='all'||String(q.phase)===phase)&&(theme==='all'||q.theme===theme));
  if(term) list=list.filter(q=>[q.q,q.a,(q.o||[]).join(' '),stripHTML(q.e)].join(' ').toLowerCase().includes(term));
  document.getElementById('totalCount').textContent=list.length;
  document.getElementById('bank').innerHTML=list.map((q,i)=>{
    const phaseInfo=PHASES_9ANO.find(p=>p.id===q.phase)||{title:'Fase'};
    const opts=(q.o||[]).map((op,idx)=>`<div class="opt ${String(op).trim()===String(q.a).trim()?'correct':''}"><b>${'ABCD'[idx]})</b> ${op}</div>`).join('');
    return `<article class="qcard">
      <div class="qtop"><span class="badge phase">Fase ${q.phase}</span><span class="badge">${phaseInfo.title}</span><span class="badge">${q.theme}</span><span class="badge">Questão ${i+1}</span></div>
      <div class="qtext">${q.q}</div>
      <div class="opts">${opts}</div>
      <div class="answer">Resposta correta: ${q.a}</div>
      <details open><summary>Feedback, vocabulário e explicação</summary><div class="exp">${q.e}</div></details>
    </article>`
  }).join('') || '<div class="qcard">Nenhuma questão encontrada.</div>';
}

function copyJS(){navigator.clipboard.writeText('const QUESTION_BANK_9ANO = '+JSON.stringify(QUESTION_BANK_9ANO,null,2)+';');alert('Banco em JavaScript copiado!')}

const QUESTION_BANK_9ANO = '+JSON.stringify(QUESTION_BANK_9ANO,null,2)+';';
}
fillFilters();renderBank();

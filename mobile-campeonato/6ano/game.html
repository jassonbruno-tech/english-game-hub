<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1265e8">
<title>6º Ano — English Championship Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="data.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef7ff;color:#17385f}button,input{font:inherit}.app{min-height:100svh;max-width:560px;margin:auto;background:linear-gradient(180deg,#eaf8ff,#f8fbff)}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#216dff,#31c7ff 58%,#7553ed);color:#fff;padding:12px 14px 10px;box-shadow:0 7px 25px #174f9c28}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:12px;font-weight:1000;letter-spacing:.4px}.player{font-size:11px;font-weight:800;opacity:.92;text-align:right}.progress{height:7px;background:#ffffff44;border-radius:999px;overflow:hidden;margin-top:9px}.progress>div{height:100%;width:0;background:#ffe45f;transition:.3s}
.screen{padding:16px}.phasehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.phasehead h1{margin:0;color:#174f9c;font-size:25px}.phasehead p{margin:4px 0 0;color:#6a86a5;font-size:12px;font-weight:800}.scorepill{background:#fff0b4;color:#765800;border-radius:999px;padding:8px 10px;font-weight:1000;font-size:12px;white-space:nowrap}
.card{margin-top:14px;background:#fff;border:2px solid #d4eaff;border-radius:24px;padding:18px;box-shadow:0 10px 28px #184f8a14}.tag{display:inline-block;background:#e9f4ff;color:#2364b8;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:1000}.q{font-size:22px;line-height:1.3;font-weight:1000;color:#17385f;margin:15px 0}.sub{font-size:13px;color:#6985a4;font-weight:800;line-height:1.4}
.options{display:grid;gap:10px}.opt{width:100%;text-align:left;border:2px solid #d6e8f9;border-radius:16px;background:#f8fcff;color:#18395f;padding:14px;font-weight:900;cursor:pointer;min-height:52px}.opt.correct{border-color:#3bc884;background:#eafff2;color:#126443}.opt.wrong{border-color:#ff7692;background:#fff0f4;color:#9b2141}.opt:disabled{cursor:default}
.spell{display:grid;gap:10px}.spell input{width:100%;border:2px solid #c8e3ff;border-radius:16px;padding:15px;font-size:22px;font-weight:1000;text-transform:uppercase;outline:none}.spell input:focus{border-color:#397cff;box-shadow:0 0 0 4px #397cff18}.primary{width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(135deg,#236cff,#39c9ff);color:#fff;font-weight:1000;box-shadow:0 5px 0 #154fa8;cursor:pointer}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #154fa8}.feedback{margin-top:12px;border-radius:14px;padding:11px 12px;font-size:12px;font-weight:900;line-height:1.4}.good{background:#eafff2;color:#15724d}.bad{background:#fff0f4;color:#9b2141}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f0f7ff;border-radius:14px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:19px;color:#174f9c}.stat span{font-size:9px;font-weight:900;color:#6c88a8}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#07172bdc;backdrop-filter:blur(6px)}.hidden{display:none!important}.modal{width:min(470px,94vw);background:#fff;color:#17385f;border-radius:28px;padding:22px;text-align:center;box-shadow:0 22px 70px #0006}.modal .emoji{font-size:64px}.modal h2{margin:6px 0;color:#174f9c;font-size:28px}.modal p{font-weight:800;color:#607d9e;line-height:1.4}.partial{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.box{background:#eef7ff;border-radius:17px;padding:13px}.box strong{display:block;font-size:24px;color:#174f9c}.box span{font-size:10px;font-weight:900;color:#6b86a5}.finalscore{font-size:48px;font-weight:1000;color:#e43f7b}.rankbox{margin:12px 0;text-align:left}.rankrow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;padding:10px 6px;border-bottom:1px solid #e6eff8;font-size:12px;align-items:center}.rankrow b{font-size:17px}.rankrow .who{font-weight:1000}.rankrow small{display:block;color:#7d93ab;font-weight:700}.rankrow .pts{font-weight:1000;color:#e43f7b}
.race{height:90px;background:linear-gradient(180deg,#6fa4d5,#4779ad);border-radius:18px;position:relative;overflow:hidden;margin:12px 0;border:2px solid #c9eaff}.road{position:absolute;left:3%;right:3%;top:50%;height:2px;background:repeating-linear-gradient(90deg,#fff 0 15px,transparent 15px 28px)}.finish{position:absolute;right:3%;top:0;bottom:0;width:18px;background:repeating-linear-gradient(180deg,#fff 0 8px,#26364b 8px 16px)}.car{position:absolute;left:5%;top:50%;transform:translate(-50%,-50%) scaleX(-1);font-size:42px;transition:left .35s}.racecount{text-align:center;font-size:12px;font-weight:1000;color:#54769b}
.exit{display:block;text-align:center;color:#57799c;font-size:11px;font-weight:900;text-decoration:none;margin:14px 0 28px}
</style></head>
<body>
<div class="app">
<header class="top"><div class="topline"><div class="brand">🏆 6º ANO • MOBILE</div><div class="player" id="playerName">CARREGANDO...</div></div><div class="progress"><div id="overallBar"></div></div></header>
<main class="screen" id="screen"></main>
<a class="exit" href="../home.html?serie=6">← Sair para o menu do campeonato</a>
</div>
<div class="overlay" id="startOverlay"><div class="modal"><div class="emoji">🎮</div><h2>Campeonato do 6º ano</h2><p>São 6 fases. Cada fase vale até 100 pontos. Complete todas para adicionar sua pontuação ao ranking do 6º ano.</p><button class="primary" id="startBtn">COMEÇAR PARTIDA</button></div></div>
<div class="overlay hidden" id="phaseOverlay"><div class="modal"><div class="emoji" id="phaseEmoji">⭐</div><h2 id="phaseResultTitle">Fase concluída!</h2><p id="phaseResultText"></p><div class="partial"><div class="box"><strong id="phasePts">0</strong><span>PONTOS NESTA FASE</span></div><div class="box"><strong id="matchPts">0</strong><span>PARCIAL DA PARTIDA</span></div></div><button class="primary" id="nextBtn">PRÓXIMA FASE</button></div></div>
<div class="overlay hidden" id="finalOverlay"><div class="modal"><div class="emoji">🏆</div><h2>CAMPEONATO CONCLUÍDO!</h2><div class="finalscore" id="finalPoints">0 pts</div><p id="finalMessage"></p><div class="rankbox" id="rankBox"></div><button class="primary" id="playAgain">JOGAR NOVAMENTE</button><button class="primary" style="margin-top:10px;background:linear-gradient(135deg,#8d5cff,#ff5ca8);box-shadow:0 5px 0 #6630ac" onclick="location.href='../home.html?serie=6'">VER RANKING COMPLETO</button></div></div>
<script>
const cfg=window.MOBILE_SUPABASE_CONFIG||{},sb=window.supabase?.createClient(cfg.url,cfg.key);
const token=localStorage.getItem('english_mobile_profile_6');
const D=window.GRADE6_DATA;
let profile=null,matchId=null,phase=1,phasePoints=[],idx=0,correct=0,wrong=0,order=[],locked=false,current=null,raceQuestions=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normalize(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z ]/g,'').replace(/\s+/g,' ').trim()}
function totalNow(){return phasePoints.reduce((a,b)=>a+(Number(b)||0),0)}
function overall(){overallBar.style.width=(((phase-1)/6)*100)+'%'}
function mixOptions(q){const pairs=q.o.map((v,i)=>({v,ok:i===q.a}));return shuffle(pairs)}
async function init(){
 if(!sb||!token){location.href='../player.html?serie=6';return}
 const {data}=await sb.rpc('mobile_get_profile',{p_profile_token:token});
 if(!data?.ok||Number(data.grade)!==6){location.href='../player.html?serie=6';return}
 profile=data;playerName.textContent=data.name+' • '+data.class_name;
}
startBtn.onclick=async()=>{
 startBtn.disabled=true;startBtn.textContent='PREPARANDO...';
 const {data,error}=await sb.rpc('mobile_start_match',{p_profile_token:token,p_grade:6,p_mode:'solo'});
 if(error||!data?.ok){startBtn.disabled=false;startBtn.textContent='TENTAR NOVAMENTE';return}
 matchId=data.match_id;phase=1;phasePoints=[];startOverlay.classList.add('hidden');startPhase();
};
function phaseMeta(){
 return [
  null,
  ['🧩','Vocabulary Match','Family Members + Parts of the House'],
  ['🔤','Word Challenge','Ortografia de palavras do 6º ano'],
  ['🎡','There is / There are','Singular, plural e Plural of Nouns'],
  ['⚡','Present Continuous','Sujeito + am/is/are + verbo-ing'],
  ['🚦','Genitive Case','Relações familiares com nome + \'s'],
  ['🏁','Corrida Maluca — FINAL','Chegue a 25 acertos']
 ][phase];
}
function shell(body){
 const m=phaseMeta();screen.innerHTML='<div class="phasehead"><div><h1>'+m[0]+' '+m[1]+'</h1><p>FASE '+phase+' • '+m[2]+'</p></div><div class="scorepill">'+totalNow()+' / 600</div></div>'+body;
 overall();
}
function startPhase(){idx=0;correct=0;wrong=0;locked=false;if(phase===1)startVocab();else if(phase===2)startWords();else if(phase===3)startMCQ(D.grammar,20);else if(phase===4)startMCQ(D.present,20);else if(phase===5)startMCQ(D.genitive,20);else startRace()}
function startVocab(){order=shuffle(D.vocab).slice(0,20);showVocab()}
function showVocab(){
 if(idx>=order.length){finishPhase(Math.round(correct/order.length*100));return}
 const pair=order[idx],wrongOpts=shuffle(D.vocab.filter(x=>x[0]!==pair[0])).slice(0,3).map(x=>x[1]),opts=shuffle([pair[1],...wrongOpts]);
 shell('<div class="card"><span class="tag">PAR '+(idx+1)+' / 20</span><div class="q">'+pair[0]+'</div><div class="sub">Toque na tradução correta.</div><div class="options" id="options"></div><div class="feedback hidden" id="feedback"></div><div class="stats"><div class="stat"><b>'+correct+'</b><span>ACERTOS</span></div><div class="stat"><b>'+wrong+'</b><span>ERROS</span></div><div class="stat"><b>'+Math.round(idx/20*100)+'%</b><span>PROGRESSO</span></div></div></div>');
 opts.forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{if(locked)return;locked=true;const ok=v===pair[1];if(ok)correct++;else wrong++;[...options.children].forEach(x=>{x.disabled=true;if(x.textContent===pair[1])x.classList.add('correct');else if(x===b&&!ok)x.classList.add('wrong')});feedback.className='feedback '+(ok?'good':'bad');feedback.textContent=ok?'✅ Muito bem!':('❌ Resposta correta: '+pair[1]);setTimeout(()=>{idx++;locked=false;showVocab()},650)};options.appendChild(b)});
}
function startWords(){order=shuffle(D.words).slice(0,15);showWord()}
function showWord(){
 if(idx>=order.length){finishPhase(Math.round(correct/order.length*100));return}
 const [word,pt]=order[idx];
 shell('<div class="card"><span class="tag">PALAVRA '+(idx+1)+' / 15</span><div class="q">'+pt+'</div><div class="sub">Digite a palavra em inglês.</div><div class="spell"><input id="spellInput" maxlength="24" autocapitalize="characters" autocomplete="off" placeholder="DIGITE AQUI"><button class="primary" id="checkWord">CONFIRMAR</button></div><div class="feedback hidden" id="feedback"></div><div class="stats"><div class="stat"><b>'+correct+'</b><span>ACERTOS</span></div><div class="stat"><b>'+wrong+'</b><span>ERROS</span></div><div class="stat"><b>'+Math.round(idx/15*100)+'%</b><span>PROGRESSO</span></div></div></div>');
 checkWord.onclick=()=>{if(locked)return;const answer=normalize(spellInput.value);if(!answer)return;locked=true;const ok=answer===normalize(word);if(ok)correct++;else wrong++;spellInput.disabled=true;checkWord.disabled=true;feedback.className='feedback '+(ok?'good':'bad');feedback.textContent=ok?'✅ Correto!':('❌ A resposta era '+word+'.');setTimeout(()=>{idx++;locked=false;showWord()},850)}
}
function startMCQ(bank,count){order=shuffle(bank).slice(0,count);showMCQ()}
function showMCQ(){
 if(idx>=order.length){finishPhase(Math.round(correct/order.length*100));return}
 current=order[idx];const opts=mixOptions(current);
 shell('<div class="card"><span class="tag">'+current.t+' • '+(idx+1)+' / '+order.length+'</span><div class="q">'+current.q+'</div><div class="options" id="options"></div><div class="feedback hidden" id="feedback"></div><div class="stats"><div class="stat"><b>'+correct+'</b><span>ACERTOS</span></div><div class="stat"><b>'+wrong+'</b><span>ERROS</span></div><div class="stat"><b>'+Math.round(idx/order.length*100)+'%</b><span>PROGRESSO</span></div></div></div>');
 opts.forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x.v;b.onclick=()=>{if(locked)return;locked=true;if(x.ok)correct++;else wrong++;[...options.children].forEach((z,i)=>{z.disabled=true;const found=opts[i];if(found.ok)z.classList.add('correct');else if(z===b&&!x.ok)z.classList.add('wrong')});feedback.className='feedback '+(x.ok?'good':'bad');feedback.textContent=(x.ok?'✅ Correto! ':'❌ ')+(current.e||'');setTimeout(()=>{idx++;locked=false;showMCQ()},850)};options.appendChild(b)})
}
function startRace(){
 raceQuestions=[
  ...D.grammar,...D.present,...D.genitive,
  ...D.vocab.slice(0,18).map(x=>({t:'Vocabulary',q:x[0].toUpperCase()+' significa:',o:shuffle([x[1],...shuffle(D.vocab.filter(y=>y[0]!==x[0])).slice(0,3).map(y=>y[1])]),a:null,e:x[0].toUpperCase()+' = '+x[1]}))
 ];
 raceQuestions.forEach(q=>{if(q.a===null||q.a===undefined){q.a=q.o.indexOf(D.vocab.find(x=>q.q.startsWith(x[0].toUpperCase()))?.[1])}});
 order=shuffle(raceQuestions);idx=0;showRace();
}
function showRace(){
 if(correct>=25){finishPhase(100);return}
 if(idx>=order.length){order=shuffle(raceQuestions);idx=0}
 current=order[idx];const opts=mixOptions(current),pct=Math.min(100,correct/25*100);
 shell('<div class="race"><div class="road"></div><div class="finish"></div><div class="car" style="left:'+(5+pct*.9)+'%">🏎️</div></div><div class="racecount">'+correct+' / 25 ACERTOS ATÉ A CHEGADA</div><div class="card"><span class="tag">'+current.t+'</span><div class="q">'+current.q+'</div><div class="options" id="options"></div><div class="feedback hidden" id="feedback"></div><div class="stats"><div class="stat"><b>'+correct+'</b><span>ACERTOS</span></div><div class="stat"><b>'+wrong+'</b><span>ERROS</span></div><div class="stat"><b>'+Math.round(pct)+'%</b><span>CORRIDA</span></div></div></div>');
 opts.forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x.v;b.onclick=()=>{if(locked)return;locked=true;if(x.ok)correct++;else wrong++;[...options.children].forEach((z,i)=>{z.disabled=true;const found=opts[i];if(found.ok)z.classList.add('correct');else if(z===b&&!x.ok)z.classList.add('wrong')});feedback.className='feedback '+(x.ok?'good':'bad');feedback.textContent=x.ok?'✅ O carro avançou!':'❌ Tente a próxima. O carro só avança com acerto.';setTimeout(()=>{idx++;locked=false;showRace()},650)};options.appendChild(b)})
}
async function finishPhase(points){
 points=Math.max(0,Math.min(100,Number(points)||0));
 const {data,error}=await sb.rpc('mobile_submit_phase',{p_profile_token:token,p_match_id:matchId,p_phase:phase,p_points:points,p_correct:correct,p_wrong:wrong});
 if(error||!data?.ok){alert('Não foi possível salvar a fase. Verifique sua internet e tente novamente.');return}
 phasePoints[phase-1]=points;
 phasePts.textContent=points;matchPts.textContent=totalNow();phaseResultTitle.textContent='Fase '+phase+' concluída!';
 phaseResultText.textContent=correct+' acertos • '+wrong+' erros. Sua pontuação foi salva nesta partida.';
 phaseEmoji.textContent=phase===6?'🏁':'⭐';
 nextBtn.textContent=phase===6?'VER RESULTADO FINAL':'PRÓXIMA FASE';
 phaseOverlay.classList.remove('hidden');
}
nextBtn.onclick=async()=>{
 phaseOverlay.classList.add('hidden');
 if(phase<6){phase++;startPhase();return}
 const {data,error}=await sb.rpc('mobile_complete_match',{p_profile_token:token,p_match_id:matchId});
 if(error||!data?.ok){alert('Não foi possível concluir a partida.');return}
 finalPoints.textContent=data.match_points+' pts';
 let msg='Você agora tem '+data.cumulative_points+' pontos em '+data.games+' partida'+(Number(data.games)===1?'':'s')+'.';
 if(Number(data.rank_position)>1&&Number(data.points_to_next)>0)msg+=' Faltam '+data.points_to_next+' pontos para alcançar a próxima posição.';
 else if(Number(data.rank_position)===1)msg+=' Você está no topo do ranking do 6º ano! 🥇';
 finalMessage.textContent=msg+' Jogue novamente para continuar subindo!';
 await loadTop();
 finalOverlay.classList.remove('hidden');overallBar.style.width='100%';
}
async function loadTop(){
 const {data}=await sb.rpc('mobile_grade_leaderboard',{p_grade:6,p_limit:5});
 if(!data?.length){rankBox.innerHTML='';return}
 rankBox.innerHTML='<h3 style="text-align:center;color:#174f9c">🏆 TOP 5 — 6º ANO</h3>'+data.map(r=>'<div class="rankrow"><b>'+(Number(r.rank_position)===1?'🥇':Number(r.rank_position)===2?'🥈':Number(r.rank_position)===3?'🥉':r.rank_position+'º')+'</b><div class="who">'+r.name+'<small>'+r.school+' • '+r.games+' partida'+(Number(r.games)===1?'':'s')+'</small></div><div class="pts">'+r.total_points+' pts</div></div>').join('');
}
playAgain.onclick=()=>location.reload();
init();
</script>
</body></html>

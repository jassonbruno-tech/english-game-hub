<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1265e8"><title>Identificação do jogador</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#38c4ff,#1667ea 58%,#4023a7);color:#fff;padding:18px}.wrap{width:min(500px,100%);margin:auto}.top{text-align:center;padding:16px 4px}.top .icon{font-size:56px}.top h1{margin:4px 0;font-size:30px}.top p{margin:0;color:#eaf7ff;font-weight:700}.card{background:#fff;color:#17385f;border-radius:28px;padding:20px;box-shadow:0 20px 60px #071b6055}.series{display:inline-block;border-radius:999px;background:#e8f3ff;color:#1556ae;padding:7px 12px;font-size:12px;font-weight:1000}.field{margin-top:14px}.field label{display:block;margin:0 0 6px;font-size:13px;font-weight:1000;color:#315a87}.field input{width:100%;border:2px solid #c9e4ff;border-radius:15px;padding:14px 13px;font-size:16px;font-weight:800;color:#17385f;outline:none}.field input:focus{border-color:#377fff;box-shadow:0 0 0 4px #377fff18}.btn{width:100%;border:0;border-radius:16px;padding:15px;margin-top:18px;background:linear-gradient(135deg,#236cff,#38c9ff);color:#fff;font-size:17px;font-weight:1000;box-shadow:0 6px 0 #1450ac;cursor:pointer}.btn:disabled{opacity:.55}.status{min-height:24px;margin-top:12px;text-align:center;font-size:12px;font-weight:900;color:#d13c67}.back{display:block;text-align:center;color:#fff;margin-top:18px;font-size:13px;font-weight:900;text-decoration:none}.privacy{font-size:10px;line-height:1.4;color:#7890aa;margin:12px 2px 0;text-align:center}
</style></head>
<body><main class="wrap">
<section class="top"><div class="icon">🎮</div><h1>Identificação do jogador</h1><p>Preencha seus dados para entrar no campeonato.</p></section>
<section class="card">
  <div class="series" id="seriesBadge">6º ANO</div>
  <div class="field"><label>Seu nome</label><input id="name" maxlength="60" autocomplete="name" placeholder="Ex.: João Pedro"></div>
  <div class="field"><label>Turma</label><input id="className" maxlength="30" placeholder="Ex.: 601"></div>
  <div class="field"><label>Escola</label><input id="school" maxlength="100" placeholder="Ex.: Escola Delfina de Jesus Amorim"></div>
  <button class="btn" id="enterBtn">ENTRAR NO CAMPEONATO</button>
  <div class="status" id="status"></div>
  <p class="privacy">Esses dados identificam seu perfil no ranking da série. Este aparelho recebe um identificador próprio para manter sua pontuação acumulada.</p>
</section>
<a class="back" href="index.html">← Voltar para escolher a série</a>
</main>
<script>
const params=new URLSearchParams(location.search),grade=Math.max(6,Math.min(9,Number(params.get('serie')||6))),challengeId=params.get('desafio');
document.getElementById('seriesBadge').textContent=grade+'º ANO';
const cfg=window.MOBILE_SUPABASE_CONFIG||{};
const sb=window.supabase?.createClient(cfg.url,cfg.key);
const key='english_mobile_profile_'+grade;
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
let token=localStorage.getItem(key)||uuid();localStorage.setItem(key,token);
async function loadExisting(){
  if(!sb)return;
  const {data}=await sb.rpc('mobile_get_profile',{p_profile_token:token});
  if(data?.ok&&Number(data.grade)===grade){
    name.value=data.name||'';className.value=data.class_name||'';school.value=data.school||'';
    status.textContent='Perfil encontrado neste aparelho. Você pode continuar ou atualizar seus dados.';
    status.style.color='#19734a';
  }
}
enterBtn.onclick=async()=>{
  status.style.color='#d13c67';
  const n=name.value.trim(),c=className.value.trim(),s=school.value.trim();
  if(n.length<2||!c||s.length<2){status.textContent='Preencha nome, turma e escola.';return}
  if(!sb){status.textContent='Não foi possível conectar ao campeonato.';return}
  enterBtn.disabled=true;enterBtn.textContent='ENTRANDO...';
  const {data,error}=await sb.rpc('mobile_register_player',{p_profile_token:token,p_name:n,p_class_name:c,p_school:s,p_grade:grade});
  if(error||!data?.ok){status.textContent='Não foi possível salvar seu perfil. Tente novamente.';enterBtn.disabled=false;enterBtn.textContent='ENTRAR NO CAMPEONATO';return}
  localStorage.setItem('english_mobile_active_grade',String(grade));
  location.href=challengeId?('challenge.html?serie='+grade+'&id='+encodeURIComponent(challengeId)):('home.html?serie='+grade);
};
loadExisting();
</script></body></html>

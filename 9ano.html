<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#ff6a00;
  overflow:hidden;
}

body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.stage{
  position:relative;
  width:min(100vw,520px);
  height:100dvh;
  overflow:hidden;
  background:#ff6a00;
  box-shadow:0 0 40px rgba(0,0,0,.35);
}

.bg{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#ff6a00;
}

.back{
  position:absolute;
  z-index:20;
  left:3.2%;
  top:1.2%;
  text-decoration:none;
  color:#fff;
  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.45);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:900;
  backdrop-filter:blur(4px);
  box-shadow:0 6px 14px rgba(0,0,0,.25);
}

.sound-btn{
  position:absolute;
  z-index:20;
  right:3.2%;
  top:1.2%;
  border:1px solid rgba(255,255,255,.48);
  background:rgba(0,0,0,.42);
  color:#fff;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:900;
  backdrop-filter:blur(4px);
  box-shadow:0 6px 14px rgba(0,0,0,.25);
  cursor:pointer;
}

.game-link{
  position:absolute;
  z-index:10;
  display:block;
  border-radius:22px;
  text-decoration:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.game-link:active{
  background:rgba(255,255,255,.14);
  box-shadow:0 0 22px rgba(255,255,255,.65), inset 0 0 18px rgba(255,255,255,.18);
}

.game-link span{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
}

/*
  Áreas clicáveis ajustadas para a imagem assinada.
  Correção: antes a área do Hangman estava grande demais e podia invadir
  a região do Listening em algumas telas. Agora cada card tem uma área

*/

.btn-spin{
  left:7.6%;

.btn-hangman{

<main class="stage">
  <img
    class="bg"
    src="9ano-tela-inicial-laranja-assinada.png?v=2"
    alt="English Game Hub - 9º Ano"
  />

  <a class="back" href="index.html">← Hub</a>
  <button class="sound-btn" onclick="toggleMusic()">🎵 Música</button>

  <a class="game-link btn-spin" href="9ano-spin-challenge.html?v=190" aria-label="Entrar no Spin Challenge">
    <span>Spin Challenge</span>
  </a>

  <a class="game-link btn-hangman" href="9ano-hangman-challenge.html?v=190" aria-label="Entrar no Hangman Challenge">
    <span>Hangman Challenge</span>
  </a>

  <a class="game-link btn-listening" href="9ano-listening-speaking-game.html?v=190" aria-label="Entrar no Listening and Speaking">
    <span>Listening and Speaking</span>
  </a>

  <a class="game-link btn-smart" href="9ano-smart-choice-grammar.html?v=190" aria-label="Entrar no Smart Choice Grammar">
    <span>Smart Choice Grammar</span>
  </a>
</main>

<audio id="bgMusic" loop preload="auto">
  <source src="9ano-musica-tela-inicial.mp3" type="audio/mpeg">
</audio>

<script>
let musicOn = false;

function toggleMusic(){
  const audio = document.getElementById("bgMusic");
  const btn = document.querySelector(".sound-btn");

  if(!audio || !btn) return;

  if(!musicOn){
    audio.volume = 0.35;
    audio.play()
      .then(() => {
        musicOn = true;
        btn.textContent = "🔇 Pausar";
      })
      .catch(() => {
        btn.textContent = "🎵 Música";
      });
  }else{
    audio.pause();
    musicOn = false;
    btn.textContent = "🎵 Música";
  }
}
</script>

</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banco de Questões — 9º Ano Spin Challenge</title>
<style>
:root{
  --bg1:#11071f;--bg2:#220c3e;--card:rgba(255,255,255,.095);--line:rgba(255,255,255,.18);
  --text:#fff;--muted:rgba(255,255,255,.76);--accent:#ffd166;--pink:#ff4fd8;--cyan:#00e5ff;--green:#70e000;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#4d1d95 0%,var(--bg2) 35%,var(--bg1) 100%);color:var(--text);min-height:100vh}
.wrap{width:min(1120px,96vw);margin:0 auto;padding:18px 0 40px}
header{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(255,79,216,.18),rgba(0,229,255,.12));box-shadow:0 18px 50px rgba(0,0,0,.3)}
h1{margin:0;font-size:clamp(1.7rem,4vw,3.2rem);line-height:1.05}
.subtitle{margin:8px 0 0;color:var(--muted);font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--accent)} .stat span{font-size:.8rem;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:5;margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:20px;background:rgba(17,7,31,.92);backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
select,input,button{font:inherit;border:none;border-radius:14px;padding:12px}
select,input{background:#fff;color:#1d1430;min-width:0}
button{background:linear-gradient(135deg,var(--pink),var(--cyan));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.bank{display:grid;gap:14px}
.qcard{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:15px;box-shadow:0 12px 34px rgba(0,0,0,.22)}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.08);font-size:.85rem;color:#fff}
.badge.phase{color:#111;background:var(--accent);font-weight:900}
.qtext{white-space:pre-wrap;line-height:1.5;margin:8px 0 12px;font-size:1rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.opt{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:10px}
.opt.correct{outline:2px solid var(--green);background:rgba(112,224,0,.16)}
.answer{font-weight:900;color:var(--green);margin:10px 0}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:800}
.exp{line-height:1.48;color:var(--text);white-space:pre-wrap}
.codebox{display:none;white-space:pre-wrap;background:#0b0714;border:1px solid var(--line);border-radius:18px;padding:14px;max-height:420px;overflow:auto;color:#eae6ff}
.footer{margin-top:22px;text-align:center;color:var(--muted);font-size:.9rem}
.warn{margin:12px 0 0;color:#ffd166;font-weight:700}
@media(max-width:720px){
  .wrap{width:94vw;padding-top:10px}.stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{grid-template-columns:1fr;position:static}.opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🎡 Banco de Questões — 9º Ano</h1>
  <p class="subtitle">Spin Challenge • Banco refinado • 2º bimestre com revisão do 1º bimestre.</p>
  <p class="warn">Arquivo exclusivo do banco de questões. Não altera roleta, sons, fases, corações, cadastro nem overlay do jogo.</p>
  <div class="stats">
    <div class="stat"><b id="totalCount">180</b><span>questões</span></div>
    <div class="stat"><b>6</b><span>fases</span></div>
    <div class="stat"><b>30</b><span>por fase</span></div>
    <div class="stat"><b>9º</b><span>ano</span></div>
  </div>
</header>
<div class="toolbar">
  <select id="phaseFilter" onchange="renderBank()"><option value="all">Todas as fases</option></select>
  <select id="themeFilter" onchange="renderBank()"><option value="all">Todos os temas</option></select>
  <input id="search" oninput="renderBank()" placeholder="Buscar palavra, aluno ou conteúdo..." />
  <button onclick="copyJS()">Copiar banco JS</button>
  <button onclick="toggleCode()">Mostrar/ocultar JS</button>
</div>
<div id="bank" class="bank"></div>
<pre id="codebox" class="codebox"></pre>
<div class="footer">Jogo idealizado pelo Prof. Jasson Bruno.</div>
</div>

<script>
const PHASES_9ANO = [
  {id:1,title:"Warm-up Challenge",focus:"Aquecimento geral: conectivos, sentimentos, passado, prefixos e sufixos"},
  {id:2,title:"Connectors Mission",focus:"because, so, but, although, however, therefore e also"},
  {id:3,title:"Feelings Arena",focus:"feelings, emotions, am/is/are e respostas curtas"},
  {id:4,title:"Prefix Power",focus:"un-, in-, im-, dis-, re-, pre-, mis-, anti- e multi-"},
  {id:5,title:"Suffix Battle",focus:"-er, -or, -ly, -ful, -less, -ness, -ment, -tion e -able"},
  {id:6,title:"Final Boss",focus:"mistura final com revisão do 1º bimestre"}
];

// ATENÇÃO:
// Este banco segue a estrutura do jogo: phase, theme, q, o, a, e.
// As alternativas podem ser embaralhadas depois no HTML do jogo oficial.

    "o": [

function optionLabel(i){return ["A","B","C","D","E"][i] || String(i+1)}
function fillFilters(){
  const phaseFilter = document.getElementById("phaseFilter");
  PHASES_9ANO.forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p.id; opt.textContent=`Fase ${p.id} — ${p.title}`;
    phaseFilter.appendChild(opt);
  });
  const themes=[...new Set(QUESTION_BANK_9ANO.map(q=>q.theme))].sort();
  const themeFilter=document.getElementById("themeFilter");
  themes.forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t; opt.textContent=t;
    themeFilter.appendChild(opt);
  });
}
function renderBank(){
  const phase=document.getElementById("phaseFilter").value;
  const theme=document.getElementById("themeFilter").value;
  const search=document.getElementById("search").value.toLowerCase().trim();
  const bank=document.getElementById("bank");
  let rows=QUESTION_BANK_9ANO.filter(q=>{
    const okPhase=phase==="all" || String(q.phase)===String(phase);
    const okTheme=theme==="all" || q.theme===theme;
    const hay=(q.q+" "+q.o.join(" ")+" "+q.a+" "+q.e+" "+q.theme).toLowerCase();
    const okSearch=!search || hay.includes(search);
    return okPhase && okTheme && okSearch;
  });
  document.getElementById("totalCount").textContent=rows.length;
  bank.innerHTML=rows.map((q,idx)=>{
    const phaseInfo=PHASES_9ANO.find(p=>p.id===q.phase);
    const opts=q.o.map((op,i)=>`<div class="opt ${op===q.a?'correct':''}"><b>${optionLabel(i)})</b> ${escapeHtml(op)}</div>`).join("");
    return `<article class="qcard">
      <div class="qtop">
        <span class="badge phase">Fase ${q.phase} — ${escapeHtml(phaseInfo?.title || "")}</span>
        <span class="badge">${escapeHtml(q.theme)}</span>
        <span class="badge">Questão ${idx+1}</span>
      </div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div class="opts">${opts}</div>
      <div class="answer">Resposta: ${escapeHtml(q.a)}</div>
      <details open><summary>Feedback / vocabulário / tradução</summary><div class="exp">${escapeHtml(q.e)}</div></details>
    </article>`;
  }).join("");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function copyJS(){
  const js=`const PHASES_9ANO = ${JSON.stringify(PHASES_9ANO,null,2)};\n\nconst QUESTION_BANK_9ANO = ${JSON.stringify(QUESTION_BANK_9ANO,null,2)};`;
  navigator.clipboard.writeText(js).then(()=>alert("Banco JS copiado."));
}
function toggleCode(){
  const box=document.getElementById("codebox");
  if(box.style.display==="block"){box.style.display="none";return;}
  box.textContent=`const PHASES_9ANO = ${JSON.stringify(PHASES_9ANO,null,2)};\n\nconst QUESTION_BANK_9ANO = ${JSON.stringify(QUESTION_BANK_9ANO,null,2)};`;
  box.style.display="block";
}
fillFilters(); renderBank();

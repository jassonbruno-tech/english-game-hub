<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07142f"><title>Jogo da Forca — Turma 703</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07142f;font-family:Arial,Helvetica,sans-serif}.cover{position:fixed;inset:0;overflow:hidden;background:#07142f;z-index:10}.stage{position:absolute;left:50%;top:50%;width:941px;height:1672px;transform-origin:center center}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}.field{position:absolute;left:31.5%;width:43.5%;height:3.05%;border:0;outline:0;background:transparent;color:#122b5e;font-weight:800;font-size:22px;line-height:1;padding:4px 14px;border-radius:999px}.field:focus{background:rgba(255,255,255,.13);box-shadow:0 0 0 4px rgba(255,201,42,.48)}#n{top:76.6%}#s{top:82.55%}#c{top:88.45%}.start{position:absolute;left:36%;top:92%;width:28%;height:2.9%;border:0;border-radius:999px;background:linear-gradient(180deg,#ffe66d,#ffb703);color:#07326b;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.32)}.start:active{transform:scale(.97)}.back{position:absolute;left:22px;top:24px;z-index:3;padding:11px 17px;border-radius:999px;background:rgba(2,18,55,.62);border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;font-size:19px;font-weight:900}.msg{position:absolute;left:23%;right:23%;top:95.2%;text-align:center;color:#fff7c2;font-size:14px;font-weight:900;text-shadow:0 2px 5px #000;min-height:18px}#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#07142f;z-index:5}</style></head><body><div class="cover" id="cover"><div class="stage" id="stage"><img class="art" src="703-jogo-da-forca-nova-capa.png" alt="Capa do Jogo da Forca"><a class="back" href="index_turma_703_english_game_hub.html">← Hub</a><input id="n" class="field" autocomplete="name" aria-label="Nome do aluno"><input id="s" class="field" autocomplete="organization" aria-label="Escola"><input id="c" class="field" aria-label="Turma" inputmode="numeric"><button id="startBtn" class="start" type="button">COMEÇAR ▶</button><div class="msg" id="msg"></div></div></div><iframe id="game" src="703-quanticompare-hangman-core.html" title="Jogo da Forca"></iframe><script>const stage=document.getElementById('stage'),frame=document.getElementById('game');let ready=false,pending=false;function fit(){const sc=Math.max(innerWidth/941,innerHeight/1672);stage.style.transform=`translate(-50%,-50%) scale(${sc})`}addEventListener('resize',fit,{passive:true});addEventListener('orientationchange',fit);fit();frame.addEventListener('load',()=>{ready=true;if(pending)openGame()});function val(){for(const id of ['n','s','c']){const e=document.getElementById(id);if(!e.value.trim()){msg.textContent='Preencha os três campos para começar.';e.focus();return false}}msg.textContent='';return true}function openGame(){if(!val()){pending=false;return}if(!ready){pending=true;msg.textContent='Carregando o jogo...';return}const w=frame.contentWindow,d=w.document;[['playerName',n.value.trim()],['playerSchool',s.value.trim()],['playerClass',c.value.trim()]].forEach(([id,v])=>{const e=d.getElementById(id);if(e)e.value=v});let ok=false;if(typeof w.startGame==='function'){w.startGame();ok=true}else{const b=d.querySelector('.cover-start-action,button[onclick*="startGame"]');if(b){b.click();ok=true}}if(ok){cover.style.display='none';frame.style.display='block'}else msg.textContent='Não foi possível iniciar. Toque novamente.'}startBtn.onclick=openGame;c.addEventListener('keydown',e=>{if(e.key==='Enter')openGame()});</script></body></html>

<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial;background:linear-gradient(160deg,#05091e,#11104a 55%,#3c0a4f);color:#fff}.app{width:min(100%,720px);margin:auto;padding:12px}.card{background:rgba(9,15,52,.92);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px}.screen{display:none}.screen.active{display:block}h1{text-align:center;color:#ffe66d}.btn{width:100%;padding:13px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffe66d,#22c55e);font-weight:1000;cursor:pointer;text-decoration:none;color:#172033;display:block;text-align:center}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pill{padding:8px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center;font-weight:900}.word{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0}.box{width:30px;height:38px;background:#fff;color:#1d4ed8;border-radius:9px;display:grid;place-items:center;font-weight:1000}.space{width:16px}.hint{background:rgba(255,230,109,.1);padding:10px;border-radius:14px;color:#fff7c2;font-weight:850}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.key{padding:9px 0;border:0;border-radius:9px;font-weight:1000;cursor:pointer}.key:disabled{opacity:.4}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:40;padding:18px}.overlay.show{display:flex}.modal{width:min(100%,430px);background:linear-gradient(160deg,#111c58,#4a1262);border-radius:28px;padding:24px;text-align:center}.big{font-size:64px}.modal h2{color:#ffe66d;font-size:32px}.rank{display:grid;gap:6px}.row{display:grid;grid-template-columns:40px 1fr auto;gap:6px;background:#fff;color:#172033;border-radius:12px;padding:8px}.row.top{background:linear-gradient(135deg,#ffe66d,#fff7c2)}.row.you{outline:3px solid #00eaff}input{width:100%;padding:12px;border-radius:12px;border:2px solid #93c5fd;margin:5px 0;font-weight:800}</style></head><body><main class="app [2,[["GRANDMOTHER","Family Members","Significa avó."],["GRANDFATHER","Family Members","Significa avô."],["LIVE WITH","Family Life","Expressão usada para dizer com quem você mora."],["BIG FAMILY","Family Life","Família grande."],["SMALL FAMILY","Family Life","Família pequena."],["WHAT ARE YOU DOING","Present Information","Pergunta sobre o que você está fazendo agora."],["WHERE ARE THEY","Present Information","Pergunta onde eles estão."],["WHO IS SHE","Present Information","Pergunta quem ela é."],["COOKING","Present Continuous","Significa cozinhando."],["RUNNING","Present Continuous","Significa correndo."],["TALKING","Present Continuous","Significa conversando."],["WRITING","Present Continuous","Significa escrevendo."],["SOME","Quantifiers","Significa alguns ou algumas."],["A FEW","Quantifiers","Significa alguns poucos."],["NOT MANY","Quantifiers","Significa não muitos ou poucos."],["OLDER","Comparatives","Mais velho."],["YOUNGER","Comparatives","Mais jovem."],["FASTER","Comparatives","Mais rápido."]]],

];
const HKEY="703-hang-seen-v4";let S={};const $=i=>document.getElementById(i);function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seen(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){return[]}}function fresh(l){let pool=data[l][1].map((x,i)=>({id:`H${l+1}-${i}`,word:x[0],theme:x[1],hint:x[2]})),s=new Set(seen()),c=[...sh(pool.filter(x=>!s.has(x.id))),...sh(pool.filter(x=>s.has(x.id)))].slice(0,5);try{localStorage.setItem(HKEY,JSON.stringify([...seen(),...c.map(x=>x.id)].filter((v,i,a)=>a.indexOf(v)===i).slice(-400)))}catch(e){}return c}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}function start(){let n=$("name").value.trim();if(!n)return alert("Digite o nome.");S={name:n,klass:$("klass").value||"703",school:$("school").value||"Escola Municipal Princesa Izabel",phase:0,round:0,score:0,correct:0,lives:MAX,deck:fresh(0),guess:new Set};show("play");load()}
function load(){S.cur=S.deck[S.round];S.guess=new Set;$("phase").textContent=`Fase ${S.phase+1}/6`;$("round").textContent=`${S.round+1}/5`;$("score").textContent=`${S.score} pts`;$("lives").textContent="❤️".repeat(S.lives)+"🖤".repeat(MAX-S.lives);$("theme").textContent=S.cur.theme;$("hint").textContent="💡 "+S.cur.hint;renderWord();$("keys").innerHTML="";letters.forEach(l=>{let b=document.createElement("button");b.className="key";b.textContent=l;b.onclick=()=>pick(l,b);$("keys").appendChild(b)})}
function renderWord(){$("word").innerHTML="";[...S.cur.word].forEach(c=>{let d=document.createElement("div");if(c===" "){d.className="space"}else{d.className="box";d.textContent=S.guess.has(c)?c:""}$("word").appendChild(d)})}
function pick(l,b){b.disabled=true;if(S.cur.word.includes(l)){S.guess.add(l);renderWord();if([...S.cur.word].every(c=>c===" "||S.guess.has(c))){S.score+=100+S.phase*25;S.correct++;setTimeout(next,350)}}else{S.lives--;$("lives").textContent="❤️".repeat(S.lives)+"🖤".repeat(MAX-S.lives);if(S.lives<=0)setTimeout(()=>trans(false),250)}}
function next(){S.round++;if(S.round>=5)return trans(true);load()}function trans(win){let last=S.phase===5;$("ov").classList.add("show");$("oi").textContent=win?"🏆✨":"💪❤️";$("ot").textContent=win?(last?"FINAL LEVEL!":"LEVEL COMPLETE!"):"TRY AGAIN!";$("om").textContent=win?(last?"Você concluiu o Hangman!":`Você concluiu a Fase ${S.phase+1}.`):`As vidas acabaram na Fase ${S.phase+1}. Tente novamente com desafios diferentes.`;$("ob").textContent=win?(last?"VER RANKING 🏆":`COMEÇAR FASE ${S.phase+2} 🚀`):`TENTAR FASE ${S.phase+1} NOVAMENTE 🔁`;$("ob").onclick=()=>{$("ov").classList.remove("show");if(win){if(last)return finish();S.phase++;S.round=0;S.lives=MAX;S.deck=fresh(S.phase);load()}else{S.round=0;S.lives=MAX;S.deck=fresh(S.phase);load()}}}
function finish(){let p=Math.round(S.correct/30*100);$("final").textContent=`${S.name}, sua pontuação para o ranking é ${p}.`;show("end");if(window.saveScore)window.saveScore(S.name,p,GAME,S.school,S.klass);if(window.loadRank)window.loadRank(GAME,"ranking",S.name,S.school)}

<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp,query,limit,onSnapshot}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";const db=getFirestore(initializeApp({apiKey:"AIzaSyCVTR3nnyo5mYTF28TJisgTUe-Xyjk1upg",authDomain:"english-game-hub.firebaseapp.com",projectId:"english-game-hub",storageBucket:"english-game-hub.firebasestorage.app",messagingSenderId:"131880771426",appId:"1:131880771426:web:cf29a6f34ca86be527d63b"}));window.saveScore=async(n,p,j,e,t)=>{try{await addDoc(collection(db,"pontuacoes"),{nome:n.slice(0,24),pontos:Number(p)||0,jogo:j,escola:e,turma:t||"703",tipo:"real",timestamp:serverTimestamp()})}catch(x){}};window.loadRank=(j,id,cn,cs)=>{let box=document.getElementById(id),q=query(collection(db,"pontuacoes"),limit(900));onSnapshot(q,s=>{let m=new Map;s.forEach(d=>{let x=d.data();if(x.jogo!==j)return;let k=(x.nome||"").toLowerCase()+"|"+(x.escola||"").toLowerCase(),p=Number(x.pontos)||0,a=m.get(k);if(!a||p>a.pontos)m.set(k,{nome:x.nome,escola:x.escola,pontos:p})});let a=[...m.values()].sort((x,y)=>y.pontos-x.pontos);box.innerHTML="";a.slice(0,10).forEach((x,i)=>{let r=document.createElement("div"),you=x.nome?.toLowerCase()===cn?.toLowerCase()&&x.escola?.toLowerCase()===cs?.toLowerCase();r.className="row "+(i<3?"top ":"")+(you?"you":"");r.innerHTML=`<b>${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1+"º"}</b><span><b>${x.nome}${you?" ⭐ Você":""}</b><br><small>${x.escola||""}</small></span><b>${x.pontos} pts</b>`;box.appendChild(r)})})};</script></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07142f"><title>Jogo da Forca — Turma 703</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07142f;font-family:Arial,Helvetica,sans-serif}.cover{position:fixed;inset:0;overflow:hidden;background:#07142f;z-index:10}.stage{position:absolute;left:50%;top:50%;width:941px;height:1672px;transform-origin:center center}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}.field{position:absolute;left:31.5%;width:43.5%;height:3.05%;border:0;outline:0;background:transparent;color:#122b5e;font-weight:800;font-size:22px;line-height:1;padding:4px 14px;border-radius:999px}.field:focus{background:rgba(255,255,255,.13);box-shadow:0 0 0 4px rgba(255,201,42,.48)}#n{top:76.6%}#s{top:82.55%}#c{top:88.45%}.start{position:absolute;left:36%;top:92%;width:28%;height:2.9%;border:0;border-radius:999px;background:linear-gradient(180deg,#ffe66d,#ffb703);color:#07326b;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.32)}.start:active{transform:scale(.97)}.back{position:absolute;left:22px;top:24px;z-index:3;padding:13px 20px;border-radius:999px;background:linear-gradient(180deg,rgba(9,46,111,.96),rgba(2,18,55,.96));border:2px solid rgba(255,230,109,.82);color:#fff;text-decoration:none;font-size:22px;font-weight:1000;letter-spacing:.7px;box-shadow:0 5px 16px rgba(0,0,0,.35),0 0 16px rgba(255,230,109,.2)}.msg{position:absolute;left:18%;right:18%;top:95.2%;text-align:center;color:#fff7c2;font-size:15px;font-weight:1000;text-shadow:0 2px 5px #000;min-height:20px}#game{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden;pointer-events:none;background:#07142f;z-index:5}</style></head><body><div class="cover" id="cover"><div class="stage" id="stage"><img class="art" src="703-jogo-da-forca-nova-capa.png" alt="Capa do Jogo da Forca"><a class="back" href="index_turma_703_english-game-hub.html" onerror="this.href='index_turma_703_english_game_hub.html'">← VOLTAR</a><input id="n" class="field" autocomplete="name" aria-label="Nome do aluno"><input id="s" class="field" autocomplete="organization" aria-label="Escola"><input id="c" class="field" aria-label="Turma"><button id="startBtn" class="start" type="button">COMEÇAR ▶</button><div class="msg" id="msg"></div></div></div><iframe id="game" src="703-quanticompare-hangman-core.html?v=46" title="Jogo da Forca"></iframe><script>
const stage=document.getElementById('stage'),frame=document.getElementById('game'),nameInput=document.getElementById('n'),schoolInput=document.getElementById('s'),classInput=document.getElementById('c'),msg=document.getElementById('msg'),cover=document.getElementById('cover'),startBtn=document.getElementById('startBtn');
function fit(){const sc=Math.max(innerWidth/941,innerHeight/1672);stage.style.transform=`translate(-50%,-50%) scale(${sc})`}addEventListener('resize',fit,{passive:true});addEventListener('orientationchange',fit);fit();
function val(){for(const e of [nameInput,schoolInput,classInput]){if(!e.value.trim()){msg.textContent='Preencha os três campos para começar.';e.focus();return false}}return true}
function transferAndStart(){const w=frame.contentWindow,d=w.document;if(!d||typeof w.restart!=='function')return false;[['playerName',nameInput.value.trim()],['playerSchool',schoolInput.value.trim()],['playerClass',classInput.value.trim()]].forEach(([id,v])=>{const e=d.getElementById(id);if(e)e.value=v});w.restart();cover.style.display='none';frame.style.visibility='visible';frame.style.pointerEvents='auto';return true}
function openGame(){if(!val())return;document.activeElement&&document.activeElement.blur();startBtn.disabled=true;msg.textContent='Abrindo o jogo...';let tries=0;const timer=setInterval(()=>{tries++;try{if(transferAndStart()){clearInterval(timer);return}}catch(e){}if(tries>=80){clearInterval(timer);startBtn.disabled=false;msg.textContent='O jogo demorou para carregar. Toque em COMEÇAR novamente.'}},100)}
startBtn.addEventListener('click',openGame);classInput.addEventListener('keydown',e=>{if(e.key==='Enter')openGame()});
</script></body></html>

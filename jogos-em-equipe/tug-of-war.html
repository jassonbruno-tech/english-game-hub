<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tug of War English</title>
<style>
:root{--bg:#081321;--panel:#111d2e;--muted:#a9bdd1;--ok:#22c55e;--bad:#ef4444;--rope:#b7793f}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#fff}button{font:inherit}.hidden{display:none!important}
#cover{height:100vh;min-height:620px;position:relative;overflow:hidden;background:#0b1e34}#cover img{width:100%;height:100%;object-fit:cover;display:block}.coverShade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,#0009)}.coverPlay{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);border:4px solid #fff;border-radius:22px;background:#22c55e;color:#fff;font-weight:1000;font-size:34px;padding:18px 48px;cursor:pointer;box-shadow:0 9px 0 #15803d,0 18px 35px #0007}.coverPlay:hover{filter:brightness(1.08)}
#game{min-height:100vh;padding:14px 18px 28px;background:linear-gradient(#0b1728,#111827)}.top{max-width:1450px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.title h1{margin:0;font-size:30px}.title small{color:var(--muted)}.stage{background:#020617;border:1px solid #334155;border-radius:14px;padding:10px 16px;font-weight:1000;text-align:center}.bracket{text-align:right;color:#dbeafe;font-size:14px}
.arena{max-width:1450px;height:300px;margin:12px auto;background:linear-gradient(#83d4ff 0 49%,#75cd62 49% 100%);border:3px solid #ffffff22;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 14px 32px #0007}.ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#c88b4d,#985d2e)}.score{position:absolute;z-index:8;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#07101ddb;padding:10px 18px;border-radius:17px;border:1px solid #fff3;font-size:22px;font-weight:1000}.score strong{font-size:30px}.ropeTrack{position:absolute;left:12%;right:12%;bottom:108px;height:20px}.rope{position:absolute;left:0;right:0;top:8px;height:8px;background:var(--rope);border-radius:8px}.mid{position:absolute;left:50%;top:-50px;width:4px;height:105px;background:#fff;opacity:.8}.flag{position:absolute;left:50%;top:-28px;transform:translateX(-50%);transition:left .65s ease;font-size:52px}.people{position:absolute;bottom:41px;font-size:54px;letter-spacing:-12px;transition:transform .35s}.people.left{left:4%}.people.right{right:4%;transform:scaleX(-1)}.arenaMsg{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#07101de6;border:1px solid #fff3;border-radius:12px;padding:8px 16px;font-weight:900;z-index:9}
.panel{max-width:1450px;margin:auto;background:var(--panel);border:1px solid #334155;border-radius:20px;padding:16px}.questionHead{display:flex;justify-content:space-between;gap:12px}.questionHead h2{margin:0 0 12px;font-size:27px}.qcount{color:var(--muted);white-space:nowrap}.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}.team{background:#1e293b;border:2px solid var(--c);border-radius:17px;padding:14px}.teamHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.teamName{font-weight:1000;color:var(--c);font-size:21px}.status{font-size:13px;background:#0b1220;color:#cbd5e1;border-radius:9px;padding:6px 9px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{min-height:54px;border:2px solid #475569;border-radius:13px;background:#0b1220;color:#fff;font-weight:850;cursor:pointer;padding:10px}.opt:hover{border-color:#94a3b8}.opt.sel{outline:3px solid #fff}.opt.ok{background:var(--ok);color:#052e16;border-color:#bbf7d0;animation:blink .25s 4}.opt.bad{background:var(--bad);border-color:#fecaca;animation:blink .25s 4}@keyframes blink{50%{filter:brightness(1.6);transform:scale(1.03)}}.result{display:none;margin-top:12px;padding:11px;background:#020617;border:1px solid #334155;border-radius:12px;text-align:center;font-weight:1000}.controls,.testBtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.next{background:#fff;color:#111827}.green{background:#22c55e;color:#052e16}.gray{background:#334155;color:#fff}.test{max-width:1450px;margin:10px auto;background:#0e1a2b;border:1px dashed #64748b;border-radius:14px;padding:10px}.test b{font-size:14px}.testBtns{justify-content:flex-start}.testBtns .btn{font-size:13px}.modal{position:fixed;inset:0;background:#020617dd;display:none;align-items:center;justify-content:center;z-index:50}.modalCard{width:min(620px,90vw);background:#111827;border:1px solid #475569;border-radius:22px;padding:28px;text-align:center}.modalCard h2{font-size:36px;margin:0 0 10px}
@media(max-width:900px){.top{grid-template-columns:1fr}.bracket{text-align:left}.teams{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="cover"><img src="tug-cover.jpg" alt="Tug of War English"><div class="coverShade"></div><button id="play" class="coverPlay">▶ PLAY</button></section>
<main id="game" class="hidden">
<div class="top"><div class="title"><h1>🏆 Tug of War English</h1><small>Personal Pronouns + Verb To Be — teste local</small></div><div id="stage" class="stage">SEMIFINAL 1</div><div id="bracket" class="bracket">🔵 Azul × 🟡 Amarela &nbsp; | &nbsp; 🟢 Verde × 🔴 Vermelha &nbsp; | &nbsp; 🏆 Final</div></div>
<section class="arena"><div class="ground"></div><div class="score"><span id="ln">AZUL</span> <strong id="ls">0</strong><span>×</span><strong id="rs">0</strong> <span id="rn">AMARELA</span></div><div id="lp" class="people left">🧍🧍🧍</div><div id="rp" class="people right">🧍🧍🧍</div><div class="ropeTrack"><div class="rope"></div><div class="mid"></div><div id="flag" class="flag">🚩</div></div><div id="arenaMsg" class="arenaMsg">As duas equipes devem responder.</div></section>
<section class="panel"><div class="questionHead"><h2 id="q"></h2><div id="qc" class="qcount"></div></div><div class="teams"><div id="lc" class="team"><div class="teamHead"><div id="lt" class="teamName"></div><div id="lst" class="status">Aguardando resposta</div></div><div id="lo" class="opts"></div></div><div id="rc" class="team"><div class="teamHead"><div id="rt" class="teamName"></div><div id="rst" class="status">Aguardando resposta</div></div><div id="ro" class="opts"></div></div></div><div id="result" class="result"></div><div class="controls"><button id="next" class="btn next hidden">Próxima pergunta ➜</button><button id="cont" class="btn green hidden">Continuar campeonato ➜</button><button id="reset" class="btn gray">↻ Reiniciar campeonato</button></div></section>
<section class="test"><b>🧪 Painel de teste rápido — só para você validar a mecânica</b><div class="testBtns"><button class="btn gray" data-s="both">✅ As duas acertam</button><button class="btn gray" data-s="left">⬅️ Esquerda acerta</button><button class="btn gray" data-s="right">➡️ Direita acerta</button><button class="btn gray" data-s="none">❌ As duas erram</button></div></section>
</main>
<div id="modal" class="modal"><div class="modalCard"><h2 id="champ"></h2><p id="finalText"></p><button id="again" class="btn green">Jogar campeonato novamente</button></div></div>
<script>
const T={blue:{n:'EQUIPE AZUL',s:'AZUL',c:'#2563eb',i:'🔵'},yellow:{n:'EQUIPE AMARELA',s:'AMARELA',c:'#eab308',i:'🟡'},green:{n:'EQUIPE VERDE',s:'VERDE',c:'#16a34a',i:'🟢'},red:{n:'EQUIPE VERMELHA',s:'VERMELHA',c:'#dc2626',i:'🔴'}};
const Q=[
['Complete: ___ am a student.','I',['I','You','He','They']],['Complete: She ___ my friend.','is',['am','is','are','be']],['Complete: They ___ at school.','are',['is','am','are','be']],['Choose the correct pronoun for Maria.','She',['He','She','It','They']],['Complete: We ___ happy today.','are',['am','is','are','be']],['Choose the correct pronoun for Pedro and Lucas.','They',['He','We','They','It']],['Complete: You ___ my teacher.','are',['is','am','are','be']],['Choose the correct pronoun for the dog.','It',['He','She','It','We']],['Complete: He ___ 12 years old.','is',['am','is','are','be']],['Complete: I ___ from Brazil.','am',['am','is','are','be']],['Choose the correct pronoun for Ana and I.','We',['They','We','You','She']],['Complete: It ___ a beautiful day.','is',['am','is','are','be']],['Complete: My parents ___ at home.','are',['am','is','are','be']],['Choose the correct pronoun for Mr. Brown.','He',['He','She','It','They']],['Complete: The books ___ on the table.','are',['am','is','are','be']],['Complete: My sister ___ 10 years old.','is',['am','is','are','be']],['Choose the correct pronoun for my mother.','She',['He','She','It','They']],['Complete: They ___ not hungry.','are',['am','is','are','be']],['Complete: I ___ 13 years old.','am',['am','is','are','be']],['Choose the correct pronoun for the car.','It',['He','She','It','They']]];
const $=x=>document.getElementById(x), shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let m=0, finalists=[],L='blue',R='yellow',qs=[],qi=0,ls=0,rs=0,la=null,ra=null,revealed=false,sudden=false;const N=8;
function stage(){if(m===0){L='blue';R='yellow';$('stage').textContent='SEMIFINAL 1'}else if(m===1){L='green';R='red';$('stage').textContent='SEMIFINAL 2'}else{L=finalists[0];R=finalists[1];$('stage').textContent='FINAL'}let a=T[L],b=T[R];$('ln').textContent=a.s;$('rn').textContent=b.s;$('lt').textContent=a.i+' '+a.n;$('rt').textContent=b.i+' '+b.n;$('lc').style.setProperty('--c',a.c);$('rc').style.setProperty('--c',b.c);$('ln').style.color=a.c;$('rn').style.color=b.c;$('lp').style.color=a.c;$('rp').style.color=b.c}
function startMatch(){stage();qs=shuffle(Q).slice(0,N);qi=ls=rs=0;sudden=false;$('ls').textContent=0;$('rs').textContent=0;$('flag').style.left='50%';$('cont').classList.add('hidden');render()}
function render(){revealed=false;la=ra=null;$('result').style.display='none';$('next').classList.add('hidden');$('lst').textContent='Aguardando resposta';$('rst').textContent='Aguardando resposta';$('arenaMsg').textContent='As duas equipes devem responder.';let x=qs[qi];$('q').textContent=x[0];$('qc').textContent=sudden?'DESEMPATE — morte súbita':`Pergunta ${qi+1}/${N}`;opts('l',shuffle(x[2]));opts('r',shuffle(x[2]))}
function opts(side,arr){let box=$(side+'o');box.innerHTML='';arr.forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.dataset.v=v;b.textContent=String.fromCharCode(65+i)+') '+v;b.onclick=()=>pick(side,v,b);box.appendChild(b)})}
function pick(side,v,b){if(revealed)return;let box=$(side+'o');[...box.children].forEach(x=>{x.disabled=true;x.classList.remove('sel')});b.classList.add('sel');if(side==='l'){la=v;$('lst').textContent='Resposta enviada ✓'}else{ra=v;$('rst').textContent='Resposta enviada ✓'}if(la!==null&&ra!==null){$('arenaMsg').textContent='Respostas bloqueadas...';setTimeout(reveal,500)}}
function paint(side,chosen,correct){[...$(side+'o').children].forEach(b=>{if(b.dataset.v===chosen)b.classList.add(chosen===correct?'ok':'bad')})}
function rope(){let d=Math.max(-5,Math.min(5,ls-rs));$('flag').style.left=(50-d/5*29)+'%'}
function tug(side){let e=$(side==='l'?'lp':'rp');let base=side==='l'?'translateX(-14px)':'scaleX(-1) translateX(-14px)';e.style.transform=base;setTimeout(()=>e.style.transform=side==='l'?'none':'scaleX(-1)',350)}
function reveal(){revealed=true;let x=qs[qi],c=x[1],a=la===c,b=ra===c;paint('l',la,c);paint('r',ra,c);if(a)ls++;if(b)rs++;$('ls').textContent=ls;$('rs').textContent=rs;$('lst').textContent=a?'ACERTOU! ✅':'ERROU ✖';$('rst').textContent=b?'ACERTOU! ✅':'ERROU ✖';let msg;if(a&&b){msg='As duas equipes acertaram! A corda volta para a posição do placar.';$('arenaMsg').textContent='💥 AS DUAS ACERTARAM!'}else if(a){msg=T[L].n+' venceu a rodada e puxou a corda!';$('arenaMsg').textContent=T[L].i+' PUXOU!';tug('l')}else if(b){msg=T[R].n+' venceu a rodada e puxou a corda!';$('arenaMsg').textContent=T[R].i+' PUXOU!';tug('r')}else{msg='As duas equipes erraram. Resposta correta: '+c+'.';$('arenaMsg').textContent='Ninguém puxou a corda.'}$('result').textContent=msg;$('result').style.display='block';setTimeout(rope,300);if(sudden){if(a!==b)return setTimeout(endMatch,800);$('next').classList.remove('hidden');return}if(qi<N-1)$('next').classList.remove('hidden');else if(ls===rs){sudden=true;$('result').textContent+=' Empate! Vamos para a morte súbita.';$('next').classList.remove('hidden')}else setTimeout(endMatch,800)}
function endMatch(){let w=ls>rs?L:R;$('result').textContent=`🏆 ${T[w].n} venceu por ${ls} × ${rs}!`;$('result').style.display='block';$('arenaMsg').textContent='PARTIDA ENCERRADA';$('next').classList.add('hidden');if(m<2){finalists.push(w);$('cont').classList.remove('hidden')}else champion(w)}
function next(){qi++;if(qi>=qs.length)qs.push(shuffle(Q)[0]);render()}
function advance(){m++;startMatch()}
function reset(){m=0;finalists=[];$('modal').style.display='none';startMatch()}
function champion(w){$('champ').textContent='🏆 '+T[w].n+' É A CAMPEÃ!';$('finalText').textContent=`Final encerrada: ${ls} × ${rs}. Campeonato concluído.`;$('modal').style.display='flex'}
function sim(type){if(revealed)return;let x=qs[qi],c=x[1],wrong=x[2].find(v=>v!==c);if(type==='both'){la=c;ra=c}else if(type==='left'){la=c;ra=wrong}else if(type==='right'){la=wrong;ra=c}else{la=wrong;ra=wrong};for(let s of ['l','r']){let val=s==='l'?la:ra;[...$(s+'o').children].forEach(b=>{b.disabled=true;if(b.dataset.v===val)b.classList.add('sel')})}$('lst').textContent=$('rst').textContent='Resposta enviada ✓';setTimeout(reveal,350)}
$('play').onclick=()=>{$('cover').classList.add('hidden');$('game').classList.remove('hidden');reset()};$('next').onclick=next;$('cont').onclick=advance;$('reset').onclick=reset;$('again').onclick=reset;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>sim(b.dataset.s));
</script>
</body>
</html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tug of War — Teste 2 computadores</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=1"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;font-family:Arial,sans-serif}iframe{border:0;width:100%;height:100%;display:block}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050816;color:#fff;z-index:20;text-align:center;padding:24px;font-weight:900}.loading.hide{display:none}.loading small{display:block;color:#9fb4dc;margin-top:10px;font-weight:600}</style></head>
<body><div class="loading" id="loading">Preparando teste em 2 computadores...<small id="note"></small></div>
<iframe id="outer" src="tug-of-war-final.html?v=20260920-test2wrap1" allow="autoplay"></iframe>
<script>
const p=new URLSearchParams(location.search),room=(p.get('sala')||'TESTE2FILMES20092026A').replace(/[^a-zA-Z0-9_-]/g,'').toUpperCase(),player=p.get('equipe')||'blue';
const cfg=window.TUG_SUPABASE_CONFIG||{},loading=document.getElementById('loading'),note=document.getElementById('note'),outer=document.getElementById('outer');
if(!(cfg.url&&cfg.key&&window.supabase?.createClient)){loading.innerHTML='⚠️ SUPABASE NÃO CARREGOU<small>Atualize a página.</small>'}
else{
 const sb=window.supabase.createClient(cfg.url,cfg.key);
 outer.addEventListener('load',()=>{
  const od=outer.contentDocument;if(!od)return;const inner=od.getElementById('game');if(!inner)return;
  const desired='tug-of-war.html?v=20260920-test2core1&modo=teste2&equipe='+encodeURIComponent(player)+'&sala='+encodeURIComponent(room);
  if(!inner.src.includes('modo=teste2'))inner.src=desired;
  let tries=0,readySince=0,injected=false;
  const boot=setInterval(()=>{
   tries++;
   try{
    const d=inner.contentDocument,w=inner.contentWindow;if(!d||!d.body)return;
    if(injected||d.getElementById('tug-test2-loader')){injected=true;clearInterval(boot);loading.classList.add('hide');return}
    if(typeof w.endMatch==='function'&&typeof w.setRope==='function'){
      if(!readySince)readySince=Date.now();
      if(Date.now()-readySince<900)return;
      w.__tugSupabase=sb;w.__tugRoom=room;w.__tugPlayer=player;
      const s=d.createElement('script');s.id='tug-test2-loader';s.src='tug-teste2-engine.js?v=1';d.body.appendChild(s);
      injected=true;clearInterval(boot);loading.classList.add('hide');
    }
   }catch(e){}
   if(tries>220){clearInterval(boot);note.textContent='Não foi possível iniciar. Atualize a página.'}
  },100);
 });
}
</script></body></html>

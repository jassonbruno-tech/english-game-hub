<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tug of War — Campeonato Multiplayer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=1"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;font-family:Arial,sans-serif}iframe{border:0;width:100%;height:100%;display:block}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050816;color:#fff;z-index:20;text-align:center;padding:24px;font-weight:900}.loading.hide{display:none}.loading small{display:block;color:#9fb4dc;margin-top:10px;font-weight:600}</style></head><body>
<div class="loading" id="loading">Conectando ao campeonato...<small id="loadNote"></small></div><iframe id="outer" src="tug-of-war-final.html?v=20260918-sbwrap1" allow="autoplay"></iframe>
<script>
const p=new URLSearchParams(location.search),room=(p.get('sala')||'LAB703').replace(/[^a-zA-Z0-9_-]/g,'').toUpperCase(),player=p.get('equipe')||'blue',test2=p.get('teste2')==='1',test2Session=p.get('sessao')||'';
const cfg=window.TUG_SUPABASE_CONFIG||{},loading=document.getElementById('loading'),note=document.getElementById('loadNote'),outer=document.getElementById('outer');
if(!(cfg.url&&cfg.key&&window.supabase?.createClient)){loading.innerHTML='⚠️ SUPABASE NÃO CARREGOU<small>Atualize a página e tente novamente.</small>'}
else{
 const sb=window.supabase.createClient(cfg.url,cfg.key);
 let presenceChannel=null,heartbeat=null,started=false;

 async function markPresent(){
   if(!test2||!test2Session)return;
   await sb.rpc('tug_test2_ping',{p_room:room,p_session:test2Session});
 }
 async function pairReady(){
   if(!test2)return true;
   const cutoff=new Date(Date.now()-5000).toISOString();
   const {data,error}=await sb.from('tug_test2_presence').select('session_id,color,last_seen').eq('room_code',room).gte('last_seen',cutoff);
   if(error)throw error;
   const fresh=(data||[]);const colors=new Set(fresh.map(x=>x.color));const sessions=new Set(fresh.map(x=>x.session_id));
   const ok=colors.has('blue')&&colors.has('yellow')&&sessions.size>=2;
   if(!ok){
     const waitingFor=player==='blue'?'EQUIPE AMARELA':'EQUIPE AZUL';
     loading.innerHTML='⏳ AGUARDANDO '+waitingFor+'<small>Você já está conectado como '+(player==='blue'?'EQUIPE AZUL':'EQUIPE AMARELA')+'. O jogo só será liberado quando o outro computador entrar.</small>';
   }
   return ok;
 }
 function bootGame(){
   if(started)return;started=true;
   loading.innerHTML='✅ OS 2 COMPUTADORES ESTÃO CONECTADOS<small>Preparando a partida...</small>';
   outer.addEventListener('load',()=>{
    const od=outer.contentDocument;if(!od)return;const inner=od.getElementById('game');if(!inner)return;
    const desired='tug-of-war.html?v=20260920-core-test2b&modo='+(test2?'teste2':'multiplayer')+'&equipe='+encodeURIComponent(player)+'&sala='+encodeURIComponent(room);
    if(!inner.src.includes('modo='+(test2?'teste2':'multiplayer')))inner.src=desired;
    let tries=0,injected=false,readySince=0;const boot=setInterval(()=>{
     tries++;
     try{
      const d=inner.contentDocument,w=inner.contentWindow;if(!d||!d.body)return;
      if(injected||d.getElementById('tug-multi-loader')){injected=true;clearInterval(boot);loading.classList.add('hide');return}
      if(typeof w.endMatch==='function'&&typeof w.setRope==='function'){
        if(!readySince)readySince=Date.now();
        if(Date.now()-readySince<900)return;
        if(!d.getElementById('tug-responsive-v1')){
          const rs=d.createElement('style');rs.id='tug-responsive-v1';rs.textContent=`
.eye-white{top:22px!important;width:9px!important;height:12px!important;background:#fff!important;border:1.6px solid #111!important;border-radius:50%!important;box-shadow:none!important;overflow:visible!important;z-index:13!important}
.eye-white.left-eye{left:12px!important}.eye-white.right-eye{left:23px!important}
.pupil{display:block!important;position:absolute!important;top:3px!important;left:2px!important;width:5px!important;height:6px!important;background:#000!important;border-radius:50%!important;box-shadow:none!important;opacity:1!important;z-index:14!important}
.pupil:after{content:''!important;display:block!important;position:absolute!important;width:1.8px!important;height:1.8px!important;background:#fff!important;border-radius:50%!important;top:1px!important;left:2.4px!important}
@media(max-width:760px){
html,body{overflow:auto!important;min-height:100%!important}
#game{height:auto!important;min-height:100dvh!important;overflow:visible!important;padding:5px 6px 12px!important;display:grid!important;grid-template-rows:auto 180px auto!important;gap:6px!important}
.topbar{grid-template-columns:1fr auto!important;grid-template-areas:"brand stage" "bracket bracket"!important;gap:4px!important;padding:4px 6px!important}
.brand{grid-area:brand!important}.stage{grid-area:stage!important;justify-self:end!important;padding:5px 9px!important;font-size:10px!important}
.bracket{grid-area:bracket!important;justify-self:stretch!important;display:flex!important;gap:3px!important;overflow-x:auto!important;padding-bottom:2px!important}
.chip{flex:0 0 auto!important;font-size:9px!important;padding:3px 5px!important}.brand h1{font-size:16px!important}.brand small{display:none!important}
.arena{height:180px!important;border-radius:14px!important}.scoreboard{top:5px!important;padding:4px 7px!important;gap:4px!important;border-radius:10px!important}
.score-team{min-width:78px!important;font-size:10px!important}.score-num{font-size:19px!important;min-width:23px!important;padding:0 5px!important}
.team-people{bottom:6px!important;transform:scale(.72)!important;transform-origin:bottom center!important}.team-people.left{left:4%!important}.team-people.right{right:4%!important}
.rope-wrap{left:4%!important;right:4%!important;bottom:57px!important}.center-line{bottom:44px!important;height:82px!important}.rope-coil{bottom:33px!important;transform:scale(.7)!important}
.school{transform:translateX(-50%) scale(.72)!important;transform-origin:top center!important}.tree,.hill{transform:scale(.72)!important}
.arena-msg{bottom:3px!important;min-width:0!important;width:92%!important;padding:4px 7px!important;font-size:10px!important}
.play-area{height:auto!important;min-height:0!important;padding:6px!important;gap:5px!important;overflow:visible!important}
.question-top{grid-template-columns:1fr auto!important;grid-template-areas:"meta timer" "note timer"!important;gap:2px 6px!important;padding:4px 6px!important}
.qmeta{grid-area:meta!important;font-size:9px!important}.timer-wrap{grid-area:timer!important}.right-note{grid-area:note!important;text-align:left!important;font-size:8px!important}
.timer{width:48px!important;height:48px!important;font-size:18px!important;border-width:3px!important}.timer-label{font-size:8px!important}
.question-text{font-size:16px!important;line-height:1.2!important;padding:2px 3px!important}.teams{grid-template-columns:1fr!important;gap:6px!important}
.team-card{padding:6px!important;border-radius:12px!important}.team-header{margin-bottom:4px!important}.team-name{font-size:14px!important}.status{font-size:9px!important;padding:3px 5px!important}
.options{grid-template-columns:1fr 1fr!important;gap:5px!important}.opt{font-size:12px!important;min-height:42px!important;padding:7px!important}
.result{font-size:12px!important;padding:6px!important}.controls,.test-panel{display:none!important}
.round-box,.countdown-box,.modal-card{min-width:min(92vw,520px)!important;padding:22px 16px!important}.round-number{font-size:clamp(32px,10vw,54px)!important}.ready-text{font-size:clamp(20px,7vw,34px)!important}.countdown-number{font-size:clamp(96px,35vw,180px)!important}
}
@media(max-width:760px) and (orientation:landscape){
html,body{overflow:hidden!important}#game{height:100dvh!important;min-height:100dvh!important;overflow:hidden!important;grid-template-rows:38px 142px minmax(0,1fr)!important;padding:4px 6px!important}
.topbar{grid-template-columns:1fr auto 1fr!important;grid-template-areas:none!important}.brand{grid-area:auto!important}.stage{grid-area:auto!important;justify-self:center!important}.bracket{grid-area:auto!important;justify-self:end!important;overflow:visible!important}
.arena{height:142px!important}.team-people{transform:scale(.58)!important;bottom:-5px!important}.rope-wrap{bottom:44px!important}.center-line{bottom:35px!important;height:64px!important}.arena-msg{font-size:9px!important}
.play-area{padding:4px 6px!important;gap:3px!important}.question-text{font-size:14px!important}.teams{grid-template-columns:1fr 1fr!important;gap:5px!important}.team-name{font-size:12px!important}.status{font-size:8px!important}
.opt{font-size:10px!important;min-height:34px!important;padding:4px 5px!important}.timer{width:42px!important;height:42px!important;font-size:16px!important}.question-top{grid-template-columns:1fr auto 1fr!important;grid-template-areas:none!important}.qmeta,.timer-wrap,.right-note{grid-area:auto!important}.right-note{text-align:right!important}
}`;
          d.head.appendChild(rs);
        }
        w.__tugSupabase=sb;w.__tugRoom=room;w.__tugPlayer=player;w.__tugTest2=test2;
        const s=d.createElement('script');s.id='tug-multi-loader';s.src='tug-tournament-multiplayer.js?v=20260920-responsive1';s.onload=()=>{const btn=d.getElementById('startGame');if(test2&&btn)btn.click();loading.classList.add('hide')};d.body.appendChild(s);injected=true;clearInterval(boot);if(!test2)loading.classList.add('hide');
      }
     }catch(e){}
     if(tries>220){clearInterval(boot);note.textContent='Não foi possível iniciar. Atualize a página.'}
    },100);
   },{once:true});
   outer.src='tug-of-war-final.html?v=20260920-responsive1';
 }
 async function waitForPair(){
   try{
     await markPresent();
     if(await pairReady()){bootGame();return}
     presenceChannel=sb.channel('tug-game-wait-'+room+'-'+player)
       .on('postgres_changes',{event:'*',schema:'public',table:'tug_test2_presence',filter:'room_code=eq.'+room},async()=>{if(!started&&await pairReady())bootGame()})
       .subscribe();
     heartbeat=setInterval(async()=>{await markPresent();if(!started&&await pairReady())bootGame()},1500);
   }catch(e){loading.innerHTML='⚠️ ERRO DE CONEXÃO<small>'+e.message+'</small>'}
 }
 if(test2)waitForPair(); else bootGame();
 window.addEventListener('pagehide',()=>{if(test2&&test2Session)sb.rpc('tug_test2_leave',{p_room:room,p_session:test2Session})});
}
</script></body></html>

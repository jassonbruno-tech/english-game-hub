<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tug of War — Campeonato Multiplayer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=1"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;font-family:Arial,sans-serif}iframe{border:0;width:100%;height:100%;display:block}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050816;color:#fff;z-index:20;text-align:center;padding:24px;font-weight:900}.loading.hide{display:none}.loading small{display:block;color:#9fb4dc;margin-top:10px;font-weight:600}</style></head><body>
<div class="loading" id="loading">Conectando ao campeonato...<small id="loadNote"></small></div><iframe id="outer" src="tug-of-war-final.html?v=20260918-sbwrap1" allow="autoplay"></iframe>
<script>
const p=new URLSearchParams(location.search),room=(p.get('sala')||'LAB703').replace(/[^a-zA-Z0-9_-]/g,'').toUpperCase(),player=p.get('equipe')||'blue',test2=p.get('teste2')==='1',deviceId=p.get('dev')||'';
const cfg=window.TUG_SUPABASE_CONFIG||{},loading=document.getElementById('loading'),note=document.getElementById('loadNote'),outer=document.getElementById('outer');
if(!(cfg.url&&cfg.key&&window.supabase?.createClient)){loading.innerHTML='⚠️ SUPABASE NÃO CARREGOU<small>Atualize a página e tente novamente.</small>'}
else{
 const sb=window.supabase.createClient(cfg.url,cfg.key);
 let presenceChannel=null,heartbeat=null,started=false;

 async function markPresent(){
   if(!test2||!deviceId)return;
   await sb.from('tug_devices').update({connected:true,last_seen:new Date().toISOString()}).eq('room_code',room).eq('device_id',deviceId);
 }
 async function pairReady(){
   if(!test2)return true;
   const cutoff=new Date(Date.now()-10000).toISOString();
   const {data,error}=await sb.from('tug_devices').select('device_id,color,connected,last_seen').eq('room_code',room).eq('connected',true).in('color',['blue','yellow']).gte('last_seen',cutoff);
   if(error)throw error;
   const colors=new Set((data||[]).map(x=>x.color));
   const ok=colors.has('blue')&&colors.has('yellow');
   if(!ok){
     const waitingFor=player==='blue'?'EQUIPE AMARELA':'EQUIPE AZUL';
     loading.innerHTML='⏳ AGUARDANDO '+waitingFor+'<small>Você já está conectado como '+(player==='blue'?'EQUIPE AZUL':'EQUIPE AMARELA')+'. O jogo só será liberado quando o outro computador entrar.</small>';
   }
   return ok;
 }
 function bootGame(){
   if(started)return;started=true;
   loading.innerHTML='✅ OS 2 COMPUTADORES ESTÃO CONECTADOS<small>Preparando a partida...</small>';
   outer.addEventListener('load',()=>{
    const od=outer.contentDocument;if(!od)return;const inner=od.getElementById('game');if(!inner)return;
    const desired='tug-of-war.html?v=20260920-core-test2b&modo='+(test2?'teste2':'multiplayer')+'&equipe='+encodeURIComponent(player)+'&sala='+encodeURIComponent(room);
    if(!inner.src.includes('modo='+(test2?'teste2':'multiplayer')))inner.src=desired;
    let tries=0,injected=false,readySince=0;const boot=setInterval(()=>{
     tries++;
     try{
      const d=inner.contentDocument,w=inner.contentWindow;if(!d||!d.body)return;
      if(injected||d.getElementById('tug-multi-loader')){injected=true;clearInterval(boot);loading.classList.add('hide');return}
      if(typeof w.endMatch==='function'&&typeof w.setRope==='function'){
        if(!readySince)readySince=Date.now();
        if(Date.now()-readySince<900)return;
        w.__tugSupabase=sb;w.__tugRoom=room;w.__tugPlayer=player;w.__tugTest2=test2;
        const s=d.createElement('script');s.id='tug-multi-loader';s.src='tug-tournament-multiplayer.js?v=20260920-test2-wait2';s.onload=()=>{const btn=d.getElementById('startGame');if(test2&&btn)btn.click();loading.classList.add('hide')};d.body.appendChild(s);injected=true;clearInterval(boot);if(!test2)loading.classList.add('hide');
      }
     }catch(e){}
     if(tries>220){clearInterval(boot);note.textContent='Não foi possível iniciar. Atualize a página.'}
    },100);
   },{once:true});
   outer.src='tug-of-war-final.html?v=20260920-sbwrap-test2b';
 }
 async function waitForPair(){
   try{
     await markPresent();
     if(await pairReady()){bootGame();return}
     presenceChannel=sb.channel('tug-game-wait-'+room+'-'+player)
       .on('postgres_changes',{event:'*',schema:'public',table:'tug_devices',filter:'room_code=eq.'+room},async()=>{if(!started&&await pairReady())bootGame()})
       .subscribe();
     heartbeat=setInterval(async()=>{await markPresent();if(!started&&await pairReady())bootGame()},3000);
   }catch(e){loading.innerHTML='⚠️ ERRO DE CONEXÃO<small>'+e.message+'</small>'}
 }
 if(test2)waitForPair(); else bootGame();
 window.addEventListener('pagehide',()=>{if(test2&&deviceId)sb.rpc('tug_disconnect',{p_room:room,p_device:deviceId})});
}
</script></body></html>

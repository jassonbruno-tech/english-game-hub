 d.head.appendChild(s);
 const arenaEl=d.querySelector('.arena'),left=d.getElementById('leftPeople'),right=d.getElementById('rightPeople'),rope=d.getElementById('ropeWrap'),flag=rope?.querySelector('.flag'),centerLine=d.querySelector('.center-line'),arena=d.getElementById('arenaMsg'),lScore=d.getElementById('leftScore'),rScore=d.getElementById('rightScore'),lStatus=d.getElementById('leftStatus'),rStatus=d.getElementById('rightStatus'),result=d.getElementById('resultBox');

 const mkCoil=side=>{let c=d.getElementById(side+'Coil');if(!c){c=d.createElement('div');c.id=side+'Coil';c.className='rope-coil '+side;c.innerHTML='<i></i><i></i><i></i>';arenaEl.appendChild(c)}return c};const leftCoil=mkCoil('left'),rightCoil=mkCoil('right');
 const states=['winner','loser','neutral','inplay-happy','inplay-panic','final-winner','final-loser'];let finalCrossDone=false,finalTimer=null,moveTimer=null,lastL=0,lastR=0;
 function scoreVals(){return [parseInt(lScore?.textContent||'0',10)||0,parseInt(rScore?.textContent||'0',10)||0]}
 function ended(){return (arena?.textContent||'').includes('PARTIDA ENCERRADA')}
 function setState(el,state){if(!el)return;states.forEach(c=>{if(c!==state)el.classList.remove(c)});if(state)el.classList.add(state)}
 function exactCenterPx(){if(!flag||!rope||!centerLine)return null;const rr=rope.getBoundingClientRect(),cr=centerLine.getBoundingClientRect();return (cr.left+cr.width/2)-rr.left}

 function setPersistentPositions(diff){const n=Math.max(-7,Math.min(7,diff)),m=Math.abs(n);if(n>0){const win=Math.min(16*m,90),lose=Math.min(62*m,260);left.style.setProperty('left',`calc(12% - ${win}px)`,'important');right.style.setProperty('right',`calc(12% + ${lose}px)`,'important')}else if(n<0){const win=Math.min(16*m,90),lose=Math.min(62*m,260);left.style.setProperty('left',`calc(12% + ${lose}px)`,'important');right.style.setProperty('right',`calc(12% - ${win}px)`,'important')}else{left.style.setProperty('left','12%','important');right.style.setProperty('right','12%','important')}setFlagByDiff(n);updateCoils(n)}
 function runVisiblePull(diff,winner){left.classList.add('pulling');right.classList.add('pulling');if(winner==='left'){left.style.transform='translateX(-14px) rotate(-2deg)';right.style.transform='translateX(-34px) rotate(-5deg)'}else{left.style.transform='translateX(34px) rotate(5deg)';right.style.transform='translateX(14px) rotate(2deg)'}setPersistentPositions(diff);setTimeout(()=>{left.style.transform='';right.style.transform='';left.classList.remove('pulling');right.classList.remove('pulling')},900)}

 const originalCelebrate=typeof w.celebrate==='function'?w.celebrate.bind(w):null;w.celebrate=function(team){const txt=result?.textContent||'';if(txt.includes('venceu a partida'))return;if(originalCelebrate)originalCelebrate(team)};
 function finalCross(){if(finalCrossDone||!ended()||!arenaEl)return;const [a,b]=scoreVals();if(a===b)return;finalCrossDone=true;clearTimeout(finalTimer);const leftWins=a>b,winEl=leftWins?left:right,loseEl=leftWins?right:left;setState(winEl,'inplay-happy');setState(loseEl,'inplay-panic');leftCoil.classList.remove('show');rightCoil.classList.remove('show');requestAnimationFrame(()=>{const ar=arenaEl.getBoundingClientRect(),wr=winEl.getBoundingClientRect(),lr=loseEl.getBoundingClientRect(),center=ar.left+ar.width/2,margin=22;let winDx,loseDx;if(leftWins){winDx=(ar.left+margin)-wr.left;loseDx=(center-28)-lr.right}else{winDx=(ar.right-margin)-wr.right;loseDx=(center+28)-lr.left}winEl.style.transition='transform 1.8s cubic-bezier(.08,.78,.12,1)';loseEl.style.transition='transform 1.8s cubic-bezier(.08,.78,.12,1)';winEl.style.transform=`translateX(${winDx}px) rotate(${leftWins?-3:3}deg)`;loseEl.style.transform=`translateX(${loseDx}px) rotate(${leftWins?-8:8}deg)`;if(flag){const base=exactCenterPx(),rr=rope.getBoundingClientRect();if(base!==null)flag.style.left=(base+(leftWins?-rr.width*.28:rr.width*.28))+'px'}finalTimer=setTimeout(()=>{setState(winEl,'final-winner');setState(loseEl,'final-loser');const nm=(leftWins?d.getElementById('leftName'):d.getElementById('rightName'))?.textContent.toLowerCase()||'';const key=nm.includes('azul')?'blue':nm.includes('amarela')?'yellow':nm.includes('verde')?'green':'red';if(originalCelebrate)originalCelebrate(key)},1900)})}
 function syncFaces(){if(ended()){finalCross();return}finalCrossDone=false;const ls=lStatus?.textContent||'',rs=rStatus?.textContent||'';if(ls.includes('ACERTOU'))setState(left,'inplay-happy');else if(ls.includes('ERROU')||ls.includes('TEMPO ESGOTADO'))setState(left,'inplay-panic');else setState(left,'neutral');if(rs.includes('ACERTOU'))setState(right,'inplay-happy');else if(rs.includes('ERROU')||rs.includes('TEMPO ESGOTADO'))setState(right,'inplay-panic');else setState(right,'neutral')}
 function syncScore(){const [a,b]=scoreVals();if(a===0&&b===0){lastL=0;lastR=0;resetPlay();return}if(a===lastL&&b===lastR)return;const prevL=lastL,prevR=lastR;lastL=a;lastR=b;clearTimeout(moveTimer);const leftGained=a>prevL,rightGained=b>prevR;if(leftGained&&rightGained){moveTimer=setTimeout(()=>setPersistentPositions(a-b),2600);return}const winner=leftGained?'left':rightGained?'right':null;if(winner)moveTimer=setTimeout(()=>runVisiblePull(a-b,winner),2600)}
 const obsFaces=new MutationObserver(syncFaces);[lStatus,rStatus,arena].forEach(el=>el&&obsFaces.observe(el,{childList:true,subtree:true,characterData:true}));const obsScore=new MutationObserver(syncScore);[lScore,rScore].forEach(el=>el&&obsScore.observe(el,{childList:true,subtree:true,characterData:true}));

 const TOTAL=15,qMeta=d.getElementById('qMeta'),roundNumber=d.getElementById('roundNumber'),originalSchedule=w.schedule.bind(w);function currentRound(){const q=qMeta?.textContent||'';let m=q.match(/Pergunta\s+(\d+)/i);if(m)return parseInt(m[1],10);m=(roundNumber?.textContent||'').match(/RODADA\s+(\d+)/i);return m?parseInt(m[1],10):1}function sudden(){return /DESEMPATE|morte súbita/i.test((qMeta?.textContent||'')+' '+(roundNumber?.textContent||''))}w.schedule=function(delay,a,b){if(sudden())return originalSchedule(delay,a,b);const round=currentRound(),[ls,rs]=scoreVals(),remaining=Math.max(0,TOTAL-round);if(Math.abs(ls-rs)>remaining)return w.setTimeout(()=>w.endMatch(),delay);if(round<TOTAL)return w.setTimeout(()=>w.next(),delay+250);return originalSchedule(delay,a,b)};function fixCounter(){if(!qMeta)return;const t=qMeta.textContent||'';if(/Pergunta\s+\d+\/\d+/i.test(t)){const wanted=`Pergunta ${currentRound()}/${TOTAL}`;if(qMeta.textContent!==wanted)qMeta.textContent=wanted}}const ro=new MutationObserver(fixCounter);if(qMeta)ro.observe(qMeta,{childList:true,subtree:true,characterData:true});fixCounter();

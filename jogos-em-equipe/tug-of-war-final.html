<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tug of War English</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="game" src="tug-of-war.html?v=20260917-base17" allow="autoplay"></iframe><script>
const f=document.getElementById('game');
f.addEventListener('load',()=>{
 const d=f.contentDocument,w=d.defaultView;if(!d||!w)return;
 const s=d.createElement('style');s.textContent=`
 /* posição inicial: mais perto do centro, com espaço atrás */
 .team-people.left{left:12%!important}.team-people.right{right:12%!important}.team-people{transition:transform 1.25s cubic-bezier(.10,.82,.18,1)!important;will-change:transform}
 /* direita voltada para o centro */
 .right .person,.right .person.short,.right .person.tall{transform:none!important}.right .arm-front{left:-2px!important;right:auto!important;width:22px!important;transform:rotate(-5deg)!important;transform-origin:right center!important;z-index:8!important}.right .arm-back{left:3px!important;right:auto!important;width:22px!important;transform:rotate(5deg)!important;transform-origin:right center!important;z-index:5!important}.right .hand-front{left:-8px!important;right:auto!important;z-index:10!important}.right .hand-back{left:-3px!important;right:auto!important;z-index:6!important}.right .grip-shadow{left:-7px!important;right:auto!important}.left .arm-front{left:24px!important;width:20px!important;transform:rotate(2deg)!important}.left .arm-back{left:19px!important;width:20px!important;transform:rotate(-5deg)!important}.left .hand-back{left:34px!important}.left .hand-front{left:39px!important}.left .grip-shadow{left:36px!important}.hand-back,.hand-front{top:42px!important;width:13px!important;height:13px!important;border-radius:46%!important}
 /* corda fica esticada: desliza pelas mãos; só a bandeira mostra o avanço */
 .rope-wrap{left:8%!important;right:8%!important;bottom:71px!important;transform:none!important;transition:none!important}.rope{top:5px!important;height:10px!important}
 /* bandeira construída em CSS */
 .flag{font-size:0!important;top:-22px!important;left:50%!important;width:4px!important;height:36px!important;transform:translateX(-50%)!important;background:#171717!important;border:1px solid #000!important;border-radius:1px!important;filter:drop-shadow(0 2px 1px #0005)!important;transition:left 1.25s cubic-bezier(.10,.82,.18,1)!important;z-index:20!important}.flag:after{content:''!important;position:absolute;left:3px;top:2px;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:28px solid #ef233c;filter:drop-shadow(1px 1px 0 #111)}
 /* sobra da corda enrolada atrás de quem está vencendo */
 .rope-coil{position:absolute;bottom:47px;width:92px;height:36px;z-index:7;opacity:0;transform:scale(.35);transition:opacity .45s,transform 1.1s cubic-bezier(.10,.82,.18,1)}.rope-coil.left{left:2.2%}.rope-coil.right{right:2.2%}.rope-coil i{position:absolute;width:44px;height:22px;border:7px solid #b77a3d;border-radius:50%;box-shadow:inset 0 0 0 2px #e2ae6b,0 2px 2px #0003}.rope-coil i:nth-child(1){left:0;top:10px}.rope-coil i:nth-child(2){left:24px;top:2px}.rope-coil i:nth-child(3){left:45px;top:11px}.rope-coil.show{opacity:1}
 /* olhos preservados */
 .eye-white{top:22px!important;width:9px!important;height:12px!important;background:#fff!important;border:1.6px solid #111!important;border-radius:50%!important;box-shadow:none!important;overflow:visible!important;z-index:13!important}.eye-white.left-eye{left:12px!important}.eye-white.right-eye{left:23px!important}.pupil{position:absolute!important;top:3px!important;left:2px!important;width:5px!important;height:6px!important;background:#000!important;border-radius:50%!important;box-shadow:none!important}.pupil:after{content:'';position:absolute;width:1.8px;height:1.8px;background:#fff;border-radius:50%;top:1px;left:2.4px}.brow{top:18px!important;height:1.5px!important;background:#2b211b!important}.brow.left-brow{left:12px!important}.brow.right-brow{left:23px!important}
 /* expressões durante a rodada */
 .team-people.inplay-happy .mouth{width:14px!important;height:8px!important;left:14px!important;top:31px!important;background:transparent!important;border:0!important;border-bottom:3px solid #7a2d20!important;border-radius:0 0 9px 9px!important}.team-people.inplay-happy .sweat,.team-people.inplay-happy .tear{display:none!important}.team-people.inplay-happy .left-brow{transform:rotate(-4deg)!important}.team-people.inplay-happy .right-brow{transform:rotate(4deg)!important}.team-people.inplay-panic .mouth{width:10px!important;height:10px!important;left:16px!important;top:31px!important;background:transparent!important;border:2px solid #7a2d20!important;border-top:none!important;border-radius:0 0 8px 8px!important}.team-people.inplay-panic .left-brow{transform:rotate(18deg)!important}.team-people.inplay-panic .right-brow{transform:rotate(-18deg)!important}.team-people.inplay-panic .sweat{display:block!important}.team-people.inplay-panic .tear{display:none!important}
 /* final: mantém o cruzamento e só então comemora/chora */
 .team-people.final-winner .arm-back,.team-people.final-winner .arm-front{top:34px!important;width:23px!important;transform-origin:2px 50%!important;z-index:9!important}.team-people.final-winner.left .arm-back{left:12px!important;transform:rotate(-72deg)!important}.team-people.final-winner.left .arm-front{left:23px!important;transform:rotate(-108deg)!important}.team-people.final-winner.right .arm-back{left:7px!important;right:auto!important;transform:rotate(-108deg)!important}.team-people.final-winner.right .arm-front{left:18px!important;right:auto!important;transform:rotate(-72deg)!important}.team-people.final-winner .hand-back,.team-people.final-winner .hand-front{top:20px!important;z-index:11!important}.team-people.final-winner.left .hand-back{left:8px!important}.team-people.final-winner.left .hand-front{left:31px!important}.team-people.final-winner.right .hand-back{left:3px!important;right:auto!important}.team-people.final-winner.right .hand-front{left:26px!important;right:auto!important}.team-people.final-winner .person{animation:finalJump .52s ease-in-out 4!important}@keyframes finalJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-19px) rotate(-3deg)}}.tear{position:absolute;width:5px;height:10px;background:#63c7ff;border:1px solid #dff7ff;border-radius:50% 50% 55% 55%;display:none;z-index:15}.tear.t1{top:31px;left:14px}.tear.t2{top:31px;left:25px}.team-people.final-loser .tear{display:block!important;animation:tearDrop .7s ease-in infinite}.team-people.final-loser .tear.t2{animation-delay:.18s}.team-people.final-loser .sweat{display:none!important}.team-people.final-loser .mouth{width:12px!important;height:7px!important;left:15px!important;top:35px!important;background:transparent!important;border:0!important;border-top:2.5px solid #7a2d20!important;border-radius:8px 8px 0 0!important}.team-people.final-loser .person{animation:finalCry .42s ease-in-out infinite!important}@keyframes tearDrop{0%{transform:translateY(-1px) scale(.75);opacity:0}25%{opacity:1}100%{transform:translateY(12px) scale(1.05);opacity:0}}@keyframes finalCry{0%,100%{transform:translateY(1px) rotate(2deg)}50%{transform:translateY(4px) rotate(-2deg)}}`;
 d.head.appendChild(s);
 const arenaEl=d.querySelector('.arena'),left=d.getElementById('leftPeople'),right=d.getElementById('rightPeople'),rope=d.getElementById('ropeWrap'),flag=rope?.querySelector('.flag'),centerLine=d.querySelector('.center-line'),arena=d.getElementById('arenaMsg'),lScore=d.getElementById('leftScore'),rScore=d.getElementById('rightScore'),lStatus=d.getElementById('leftStatus'),rStatus=d.getElementById('rightStatus'),result=d.getElementById('resultBox');
 if(flag)flag.textContent='';
 d.querySelectorAll('.person').forEach(p=>{if(!p.querySelector('.tear')){const a=d.createElement('div');a.className='tear t1';const b=d.createElement('div');b.className='tear t2';p.append(a,b)}});
 const mkCoil=side=>{let c=d.getElementById(side+'Coil');if(!c){c=d.createElement('div');c.id=side+'Coil';c.className='rope-coil '+side;c.innerHTML='<i></i><i></i><i></i>';arenaEl.appendChild(c)}return c};const leftCoil=mkCoil('left'),rightCoil=mkCoil('right');
 const states=['winner','loser','neutral','inplay-happy','inplay-panic','final-winner','final-loser'];let finalCrossDone=false,finalTimer=null;
 function scoreVals(){return [parseInt(lScore?.textContent||'0',10)||0,parseInt(rScore?.textContent||'0',10)||0]}
 function ended(){return (arena?.textContent||'').includes('PARTIDA ENCERRADA')}
 function setState(el,state){if(!el)return;states.forEach(c=>{if(c!==state)el.classList.remove(c)});if(state)el.classList.add(state)}
 function t(el,x,rot=0){if(el)el.style.setProperty('transform',`translateX(${x}px) rotate(${rot}deg)`,'important')}
 function resetFinalStyles(){[left,right].forEach(el=>{el.style.transition='transform 1.25s cubic-bezier(.10,.82,.18,1)'})}
 function exactCenterPx(){if(!flag||!rope||!centerLine)return null;const rr=rope.getBoundingClientRect(),cr=centerLine.getBoundingClientRect();return (cr.left+cr.width/2)-rr.left}
 function centerFlag(){const x=exactCenterPx();if(x!==null)flag.style.left=x+'px'}
 function setFlagByDiff(n){const base=exactCenterPx();if(base===null)return;const rr=rope.getBoundingClientRect();const shift=Math.min(rr.width*.26,Math.abs(n)*rr.width*.039)*(n>0?-1:n<0?1:0);flag.style.left=(base+shift)+'px'}
 function updateCoils(diff){const n=Math.min(7,Math.abs(diff)),scale=.45+n*.12;leftCoil.classList.toggle('show',diff>0);rightCoil.classList.toggle('show',diff<0);leftCoil.style.transform=`scale(${diff>0?scale:.35})`;rightCoil.style.transform=`scale(${diff<0?scale:.35})`}
 function applyAdvantage(diff,animateKick=false,winner=null){if(finalCrossDone||ended())return;resetFinalStyles();const n=Math.max(-7,Math.min(7,diff)),mag=Math.abs(n);let lx=0,rx=0;if(n>0){lx=-Math.min(10*mag,65);rx=-Math.min(31*mag,225)}else if(n<0){lx=Math.min(31*mag,225);rx=Math.min(10*mag,65)};const settle=()=>{t(left,lx);t(right,rx);setFlagByDiff(n);updateCoils(n)};if(animateKick&&winner){const k=30;if(winner==='left'){t(left,lx-12,-2);t(right,rx-k,-7)}else{t(left,lx+k,7);t(right,rx+12,2)};const base=exactCenterPx();if(base!==null){const rr=rope.getBoundingClientRect();const targetShift=Math.min(rr.width*.26,Math.abs(n)*rr.width*.039)*(n>0?-1:n<0?1:0);const kickShift=(winner==='left'?-1:1)*rr.width*.024;flag.style.left=(base+targetShift+kickShift)+'px'}setTimeout(settle,520)}else settle()}
 /* zero é centro geométrico EXATO da linha central */
 w.setRope=function(diff){if(Number(diff)===0){finalCrossDone=false;t(left,0);t(right,0);centerFlag();updateCoils(0);return}applyAdvantage(Number(diff)||0,false)};
 /* puxão só é chamado pelo jogo depois do resultado + flash */
 w.pull=function(winner){if(ended()||finalCrossDone)return;const [a,b]=scoreVals(),loser=winner==='left'?'right':'left',winEl=winner==='left'?left:right,loseEl=loser==='left'?left:right;if(typeof w.setFace==='function'){w.setFace(winEl,'laugh');w.setFace(loseEl,'panic')}if(typeof w.dust==='function')w.dust(loser);applyAdvantage(a-b,true,winner)};
 w.bothPull=function(){if(ended()||finalCrossDone)return;if(typeof w.setFace==='function'){w.setFace(left,'laugh');w.setFace(right,'laugh')}const [a,b]=scoreVals();applyAdvantage(a-b,false)};
 const originalCelebrate=typeof w.celebrate==='function'?w.celebrate.bind(w):null;w.celebrate=function(team){const txt=result?.textContent||'';if(txt.includes('venceu a partida'))return;if(originalCelebrate)originalCelebrate(team)};
 function finalCross(){if(finalCrossDone||!ended()||!arenaEl)return;const [a,b]=scoreVals();if(a===b)return;finalCrossDone=true;clearTimeout(finalTimer);const leftWins=a>b,winEl=leftWins?left:right,loseEl=leftWins?right:left;setState(winEl,'inplay-happy');setState(loseEl,'inplay-panic');leftCoil.classList.remove('show');rightCoil.classList.remove('show');requestAnimationFrame(()=>{const ar=arenaEl.getBoundingClientRect(),wr=winEl.getBoundingClientRect(),lr=loseEl.getBoundingClientRect(),center=ar.left+ar.width/2,margin=22;let winDx,loseDx;if(leftWins){winDx=(ar.left+margin)-wr.left;loseDx=(center-28)-lr.right}else{winDx=(ar.right-margin)-wr.right;loseDx=(center+28)-lr.left}winEl.style.transition='transform 1.8s cubic-bezier(.08,.78,.12,1)';loseEl.style.transition='transform 1.8s cubic-bezier(.08,.78,.12,1)';t(winEl,winDx,leftWins?-3:3);t(loseEl,loseDx,leftWins?-8:8);if(flag){const base=exactCenterPx(),rr=rope.getBoundingClientRect();if(base!==null)flag.style.left=(base+(leftWins?-rr.width*.28:rr.width*.28))+'px'}finalTimer=setTimeout(()=>{setState(winEl,'final-winner');setState(loseEl,'final-loser');const nm=(leftWins?d.getElementById('leftName'):d.getElementById('rightName'))?.textContent.toLowerCase()||'';const key=nm.includes('azul')?'blue':nm.includes('amarela')?'yellow':nm.includes('verde')?'green':'red';if(originalCelebrate)originalCelebrate(key)},1900)})}
 function sync(){if(ended()){finalCross();return}finalCrossDone=false;const ls=lStatus?.textContent||'',rs=rStatus?.textContent||'';if(ls.includes('ACERTOU'))setState(left,'inplay-happy');else if(ls.includes('ERROU')||ls.includes('TEMPO ESGOTADO'))setState(left,'inplay-panic');else setState(left,'neutral');if(rs.includes('ACERTOU'))setState(right,'inplay-happy');else if(rs.includes('ERROU')||rs.includes('TEMPO ESGOTADO'))setState(right,'inplay-panic');else setState(right,'neutral');const [a,b]=scoreVals();if(a===0&&b===0){t(left,0);t(right,0);centerFlag();updateCoils(0)}}
 const obs=new MutationObserver(sync);[lStatus,rStatus,arena,lScore,rScore].forEach(el=>el&&obs.observe(el,{childList:true,subtree:true,characterData:true}));
 /* centralização feita por coordenada real da linha, não por porcentagem */
 const forceCenter=()=>{const [a,b]=scoreVals();if(a===0&&b===0)centerFlag()};
 requestAnimationFrame(()=>{w.setRope(0);forceCenter()});setTimeout(()=>{w.setRope(0);forceCenter()},180);setTimeout(forceCenter,500);w.addEventListener('resize',forceCenter);sync();
 /* 15 rodadas e encerramento matemático */
 const TOTAL=15,qMeta=d.getElementById('qMeta'),roundNumber=d.getElementById('roundNumber'),originalSchedule=w.schedule.bind(w);function currentRound(){const q=qMeta?.textContent||'';let m=q.match(/Pergunta\s+(\d+)/i);if(m)return parseInt(m[1],10);m=(roundNumber?.textContent||'').match(/RODADA\s+(\d+)/i);return m?parseInt(m[1],10):1}function sudden(){return /DESEMPATE|morte súbita/i.test((qMeta?.textContent||'')+' '+(roundNumber?.textContent||''))}w.schedule=function(delay,a,b){if(sudden())return originalSchedule(delay,a,b);const round=currentRound(),[ls,rs]=scoreVals(),remaining=Math.max(0,TOTAL-round);if(Math.abs(ls-rs)>remaining)return w.setTimeout(()=>w.endMatch(),delay);if(round<TOTAL)return w.setTimeout(()=>w.next(),delay+250);return originalSchedule(delay,a,b)};function fixCounter(){if(!qMeta)return;const t=qMeta.textContent||'';if(/Pergunta\s+\d+\/\d+/i.test(t)){const wanted=`Pergunta ${currentRound()}/${TOTAL}`;if(qMeta.textContent!==wanted)qMeta.textContent=wanted}}const ro=new MutationObserver(fixCounter);if(qMeta)ro.observe(qMeta,{childList:true,subtree:true,characterData:true});fixCounter();
});

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tug of War English</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="game" src="tug-of-war.html?v=20260917-visual9" allow="autoplay"></iframe><script>
const f=document.getElementById('game');
f.addEventListener('load',()=>{
  const d=f.contentDocument;if(!d)return;
  const w=d.defaultView;
  const s=d.createElement('style');
  s.textContent=`
.right .person,.right .person.short,.right .person.tall{transform:none!important}
.right .arm-front{left:-2px!important;right:auto!important;width:22px!important;transform:rotate(-5deg)!important;transform-origin:right center!important;z-index:8!important}
.right .arm-back{left:3px!important;right:auto!important;width:22px!important;transform:rotate(5deg)!important;transform-origin:right center!important;z-index:5!important}
.right .hand-front{left:-8px!important;right:auto!important;z-index:10!important}.right .hand-back{left:-3px!important;right:auto!important;z-index:6!important}.right .grip-shadow{left:-7px!important;right:auto!important}
.left .arm-front{left:24px!important;width:20px!important;transform:rotate(2deg)!important}.left .arm-back{left:19px!important;width:20px!important;transform:rotate(-5deg)!important}.left .hand-back{left:34px!important}.left .hand-front{left:39px!important}.left .grip-shadow{left:36px!important}
.hand-back,.hand-front{top:42px!important;width:13px!important;height:13px!important;border-radius:46%!important}
/* equipes começam mais perto do centro, deixando espaço visível atrás */
.team-people.left{left:11%!important}.team-people.right{right:11%!important}
.rope-wrap{bottom:71px!important;transition:transform 1.45s cubic-bezier(.08,.80,.14,1)!important}.rope{top:5px!important;height:10px!important}.team-people{transition:transform 1.45s cubic-bezier(.08,.80,.14,1)!important;will-change:transform}
.eye-white{top:22px!important;width:9px!important;height:12px!important;background:#fff!important;border:1.6px solid #111!important;border-radius:50%!important;box-shadow:none!important;overflow:visible!important;z-index:13!important}.eye-white.left-eye{left:12px!important}.eye-white.right-eye{left:23px!important}.pupil{position:absolute!important;top:3px!important;left:2px!important;width:5px!important;height:6px!important;background:#000!important;border-radius:50%!important;box-shadow:none!important}.pupil:after{content:'';position:absolute;width:1.8px;height:1.8px;background:#fff;border-radius:50%;top:1px;left:2.4px}.brow{top:18px!important;height:1.5px!important;background:#2b211b!important}.brow.left-brow{left:12px!important}.brow.right-brow{left:23px!important}
.team-people.inplay-happy .mouth{width:14px!important;height:8px!important;left:14px!important;top:31px!important;background:transparent!important;border:0!important;border-bottom:3px solid #7a2d20!important;border-radius:0 0 9px 9px!important}.team-people.inplay-happy .sweat,.team-people.inplay-happy .tear{display:none!important}.team-people.inplay-happy .left-brow{transform:rotate(-4deg)!important}.team-people.inplay-happy .right-brow{transform:rotate(4deg)!important}
.team-people.inplay-panic .mouth{width:10px!important;height:10px!important;left:16px!important;top:31px!important;background:transparent!important;border:2px solid #7a2d20!important;border-top:none!important;border-radius:0 0 8px 8px!important}.team-people.inplay-panic .left-brow{transform:rotate(18deg)!important}.team-people.inplay-panic .right-brow{transform:rotate(-18deg)!important}.team-people.inplay-panic .sweat{display:block!important}.team-people.inplay-panic .tear{display:none!important}
.team-people.final-winner .arm-back,.team-people.final-winner .arm-front{top:34px!important;width:23px!important;transform-origin:2px 50%!important;z-index:9!important}.team-people.final-winner.left .arm-back{left:12px!important;transform:rotate(-72deg)!important}.team-people.final-winner.left .arm-front{left:23px!important;transform:rotate(-108deg)!important}.team-people.final-winner.right .arm-back{left:7px!important;right:auto!important;transform:rotate(-108deg)!important}.team-people.final-winner.right .arm-front{left:18px!important;right:auto!important;transform:rotate(-72deg)!important}.team-people.final-winner .hand-back,.team-people.final-winner .hand-front{top:20px!important;z-index:11!important}.team-people.final-winner.left .hand-back{left:8px!important}.team-people.final-winner.left .hand-front{left:31px!important}.team-people.final-winner.right .hand-back{left:3px!important;right:auto!important}.team-people.final-winner.right .hand-front{left:26px!important;right:auto!important}.team-people.final-winner .person{animation:finalJump .52s ease-in-out 4!important}@keyframes finalJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-19px) rotate(-3deg)}}
.tear{position:absolute;width:5px;height:10px;background:#63c7ff;border:1px solid #dff7ff;border-radius:50% 50% 55% 55%;display:none;z-index:15}.tear.t1{top:31px;left:14px}.tear.t2{top:31px;left:25px}.team-people.final-loser .tear{display:block!important;animation:tearDrop .7s ease-in infinite}.team-people.final-loser .tear.t2{animation-delay:.18s}.team-people.final-loser .sweat{display:none!important}.team-people.final-loser .mouth{width:12px!important;height:7px!important;left:15px!important;top:35px!important;background:transparent!important;border:0!important;border-top:2.5px solid #7a2d20!important;border-radius:8px 8px 0 0!important}.team-people.final-loser .person{animation:finalCry .42s ease-in-out infinite!important}@keyframes tearDrop{0%{transform:translateY(-1px) scale(.75);opacity:0}25%{opacity:1}100%{transform:translateY(12px) scale(1.05);opacity:0}}@keyframes finalCry{0%,100%{transform:translateY(1px) rotate(2deg)}50%{transform:translateY(4px) rotate(-2deg)}}
`;
  d.head.appendChild(s);
  d.querySelectorAll('.person').forEach(p=>{if(!p.querySelector('.tear')){const a=d.createElement('div');a.className='tear t1';const b=d.createElement('div');b.className='tear t2';p.append(a,b)}});
  const left=d.getElementById('leftPeople'),right=d.getElementById('rightPeople'),rope=d.getElementById('ropeWrap'),arenaEl=d.querySelector('.arena'),lStatus=d.getElementById('leftStatus'),rStatus=d.getElementById('rightStatus'),arena=d.getElementById('arenaMsg'),lScore=d.getElementById('leftScore'),rScore=d.getElementById('rightScore'),result=d.getElementById('resultBox');
  const stateClasses=['winner','loser','neutral','inplay-happy','inplay-panic','final-winner','final-loser'];let currentX=0,finalCrossDone=false,finalTimer=null;
  const STEP=76,KICK=52;
  function setState(team,state){if(!team)return;stateClasses.forEach(c=>{if(c!==state)team.classList.remove(c)});if(state)team.classList.add(state)}
  function scoreVals(){return [parseInt(lScore?.textContent||'0',10),parseInt(rScore?.textContent||'0',10)]}
  function ended(){return (arena?.textContent||'').includes('PARTIDA ENCERRADA')}
  function setTeamTransform(el,value){if(el)el.style.setProperty('transform',value,'important')}
  function setRopeTransform(value){if(rope)rope.style.setProperty('transform',value,'important')}
  function applyPosition(x,rotL=0,rotR=0){currentX=x;setRopeTransform(`translateX(${x}px)`);setTeamTransform(left,`translateX(${x}px) rotate(${rotL}deg)`);setTeamTransform(right,`translateX(${x}px) rotate(${rotR}deg)`)}
  function clampPlayX(x){if(!arenaEl||!left||!right)return x;const ar=arenaEl.getBoundingClientRect(),lr=left.getBoundingClientRect(),rr=right.getBoundingClientRect(),margin=20;const minX=Math.max((ar.left+margin)-lr.left,(ar.left+margin)-rr.left)+currentX;const maxX=Math.min((ar.right-margin)-lr.right,(ar.right-margin)-rr.right)+currentX;return Math.max(minX,Math.min(maxX,x))}
  /* zero SEMPRE volta ao centro — evita iniciar nova partida com bandeira pendendo */
  w.setRope=function(diff){if(Number(diff)===0){finalCrossDone=false;applyPosition(0);return}if(ended()||finalCrossDone)return;const n=Math.max(-7,Math.min(7,diff));applyPosition(clampPlayX(-n*STEP))};
  w.pull=function(winner){if(ended()||finalCrossDone)return;const [a,b]=scoreVals(),loseSide=winner==='left'?'right':'left',winEl=winner==='left'?left:right,loseEl=loseSide==='left'?left:right;if(typeof w.setFace==='function'){w.setFace(winEl,'laugh');w.setFace(loseEl,'panic')}if(typeof w.dust==='function')w.dust(loseSide);const diff=a-b,target=clampPlayX(-diff*STEP),dir=winner==='left'?-1:1,kick=clampPlayX(target+dir*KICK);applyPosition(kick,winner==='left'?-3:2,winner==='left'?-7:3);setTimeout(()=>{if(!ended()&&!finalCrossDone)applyPosition(target)},640)};
  w.bothPull=function(){if(ended()||finalCrossDone)return;if(typeof w.setFace==='function'){w.setFace(left,'laugh');w.setFace(right,'laugh')}const [a,b]=scoreVals();applyPosition(clampPlayX(-(a-b)*STEP))};
  const originalCelebrate=typeof w.celebrate==='function'?w.celebrate.bind(w):null;w.celebrate=function(team){const txt=result?.textContent||'';if(txt.includes('venceu a partida'))return;if(originalCelebrate)originalCelebrate(team)};
  function finalCross(){if(finalCrossDone||!ended()||!arenaEl)return;const [a,b]=scoreVals();if(a===b)return;finalCrossDone=true;clearTimeout(finalTimer);const leftWins=a>b,winEl=leftWins?left:right,loseEl=leftWins?right:left;setState(winEl,'inplay-happy');setState(loseEl,'inplay-panic');requestAnimationFrame(()=>{const ar=arenaEl.getBoundingClientRect(),wr=winEl.getBoundingClientRect(),lr=loseEl.getBoundingClientRect(),center=ar.left+ar.width/2,margin=22;let winDx=0,loseDx=0;if(leftWins){winDx=(ar.left+margin)-wr.left;loseDx=(center-28)-lr.right}else{winDx=(ar.right-margin)-wr.right;loseDx=(center+28)-lr.left}winEl.style.transition='transform 1.8s cubic-bezier(.08,.78,.12,1)';loseEl.style.transition='transform 1.8s cubic-bezier(.08,.78,.12,1)';if(rope)rope.style.transition='transform 1.8s cubic-bezier(.08,.78,.12,1)';setTeamTransform(winEl,`translateX(${winDx}px) rotate(${leftWins?-3:3}deg)`);setTeamTransform(loseEl,`translateX(${loseDx}px) rotate(${leftWins?-8:8}deg)`);const ropeDx=leftWins?Math.min(winDx,loseDx):Math.max(winDx,loseDx);setRopeTransform(`translateX(${ropeDx}px)`);finalTimer=setTimeout(()=>{setState(winEl,'final-winner');setState(loseEl,'final-loser');const winnerKey=leftWins?(d.getElementById('leftName')?.textContent||'').toLowerCase():(d.getElementById('rightName')?.textContent||'').toLowerCase();const key=winnerKey.includes('azul')?'blue':winnerKey.includes('amarela')?'yellow':winnerKey.includes('verde')?'green':'red';if(originalCelebrate)originalCelebrate(key)},1900)})}
  function syncFaces(){if(ended()){finalCross();return}finalCrossDone=false;const ls=lStatus?.textContent||'',rs=rStatus?.textContent||'';if(ls.includes('ACERTOU'))setState(left,'inplay-happy');else if(ls.includes('ERROU')||ls.includes('TEMPO ESGOTADO'))setState(left,'inplay-panic');else setState(left,'neutral');if(rs.includes('ACERTOU'))setState(right,'inplay-happy');else if(rs.includes('ERROU')||rs.includes('TEMPO ESGOTADO'))setState(right,'inplay-panic');else setState(right,'neutral');const [a,b]=scoreVals();if(a===0&&b===0)applyPosition(0)}
  const obs=new MutationObserver(syncFaces);[lStatus,rStatus,arena,lScore,rScore].forEach(el=>el&&obs.observe(el,{childList:true,subtree:true,characterData:true}));
  /* garante bandeira exatamente no centro no carregamento */
  requestAnimationFrame(()=>applyPosition(0));setTimeout(()=>applyPosition(0),150);syncFaces();

  /* 15 RODADAS + encerramento matemático antecipado */
  const TOTAL_ROUNDS=15,qMeta=d.getElementById('qMeta'),roundNumber=d.getElementById('roundNumber');
  const originalSchedule=w.schedule.bind(w);
  function currentRound(){const q=qMeta?.textContent||'';let m=q.match(/Pergunta\s+(\d+)/i);if(m)return parseInt(m[1],10);const r=roundNumber?.textContent||'';m=r.match(/RODADA\s+(\d+)/i);return m?parseInt(m[1],10):1}
  function isSuddenDeath(){return /DESEMPATE|morte súbita/i.test((qMeta?.textContent||'')+' '+(roundNumber?.textContent||''))}
  w.schedule=function(delay,a,b){if(isSuddenDeath())return originalSchedule(delay,a,b);const round=currentRound(),[ls,rs]=scoreVals(),remaining=Math.max(0,TOTAL_ROUNDS-round);if(Math.abs(ls-rs)>remaining){if(result)result.textContent+=` Vantagem inalcançável: restam ${remaining} rodada${remaining===1?'':'s'}.`;return w.setTimeout(()=>w.endMatch(),delay)}if(round<TOTAL_ROUNDS)return w.setTimeout(()=>w.next(),delay+250);return originalSchedule(delay,a,b)};
  function fixCounter(){if(!qMeta)return;const t=qMeta.textContent||'';if(/Pergunta\s+\d+\/\d+/i.test(t)){const n=currentRound(),wanted=`Pergunta ${n}/${TOTAL_ROUNDS}`;if(qMeta.textContent!==wanted)qMeta.textContent=wanted}}
  const roundObs=new MutationObserver(fixCounter);if(qMeta)roundObs.observe(qMeta,{childList:true,subtree:true,characterData:true});fixCounter();
});
</script></body></html>

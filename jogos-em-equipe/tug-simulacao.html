<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tug of War — Simulação Completa</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816}iframe{border:0;width:100%;height:100%;display:block}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050816;color:#fff;font:900 18px Arial;z-index:5}.loading.hide{display:none}</style></head><body><div class="loading" id="loading">Preparando campeonato...</div><iframe id="outer" src="tug-of-war-final.html?v=20260917-simwrap4" allow="autoplay"></iframe><script>
const params=new URLSearchParams(location.search);const player=params.get('equipe')||'blue';const outer=document.getElementById('outer');const loading=document.getElementById('loading');
outer.addEventListener('load',()=>{
  const od=outer.contentDocument;if(!od)return;
  const inner=od.getElementById('game');if(!inner)return;
  const desired='tug-of-war.html?v=20260917-simcore4&equipe='+encodeURIComponent(player)+'&modo=simulacao';
  if(!inner.src.includes('modo=simulacao'))inner.src=desired;
  let injected=false,tries=0;
  const boot=setInterval(()=>{
    tries++;
    try{
      const d=inner.contentDocument,w=inner.contentWindow;
      if(!d||!d.body)return;
      if(injected||d.getElementById('tug-sim-loader')){injected=true;clearInterval(boot);loading.classList.add('hide');return}
      if(typeof w.endMatch==='function'&&typeof w.setRope==='function'){
        const s=d.createElement('script');s.id='tug-sim-loader';s.src='tug-tournament-sim.js?v=20260917-torneio4';d.body.appendChild(s);injected=true;clearInterval(boot);loading.classList.add('hide');
      }
    }catch(e){}
    if(tries>120){clearInterval(boot);loading.textContent='Não foi possível iniciar a simulação. Atualize a página.'}
  },100);
});
</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Game Hub</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #052b78;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Tela principal */
.hub-screen {
  position: relative;
  width: min(100vw, 520px);
  height: 100dvh;
  overflow: hidden;
  background: #052b78;
}

/* Imagem principal do hub */
.hub-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: #052b78;
}

/* Botões invisíveis sobre os botões da imagem */
.grade-link {
  position: absolute;
  display: block;
  z-index: 5;
  border-radius: 24px;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Efeito discreto ao tocar/clicar */
.grade-link:active {
  background: rgba(255, 255, 255, 0.16);
  box-shadow: 0 0 18px rgba(255,255,255,.45);
}

/*
  Posição dos botões baseada na imagem vertical 9:16.
  Se precisar ajustar depois, mexemos só nesses números.
*/

.btn-6 {
  left: 4%;
  top: 68.8%;
  width: 44%;
  height: 9.1%;
}

.btn-7 {
  left: 52%;
  top: 68.8%;
  width: 44%;
  height: 9.1%;
}

.btn-8 {
  left: 4%;
  top: 80.2%;
  width: 44%;
  height: 9.1%;
}

.btn-9 {
  left: 52%;
  top: 80.2%;
  width: 44%;
  height: 9.1%;
}

/* Botão pequeno de música */
.sound-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 8;
  border: 1px solid rgba(255,255,255,.5);
  background: rgba(0, 30, 90, .58);
  color: white;
  font-weight: 900;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 999px;
  backdrop-filter: blur(4px);
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(0,0,0,.25);
}

/* Acessibilidade: textos dos links ficam ocultos visualmente */
.grade-link span {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Ajustes para telas muito largas no computador */
@media (min-width: 700px) {
  body {
    background:
      radial-gradient(circle at top, rgba(59,130,246,.35), transparent 35%),
      linear-gradient(180deg, #031a4b, #052b78);
  }

  .hub-screen {
    box-shadow: 0 0 40px rgba(0,0,0,.35);
  }
}

/* Ajuste para celulares muito baixos */
@media (max-height: 690px) {
  .sound-btn {
    font-size: 10px;
    padding: 6px 8px;
  }
}
</style>
</head>

<body>

<main class="hub-screen">

  <img
    class="hub-image"
    src="english-game-hub-tela-inicial.png?v=1"
    alt="English Game Hub - Escolha sua série e jogue"
  />

  <button class="sound-btn" onclick="toggleMusic()">🎵 Música</button>

  <a class="grade-link btn-6" href="6ano.html" aria-label="Entrar no 6º Ano">
    <span>6º Ano</span>
  </a>

  <a class="grade-link btn-7" href="7ano.html" aria-label="Entrar no 7º Ano">
    <span>7º Ano</span>
  </a>

  <a class="grade-link btn-8" href="8ano.html" aria-label="Entrar no 8º Ano">
    <span>8º Ano</span>
  </a>

  <a class="grade-link btn-9" href="9ano.html" aria-label="Entrar no 9º Ano">
    <span>9º Ano</span>
  </a>

</main>

<audio id="bgMusic" loop>
  <source src="musica-fundo.mp3.mp3" type="audio/mpeg">
  <source src="musica-fundo.mp3" type="audio/mpeg">
</audio>

<script>
let musicOn = false;

function toggleMusic() {
  const audio = document.getElementById("bgMusic");
  const btn = document.querySelector(".sound-btn");

  if (!audio) return;

  if (!musicOn) {
    audio.volume = 0.35;
    audio.play()
      .then(() => {
        musicOn = true;
        btn.textContent = "🔇 Pausar";
      })
      .catch(() => {
        btn.textContent = "🎵 Música";
      });
  } else {
    audio.pause();
    musicOn = false;
    btn.textContent = "🎵 Música";
  }
}
</script>

</body>
</html>

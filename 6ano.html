<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>6º Ano — English Game Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --yellow1:#fff7ad;
  --yellow2:#facc15;
  --yellow3:#f59e0b;
  --blue1:#1d4ed8;
  --blue2:#0f2f7a;
  --white:#ffffff;
  --text:#1e293b;
}

html,body{
  width:100%;
  height:100%;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
}

body{
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.55), transparent 22%),
    radial-gradient(circle at top right, rgba(29,78,216,.18), transparent 20%),
    linear-gradient(180deg,var(--yellow1) 0%, var(--yellow2) 48%, var(--yellow3) 100%);
  color:var(--text);
}

.page{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px;
}

.container{
  width:min(100%, 1100px);
  height:calc(100dvh - 16px);
  background:rgba(255,255,255,.18);
  border-radius:24px;
  backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,.45);
  box-shadow:0 18px 40px rgba(120,53,15,.18);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}

.back-btn{
  text-decoration:none;
  background:linear-gradient(135deg,var(--blue2),var(--blue1));
  color:white;
  font-weight:900;
  border-radius:999px;
  padding:10px 14px;
  font-size:13px;
  box-shadow:0 8px 16px rgba(15,47,122,.24);
  white-space:nowrap;
}

.level-pill{
  background:linear-gradient(135deg,#f59e0b,#facc15);
  color:#78350f;
  font-weight:900;
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  box-shadow:0 6px 14px rgba(180,83,9,.16);
  white-space:nowrap;
}

.hero-wrap{
  flex:1 1 42%;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.72);
  border-radius:22px;
  padding:8px;
  overflow:hidden;
}

.hero-image{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:18px;
  display:block;
}

.games-section{
  flex:1 1 58%;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.section-title{
  text-align:center;
  font-size:20px;
  font-weight:900;
  color:var(--blue2);
  text-shadow:2px 2px 0 rgba(250,204,21,.55);
  flex:0 0 auto;
}

.games-grid{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
}

.game-btn{
  text-decoration:none;
  border-radius:20px;
  padding:12px 10px;
  background:
    radial-gradient(circle at top right, rgba(255,255,255,.45), transparent 28%),
    linear-gradient(145deg,#ffffff 0%, #fff7d6 52%, #fde68a 100%);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 10px 20px rgba(120,53,15,.13);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
  transition:.18s ease;
  min-height:92px;
}

.game-btn:hover{
  transform:translateY(-2px) scale(1.01);
}

.game-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--blue1),var(--blue2));
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  box-shadow:0 8px 16px rgba(29,78,216,.22);
  flex:0 0 auto;
}

.game-name{
  font-size:15px;
  font-weight:900;
  color:var(--blue2);
  line-height:1.08;
}

.footer{
  flex:0 0 auto;
  text-align:center;
  font-size:12px;
  font-weight:900;
  color:#78350f;
  opacity:.95;
  padding-top:2px;
}

/* Tablet/mobile */
@media(max-width:850px){
  .container{
    border-radius:18px;
    padding:8px;
    gap:8px;
  }

  .topbar{
    gap:6px;
  }

  .back-btn,
  .level-pill{
    font-size:11px;
    padding:8px 10px;
  }

  .hero-wrap{
    flex:1 1 40%;
    border-radius:16px;
    padding:6px;
  }

  .hero-image{
    border-radius:14px;
  }

  .section-title{
    font-size:17px;
  }

  .games-grid{
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
  }

  .game-btn{
    min-height:78px;
    padding:10px 8px;
    border-radius:16px;
  }

  .game-icon{
    width:36px;
    height:36px;
    font-size:18px;
    border-radius:12px;
  }

  .game-name{
    font-size:13px;
  }

  .footer{
    font-size:10.5px;
  }
}

/* celulares menores */
@media(max-width:420px){
  .page{
    padding:6px;
  }

  .container{
    height:calc(100dvh - 12px);
    gap:6px;
    padding:6px;
  }

  .back-btn,
  .level-pill{
    font-size:10px;
    padding:7px 9px;
  }

  .hero-wrap{
    flex:1 1 38%;
    padding:5px;
  }

  .section-title{
    font-size:15px;
  }

  .games-grid{
    gap:6px;
  }

  .game-btn{
    min-height:72px;
    padding:8px 6px;
  }

  .game-icon{
    width:32px;
    height:32px;
    font-size:16px;
  }

  .game-name{
    font-size:12px;
  }

  .footer{
    font-size:9.5px;
  }
}
</style>
</head>
<body>

<div class="page">
  <div class="container">

    <div class="topbar">
      <a class="back-btn" href="index.html">← Voltar ao Hub</a>
      <div class="level-pill">6º Ano • Yellow Level</div>
    </div>

    <div class="hero-wrap">
      <img
        class="hero-image"
        src="6ano-tela-inicial-amarela.png?v=1"
        alt="6º Ano - English Game Hub"
      >
    </div>

    <div class="games-section">
      <div class="section-title">Escolha seu jogo</div>

      <div class="games-grid">
        <a class="game-btn" href="6ano-spin-and-answer.html">
          <div class="game-icon">🎡</div>
          <div class="game-name">Spin and Answer</div>
        </a>

        <a class="game-btn" href="6ano-hangman-challenge.html">
          <div class="game-icon">🌻</div>
          <div class="game-name">Hangman Challenge</div>
        </a>

        <a class="game-btn" href="6ano-smart-choice.html">
          <div class="game-icon">💡</div>
          <div class="game-name">Smart Choice</div>
        </a>

        <a class="game-btn" href="6ano-board-game.html">
          <div class="game-icon">🏁</div>
          <div class="game-name">Board Game</div>
        </a>

        <a class="game-btn" href="6ano-listening-speaking-game.html">
          <div class="game-icon">🎧</div>
          <div class="game-name">Listening & Speaking</div>
        </a>

        <a class="game-btn" href="6ano-mission-game.html">
          <div class="game-icon">🗺️</div>
          <div class="game-name">Mission Game</div>
        </a>
      </div>
    </div>

    <div class="footer">
      Jogo idealizado pelo professor Jasson Bruno.
    </div>

  </div>
</div>

</body>
</html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#031d3a}
body{min-height:100dvh;display:flex;justify-content:center;background:radial-gradient(circle at 50% 0%,rgba(0,196,255,.18),transparent 34%),linear-gradient(180deg,#021a38,#06134f)}
.hub{position:relative;width:min(100vw,941px);margin:0 auto;line-height:0;overflow:hidden;background:#063c76}
.hub-image{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.game-hotspot{position:absolute;left:14.3%;width:66.8%;height:7%;z-index:5;border-radius:999px;text-decoration:none;cursor:pointer;background:rgba(255,255,255,0);outline:none;transition:background .16s ease,box-shadow .16s ease,transform .12s ease}
.game-hotspot:hover,.game-hotspot:focus-visible{background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 28px rgba(74,222,255,.85)}
.game-hotspot:active{transform:scale(.985)}
.g1{top:46.70%}.g2{top:54.35%}.g3{top:62.05%}.g4{top:69.72%}.g5{top:77.42%}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.load-error{display:none;min-height:100dvh;padding:28px 18px;color:#fff;text-align:center;line-height:1.5;background:linear-gradient(180deg,#073b74,#071a48)}
.load-error.show{display:flex;align-items:center;justify-content:center}
.load-error div{width:min(100%,480px);padding:22px;border-radius:20px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18)}
.load-error b{color:#ffe66d}
@media(min-width:942px){.hub{margin:14px auto;border-radius:24px;box-shadow:0 25px 65px rgba(0,0,0,.48)}}
</style>
</head>
<body>
<main id="hub" class="hub" aria-label="English Game Hub da Turma 703">

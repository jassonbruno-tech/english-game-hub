<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#031d3a}
  body{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%,rgba(0,196,255,.18),transparent 34%),
      linear-gradient(180deg,#021a38,#06134f);
  }

  .hub{
    position:relative;
    width:min(100vw, 941px);
    margin:0 auto;
    line-height:0;
    overflow:hidden;
    background:#063c76;
  }

  .hub-image{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }

  .game-hotspot{
    position:absolute;
    left:14.3%;
    width:66.8%;
    height:7.0%;
    z-index:5;
    border-radius:999px;
    text-decoration:none;
    cursor:pointer;
    background:rgba(255,255,255,.06);
    outline:none;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 0 18px rgba(255,230,109,.18);
    transition:background .18s ease,box-shadow .18s ease,transform .12s ease;
    animation:hotspotPulse 2.1s ease-in-out infinite;
  }

  .game-hotspot::before{
    content:"";
    position:absolute;
    inset:-20% -35%;
    background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.30) 48%,rgba(255,255,255,.65) 50%,rgba(255,255,255,.25) 52%,rgba(255,255,255,0) 65%);
    transform:translateX(-120%) skewX(-18deg);
    animation:hotspotShine 3.8s ease-in-out infinite;
    pointer-events:none;
  }

  .game-hotspot:hover,
  .game-hotspot:focus-visible{
    background:rgba(255,255,255,.12);
    box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 32px rgba(74,222,255,.95),0 0 18px rgba(255,230,109,.45);
    transform:scale(1.02);
  }

  .game-hotspot:active{transform:scale(.985)}

  .g1{animation-delay:0s}
  .g2{animation-delay:.18s}
  .g3{animation-delay:.36s}
  .g4{animation-delay:.54s}
  .g5{animation-delay:.72s}

  .g1::before{animation-delay:0s}
  .g2::before{animation-delay:.35s}
  .g3::before{animation-delay:.7s}
  .g4::before{animation-delay:1.05s}
  .g5::before{animation-delay:1.4s}

  @keyframes hotspotPulse{
    0%,100%{background:rgba(255,255,255,.04); box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 14px rgba(255,230,109,.12);}
    50%{background:rgba(255,255,255,.10); box-shadow:0 0 0 2px rgba(255,255,255,.20),0 0 28px rgba(255,230,109,.28),0 0 18px rgba(74,222,255,.24);}
  }

  @keyframes hotspotShine{
    0%,70%,100%{transform:translateX(-140%) skewX(-18deg); opacity:0;}
    12%{opacity:.75;}
    32%{transform:translateX(140%) skewX(-18deg); opacity:.05;}
  }

  .g1{top:46.70%}
  .g2{top:54.35%}
  .g3{top:62.05%}
  .g4{top:69.72%}
  .g5{top:77.42%}

  .sr-only{
    position:absolute!important;
    width:1px!important;height:1px!important;
    padding:0!important;margin:-1px!important;
    overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  .load-error{
    display:none;
    min-height:100dvh;
    padding:28px 18px;
    color:#fff;
    text-align:center;
    line-height:1.5;
    background:linear-gradient(180deg,#073b74,#071a48);
  }
  .load-error.show{display:flex;align-items:center;justify-content:center}
  .load-error div{
    width:min(100%,480px);
    padding:22px;
    border-radius:20px;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.18);
  }
  .load-error b{color:#ffe66d}

  @media (min-width:942px){
    .hub{
      margin:14px auto;
      border-radius:24px;
      box-shadow:0 25px 65px rgba(0,0,0,.48);
    }
  }
</style>
</head>
<body>

<main id="hub" class="hub" aria-label="English Game Hub da Turma 703">
  <img
    id="hubImage"
    class="hub-image"
    src="703-game-hub-portugues-final.png?v=31"
    alt="English Game Hub da Turma 703 da Escola Municipal Princesa Izabel, com os jogos Roleta do Inglês, Jogo da Forca, Combinação de Vocabulário, Desafio de Pronúncia e Show do Milhão."
  >

  <a class="game-hotspot g1"
     href="703-quanticompare-challenge.html"
     aria-label="Jogar Combinação de Vocabulário"
     title="Combinação de Vocabulário">
    <span class="sr-only">Combinação de Vocabulário</span>
  </a>

  <a class="game-hotspot g2"
     href="703-quanticompare-hangman.html"
     aria-label="Jogar Jogo da Forca"
     title="Jogo da Forca">
    <span class="sr-only">Jogo da Forca</span>
  </a>

  <a class="game-hotspot g3"
     href="703-english-spin-and-answer.html"
     aria-label="Jogar Roleta do Inglês"
     title="Roleta do Inglês">
    <span class="sr-only">Roleta do Inglês</span>
  </a>

  <a class="game-hotspot g4"
     href="703-english-voice-challenge.html"
     aria-label="Jogar Desafio de Pronúncia"
     title="Desafio de Pronúncia">
    <span class="sr-only">Desafio de Pronúncia</span>
  </a>

  <a class="game-hotspot g5"
     href="703-show-do-milhao.html"
     aria-label="Jogar Show do Milhão"
     title="Show do Milhão">
    <span class="sr-only">Show do Milhão</span>
  </a>
</main>

<section id="loadError" class="load-error" aria-live="polite">
  <div>
    <h1>English Game Hub — Turma 703</h1>
    <p>A imagem principal não foi carregada.</p>
    <p>Verifique se o arquivo <b>703-game-hub-portugues-final.png</b> está no mesmo diretório deste HTML.</p>
  </div>
</section>

<script>
(function(){
  const img = document.getElementById("hubImage");
  const hub = document.getElementById("hub");
  const error = document.getElementById("loadError");

  img.addEventListener("error", function(){
    hub.style.display = "none";
    error.classList.add("show");
  });

  img.addEventListener("load", function(){
    if(!img.naturalWidth || !img.naturalHeight){
      hub.style.display = "none";
      error.classList.add("show");
    }
  });
})();
</script>
</body>

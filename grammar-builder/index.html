<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Builder</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#08245a;color:#fff}.app{max-width:520px;min-height:100vh;margin:auto;padding:16px}.head{font-size:22px;font-weight:900}.bar{height:8px;background:#ffffff33;border-radius:10px;margin:14px 0}.bar i{display:block;height:100%;background:#67e8f9;border-radius:10px}.card{background:#fff;color:#13233f;border-radius:24px;padding:20px;min-height:560px}.cap{font-size:12px;color:#2563eb;font-weight:900;text-transform:uppercase}.scene{text-align:center;font-size:68px;margin:18px}.think{background:#eef6ff;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center}.face{font-size:38px}.q{font-size:19px;font-weight:900}.hint{font-size:14px;color:#52637a;margin-top:4px}.phrase{text-align:center;font-size:22px;font-weight:900;margin:15px}.bridge{text-align:center;margin:12px;font-weight:900;color:#1d4ed8}.opts{display:grid;gap:10px}.opts button,.next,.help{border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:900}.opts button{background:#e8f0ff;color:#153a78;border:2px solid #bdd3ff}.fb{margin-top:12px;padding:12px;border-radius:14px;background:#f1f5f9;display:none;font-weight:700}.next{width:100%;margin-top:12px;background:#2563eb;color:#fff;display:none}.help{width:100%;background:transparent;color:#2563eb;font-size:14px}.rule{background:#fff4c2;padding:14px;border-radius:16px;text-align:center;font-weight:800;margin-top:18px}</style></head><body><main class="app"><div class="head">🧠 Grammar Builder <small>• teste</small></div><div class="bar"><i id="p"></i></div><section class="card" id="c"></section></main><script>
const L=[
["Capítulo 1 • Quem?","👧","Maria is my friend.","Quem pode substituir MARIA?","O nome pode ser trocado por um pronome.",["HE","SHE","THEY"],"SHE","MARIA ↔ SHE. Nome e pronome podem ocupar o mesmo lugar."],
["Capítulo 1 • Quem?","👦","HE is playing.","Qual nome poderia substituir HE?","Agora faça a troca no outro sentido.",["Maria","Lucas","Ana and Maria"],"Lucas","LUCAS ↔ HE. A troca funciona nos dois sentidos."],
["Capítulo 1 • Quem?","👧👦","THEY are students.","Quem poderia substituir THEY?","THEY fala de mais de uma pessoa.",["Pedro","Ana","Ana and Pedro"],"Ana and Pedro","ANA + PEDRO ↔ THEY."],
["Capítulo 2 • Ser ou estar","👧🙂","Maria está feliz.","Maria = SHE. SHE combina com...","Descubra a combinação do inglês.",["AM","IS","ARE"],"IS","MARIA → SHE → IS. Maria is happy."],
["Capítulo 2 • Ser ou estar","👧👦🙂","Ana e Pedro estão felizes.","Ana + Pedro = THEY. THEY combina com...", "Use a ponte.",["AM","IS","ARE"],"ARE","ANA + PEDRO → THEY → ARE."],
["Laboratório de frases","👧🙂","Maria is happy.","Como o inglês transforma isso em pergunta?","Em inglês, a estrutura muda.",["Maria is happy?","Is Maria happy?","Maria happy is?"],"Is Maria happy?","IS foi para a frente: Is Maria happy?"],
["Laboratório de frases","👦😴","Pedro is tired.","Como fazemos a negativa?","Procure a posição de NOT.",["Pedro not is tired.","Pedro is not tired.","Not Pedro is tired."],"Pedro is not tired.","PEDRO + IS + NOT + TIRED."],
["Capítulo 3 • Acontecendo agora","👧⚽","Maria está jogando futebol.","Qual frase segue a lógica do inglês?","Maria = SHE → IS → ação com -ING.",["Maria playing soccer.","Maria is playing soccer.","Maria are play soccer."],"Maria is playing soccer.","MARIA + IS + PLAYING."],
["Caça ao erro","👧🏃","She running.","O monstro roubou uma peça. Qual?","A ação acontecendo agora precisa do TO BE.",["AM","IS","ARE"],"IS","SHE + IS + RUNNING."],
["Transforme","👧⚽","Maria is playing soccer.","Transforme em NEGATIVA.","Pense na posição de NOT.",["Maria not is playing soccer.","Maria is not playing soccer.","Maria is playing not soccer."],"Maria is not playing soccer.","MARIA + IS + NOT + PLAYING."],
["Transforme","👧⚽❓","Maria is playing soccer.","Transforme em PERGUNTA.","Qual peça vai para a frente?",["Maria is playing soccer?","Is Maria playing soccer?","Does Maria is playing soccer?"],"Is Maria playing soccer?","IS + MARIA + PLAYING?"],
["Grammar Master","👦👧📚","Lucas and Ana are studying.","Qual pergunta está correta?","Pense na dinâmica do inglês.",["Are Lucas and Ana studying?","Lucas and Ana are studying?","Do Lucas and Ana are studying?"],"Are Lucas and Ana studying?","ARE foi para a frente do sujeito."]
];let n=0;
function show(){let x=L[n];p.style.width=(n/L.length*100)+"%";c.innerHTML='<div class=cap>'+x[0]+'</div><div class=scene>'+x[1]+'</div><div class=phrase>'+x[2]+'</div><div class=think><div class=face>🤔</div><div><div class=q>'+x[3]+'</div><div class=hint>'+x[4]+'</div></div></div><div class=bridge>🇧🇷 significado → 🇺🇸 organização do inglês</div><div class=opts>'+x[5].map(v=>'<button>'+v+'</button>').join("")+'</div><div class=fb id=f></div><button class=help id=h>💡 Me ajuda</button><button class=next id=nx>Continuar →</button>';document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>ans(b,x));h.onclick=()=>{f.style.display="block";f.innerHTML="💡 "+x[4]};nx.onclick=()=>{n++;n<L.length?show():done()}}
function ans(b,x){f.style.display="block";if(b.textContent===x[6]){f.innerHTML="✅ "+x[7];document.querySelectorAll(".opts button").forEach(z=>z.disabled=true);nx.style.display="block"}else f.innerHTML="🤔 Ainda não. "+x[4]+" Tente outra vez."}
function done(){p.style.width="100%";c.innerHTML='<div class=cap>Protótipo concluído</div><div class=scene>🏆</div><div class=think><div class=face>🤔</div><div class=q>Você descobriu a lógica!</div></div><div class=rule>🇧🇷 O português ajuda a entender o significado.<br><br>🇺🇸 O inglês tem sua própria organização.</div><button class="next" style="display:block" onclick="n=0;show()">Jogar novamente</button>'}show();
</script></body></html>

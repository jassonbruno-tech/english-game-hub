,['reading','lendo'],['cooking','cozinhando'],['playing','jogando'],['running','correndo']],cmp=[['tall','taller'],['old','older'],['young','younger'],['big','bigger'],['easy','easier'],['good','better'],['bad','worse'],['interesting','more interesting'],['difficult','more difficult']];function Q(id,m,t,p,a,o,tip){return{id,m,t,p,a,o:sh([...new Set([a,...o])]).slice(0,4),tip}}function bank(){let b=[],n=0,A=(m,t,p,a,o,tip)=>b.push(Q(`${m}-${++n}`,m,t,p,a,o,tip));fam.forEach(([e,p],i)=>{A(1,'Family Members',`What does “${e}” mean?`,p,['amigo','professor','vizinho'],`${e} = ${p}.`);A(2,'Family Life',`Complete: This is my ___. (${p})`,e,['school','teacher','friend'],`Use ${e}.`);if(i<5){let r=[["My mother's brother is my...",'uncle'],["My father's mother is my...",'grandmother'],["My aunt's son is my...",'cousin'],["My mother's father is my...",'grandfather'],["My father's sister is my...",'aunt']][i];A(3,'Family Members',r[0],r[1],['cousin','brother','mother'],'Pense na relação familiar.')}});acts.forEach(([e,p])=>{A(1,'Present Continuous',`Qual palavra em inglês significa “${p}”?`,e,['many','better','family'],'Use verbo-ing.');A(2,'Present Continuous',`Complete: She is ___ now.`,e,['are','am',e.replace(/ing$/,'')],'She + is + verbo-ing.');A(4,'Present Information',`Resposta: They are ${e}. Qual pergunta combina?`,'What are they doing?',['Where are they?','Who are they?','How old are they?'],'A resposta mostra uma ação.')});[['all','todos'],['most','a maioria'],['many','muitos'],['some','alguns'],['a few','poucos'],['not many','não muitos'],['a lot of','muitos']].forEach(([e,p])=>{A(1,'Quantifiers',`${e} indica...`,p,['lugar','idade','comparação'],`${e} é quantifier.`);A(3,'Quantifiers',`Qual expressão significa “${p} alunos”?`,e,['better','where','family'],`Use ${e}.`)});cmp.forEach(([a,c])=>{A(2,'Comparatives',`Qual é o comparativo de ${a}?`,c,[`more ${a}`,`${a}est`,`very ${a}`],`${a} → ${c}.`);A(4,'Comparatives',`Complete: This is ___ than that. (${a})`,c,[`more ${a}`,`${a}est`,a],`Comparativo: ${c}.`)});[['My aunt\'s daughter is my...','cousin',['sister','mother','grandmother'],'Filha da tia = prima.'],['Most people in my family live nearby. “Most” indica...','a maioria',['todos','poucos','ninguém'],'Most = a maioria.'],['Bad tem qual comparativo?','worse',['badder','more bad','worst'],'Bad → worse.'],['Today is better than yesterday. Better é comparativo de...','good',['bad','old','easy'],'Good → better.']].forEach(x=>A(5,'Final Challenge',...x));for(let m=1;m<=5;m++){let i=0;while(b.filter(x=>x.m===m).length<18){let[e,p]=fam[i%fam.length];A(m,'Family Members',`Desafio: ${e} significa...`,p,['escola','professor','cidade'],`${e} = ${p}.`);i++}}return b}const BANK=bank();let S={},timer,introTimer,ac;function seen(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch{return[]}}function fresh(m){let s=new Set(seen()),p=BANK.filter(x=>x.m===m),d=[...sh(p.filter(x=>!s.has(x.id))),...sh(p.filter(x=>s.has(x.id)))].slice(0,ROUNDS);try{localStorage.setItem(HKEY,JSON.stringify([...seen(),...d.map(x=>x.id)].filter((v,i,a)=>a.indexOf(v)===i).slice(-700)))}catch{}return d}function audio(){let A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}function tone(f,t,d,v=.05,type='triangle'){let c=audio();if(!c)return;try{let o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.03)}catch{}}function winSound(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.075,.22,.06));tone(1319,.32,.34,.05)}function introSound(){[392,523,659].forEach((f,i)=>tone(f,i*.12,.22,.035))}function loseSound(){tone(220,0,.18,.03,'sawtooth');tone(196,.12,.2,.025)}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function prize(){return(S.correct+1)*10}function pct(){return Math.min(100,Math.round(S.correct/(MISSIONS*ROUNDS)*100))}function hud(){$('mission').textContent=`Missão ${S.mission+1}/5`;$('round').textContent=`${S.round+1}/10`;$('score').textContent=`🌽 ${S.score} milhos`;$('lives').textContent='❤️'.repeat(S.lives)+'🖤'.repeat(MAX-S.lives)}function begin(){let n=$('name').value.trim();if(!n)return alert('Digite o nome.');audio();S={name:n,klass:$('klass').value||'703',school:$('school').value||'Escola Municipal Princesa Izabel',mission:0,round:0,score:0,correct:0,lives:MAX,skip:3,tip:false,fifty:false,deck:fresh(1),answered:false,lastCorrect:false,checkpoint:{score:0,correct:0}};show('s1');prepare(true)}function prepare(first=false){clearInterval(timer);clearTimeout(introTimer);let v=prize();$('announce').textContent=first?`PERGUNTA VALENDO ${v} MILHOS!`:(S.lastCorrect?`AGORA VAMOS PARA A PERGUNTA QUE VALE ${v} MILHOS!`:`PRÓXIMA PERGUNTA VALENDO ${v} MILHOS!`);$('sub').textContent=`Você já acumulou ${S.score} milhos 🌽`;$('intro').classList.add('show');introSound();introTimer=setTimeout(()=>{$('intro').classList.remove('show');$('stage').classList.add('show');introTimer=setTimeout(()=>{$('stage').classList.remove('show');load()},1500)},2200)}function load(){let x=S.deck[S.round];S.cur=x;S.answered=false;S.time=20;hud();$('time').textContent='20s';$('bar').style.width='100%';$('theme').textContent=`${x.t} • Valendo ${prize()} milhos 🌽`;$('prompt').textContent=x.p;$('feed').textContent='';$('opts').innerHTML='';sh(x.o).forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.dataset.v=o;b.onclick=()=>answer(o,b);$('opts').appendChild(b)});$('skipBtn').textContent=`Pular x${S.skip}`;$('tipBtn').disabled=S.tip;$('fiftyBtn').disabled=S.fifty;timer=setInterval(()=>{S.time--;$('time').textContent=S.time+'s';$('bar').style.width=S.time*5+'%';if(S.time<=0){clearInterval(timer);wrong('⏰ Tempo esgotado!')}},1000)}function answer(v,b){if(S.answered)return;S.answered=true;clearInterval(timer);let ok=v===S.cur.a,right=[...document.querySelectorAll('.opt')].find(x=>x.dataset.v===S.cur.a);if(right)right.classList.add('ok');if(ok){let val=prize();S.correct++;S.score+=val;S.lastCorrect=true;if(right)right.classList.add('win');hud();$('feed').textContent=`✅ Correto! Você ganhou ${val} milhos!`;$('badge').textContent=`✨ ACERTOU! +${val} MILHOS 🌽`;$('fx').classList.add('show');winSound();setTimeout(()=>{$('fx').classList.remove('show');after()},1100)}else{b.classList.add('bad');S.lives--;S.lastCorrect=false;loseSound();$('feed').textContent='❌ '+S.cur.tip;setTimeout(after,900)}}function wrong(msg){if(S.answered)return;S.answered=true;S.lives--;S.lastCorrect=false;loseSound();$('feed').textContent=msg;setTimeout(after,850)}function after(){if(S.lives<=0)return gameOver();S.round++;if(S.round>=ROUNDS)return missionDone();prepare(false)}function gameOver(){clearInterval(timer);clearTimeout(introTimer);$('oi').textContent='💥🌽';$('ot').textContent='GAME OVER — TRY AGAIN!';$('om').textContent=`Suas vidas acabaram. Você acumulou ${S.score} milhos. Agora veja o ranking e tente novamente!`;$('ob').textContent='VER RANKING DA TURMA 🏆';$('ov').classList.add('show');let moved=false,go=()=>{if(moved)return;moved=true;showGameOverRanking()};$('ob').onclick=go;setTimeout(go,2600)}function showGameOverRanking(){$('ov').classList.remove('show');$('endTitle').textContent='💥 GAME OVER';$('final').innerHTML=`${S.name}, você ficou sem vidas na <b>Missão ${S.mission+1}</b>.<br>Você acumulou <b>${S.score} milhos 🌽</b> e marcou <b>${pct()} pontos</b>.<br><br>Veja quem está no topo e tente superar sua marca!`;$('endActions').innerHTML=`<button class="btn" id="retryBtn">🔁 TENTAR MISSÃO ${S.mission+1} NOVAMENTE</button>`;show('s2');window.saveScore?.(S.name,pct(),GAME,S.school,S.klass,S.score);window.loadRank?.(GAME,'ranking',S.name,S.school);$('retryBtn').onclick=()=>{S.score=S.checkpoint.score;S.correct=S.checkpoint.correct;S.round=0;S.lives=MAX;S.deck=fresh(S.mission+1);S.lastCorrect=false;show('s1');prepare(false)}}function missionDone(){clearInterval(timer);let last=S.mission===MISSIONS-1;$('oi').textContent='🌽🏆✨';$('ot').textContent=last?'DESAFIO FINAL CONCLUÍDO!':'MISSÃO CONCLUÍDA!';$('om').textContent=last?`Você venceu todas as missões e acumulou ${S.score} milhos!`:`Você concluiu a Missão ${S.mission+1} e já acumulou ${S.score} milhos!`;$('ob').textContent=last?'VER RANKING 🏆':`COMEÇAR MISSÃO ${S.mission+2} 🚀`;$('ov').classList.add('show');$('ob').onclick=()=>{$('ov').classList.remove('show');if(last)return finish();S.mission++;S.round=0;S.lives=MAX;S.tip=false;S.fifty=false;S.deck=fresh(S.mission+1);S.lastCorrect=false;S.checkpoint={score:S.score,correct:S.correct};prepare(false)}}function finish(){$('endTitle').textContent='🏆 Resultado';$('final').textContent=`${S.name}, você acumulou ${S.score} milhos 🌽. Sua pontuação para o ranking é ${pct()}.`;$('endActions').innerHTML='<button class="btn" id="replayBtn">🎮 JOGAR NOVAMENTE</button>';show('s2');window.saveScore?.(S.name,pct(),GAME,S.school,S.klass,S.score);window.loadRank?.(GAME,'ranking',S.name,S.school);$('replayBtn').onclick=()=>location.reload()}function useFifty(){if(S.fifty||S.answered)return;S.fifty=true;sh([...document.querySelectorAll('.opt')].filter(b=>b.dataset.v!==S.cur.a)).slice(0,2).forEach(b=>b.style.display='none')}function useSkip(){if(S.skip<=0||S.answered)return;clearInterval(timer);S.skip--;S.lastCorrect=false;S.round++;if(S.round>=ROUNDS)return missionDone();prepare(false)}function useTip(){if(S.tip||!S.cur)return;S.tip=true;$('feed').textContent='💡 '+S.cur.tip}function stopGame(){clearInterval(timer);finish()}$('startBtn').onclick=begin;$('fiftyBtn').onclick=useFifty;$('skipBtn').onclick=useSkip;$('tipBtn').onclick=useTip;$('stopBtn').onclick=stopGame;</script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getFirestore,collection,addDoc,serverTimestamp,query,limit,onSnapshot}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';const db=getFirestore(initializeApp({apiKey:'AIzaSyCVTR3nnyo5mYTF28TJisgTUe-Xyjk1upg',authDomain:'english-game-hub.firebaseapp.com',projectId:'english-game-hub',storageBucket:'english-game-hub.firebasestorage.app',messagingSenderId:'131880771426',appId:'1:131880771426:web:cf29a6f34ca86be527d63b'}));window.saveScore=async(n,p,j,e,t,raw)=>{try{await addDoc(collection(db,'pontuacoes'),{nome:n.slice(0,24),pontos:+p||0,pontosJogo:+raw||0,jogo:j,escola:e,turma:t||'703',tipo:'real',timestamp:serverTimestamp()})}catch{}};window.loadRank=(j,id,cn,cs)=>{let box=document.getElementById(id),rq=query(collection(db,'pontuacoes'),limit(900));onSnapshot(rq,s=>{let m=new Map;s.forEach(d=>{let x=d.data();if(x.jogo!==j)return;let k=(x.nome||'').toLowerCase()+'|'+(x.escola||'').toLowerCase(),p=+x.pontos||0,a=m.get(k);if(!a||p>a.p)m.set(k,{n:x.nome,e:x.escola,p})});let a=[...m.values()].sort((x,y)=>y.p-x.p);box.innerHTML='';if(!a.length)return box.textContent='Ainda não há pontuações.';a.slice(0,10).forEach((x,i)=>{let r=document.createElement('div'),you=x.n?.toLowerCase()===cn?.toLowerCase()&&x.e?.toLowerCase()===cs?.toLowerCase();r.className='row '+(i<3?'top ':'')+(you?'you':'');r.innerHTML=`<b>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'º'}</b><span><b>${x.n}${you?' ⭐ Você':''}</b><br><small>${x.e||''}</small></span><b>${x.p} pts</b>`;box.appendChild(r)})},()=>box.textContent='Ranking indisponível no momento.')};</script></body></html>

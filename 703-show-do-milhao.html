<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial;color:#fff;background:linear-gradient(rgba(5,7,30,.55),rgba(35,8,65,.78)),url('703-show-do-milhao-bg-final.png') center/cover fixed}body{min-height:100dvh;display:flex;justify-content:center}.app{width:min(100%,760px);min-height:100dvh;padding:10px}.card{background:rgba(8,13,50,.93);border:1px solid rgba(255,230,109,.25);border-radius:22px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}.screen{display:none}.screen.active{display:block}h1{text-align:center;color:#ffe66d;font-size:clamp(34px,8vw,56px);margin:6px}.btn{width:100%;padding:13px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffe66d,#ffb703,#ff4d9e);font-weight:1000;cursor:pointer;color:#172033;text-decoration:none;display:block;text-align:center}input{width:100%;padding:12px;border-radius:13px;border:2px solid #facc15;margin:5px 0;font-weight:800}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:7px}.pill{padding:7px 3px;border-radius:11px;background:rgba(255,255,255,.08);text-align:center;font-size:12px;font-weight:900}.prompt{font-size:20px;line-height:1.3;font-weight:900;background:rgba(255,255,255,.06);padding:12px;border-radius:14px}.opts{display:grid;gap:7px}.opt{padding:11px;border:2px solid #93c5fd;border-radius:13px;background:#fff;color:#172033;font-weight:900;text-align:left;cursor:pointer}.opt.ok{background:#dcfce7;border-color:#22c55e}.opt.bad{background:#fee2e2;border-color:#ef4444}.timer{height:12px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;margin:8px 0}.bar{height:100%;background:linear-gradient(90deg,#22c55e,#ffe66d,#ef4444);width:100%}.helps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.help{padding:9px 4px;border:0;border-radius:12px;font-weight:1000;cursor:pointer}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:50;padding:18px}.overlay.show{display:flex}.modal{width:min(100%,440px);background:linear-gradient(160deg,#111c58,#561464);padding:24px;border-radius:28px;text-align:center}.big{font-size:64px}.modal h2{font-size:32px;color:#ffe66d}.rank{display:grid;gap:6px}.row{display:grid;grid-template-columns:40px 1fr auto;gap:6px;background:#fff;color:#172033;border-radius:12px;padding:8px}.row.top{background:linear-gradient(135deg,#ffe66d,#fff7c2)}.row.you{outline:3px solid #00eaff}.visual{text-align:center;font-size:42px}.feed{min-height:44px;padding:8px;color:#fff7c2;font-weight:850}</style></head><body><main class="app">
<section id="start" class="screen active"><div class="card"><h1>SHOW DO MILHÃO 🌽</h1><p style="text-align:center;font-weight:900">Turma 703 • banco ampliado • perguntas diferentes a cada partida</p><input id="name" placeholder="Nome do aluno"><input id="klass" value="703"><input id="school" value="Escola Municipal Princesa Izabel"><button class="btn" onclick="start()">COMEÇAR O DESAFIO</button><p style="text-align:center">Jogos elaborados pelo professor Jasson Bruno</p></div></section>
<section id="play" class="screen"><div class="hud"><div class="pill" id="mission">Missão 1</div><div class="pill" id="round">1/10</div><div class="pill" id="score">0 pts</div><div class="pill" id="lives">❤️❤️❤️❤️❤️</div><div class="pill" id="time">20s</div></div><div class="card"><div id="visual" class="visual">🌽</div><div id="theme" style="text-align:center;color:#ffe66d;font-weight:900"></div><div id="prompt" class="prompt"></div><div class="timer"><div id="bar" class="bar"></div></div><div id="opts" class="opts"></div><div id="feed" class="feed"></div><div class="helps"><button id="fifty" class="help" onclick="fifty()">50/50</button><button id="skip" class="help" onclick="skip()">Pular x3</button><button id="tip" class="help" onclick="tip()">Dica x1</button><button class="help" onclick="stop()">Parar</button></div></div></section>
<section id="end" class="screen"><div class="card"><h1>🏆 Resultado</h1><p id="final" style="text-align:center;font-weight:900"></p><h2 style="text-align:center">Ranking REAL — Show do Milhão</h2><div id="ranking" class="rank"></div><a class="btn" href="703-ranking.html">🏆 RANKING GERAL DA TURMA 703</a><br><a class="btn" href="index_turma_703_english_game_hub.html">VOLTAR AO HUB</a></div></section></main>
<div id="ov" class="overlay"><div class="modal"><div id="oi" class="big">🌽🏆</div><h2 id="ot">MISSÃO CONCLUÍDA!</h2><p id="om"></p><button id="ob" class="btn"></button></div></div>
<script>
const GAME="703-english-million-challenge",MAX=5,TOTAL=50;
const family=[["mother","mãe"],["father","pai"],["sister","irmã"],["brother","irmão"],["grandmother","avó"],["grandfather","avô"],["aunt","tia"],["uncle","tio"],["cousin","primo/prima"],["parents","pais"]];
const actions=[["studying","estudando"],["reading","lendo"],["cooking","cozinhando"],["playing","jogando"],["running","correndo"],["talking","conversando"],["working","trabalhando"],["writing","escrevendo"]];
const comps=[["tall","taller"],["old","older"],["young","younger"],["fast","faster"],["big","bigger"],["small","smaller"],["easy","easier"],["happy","happier"],["interesting","more interesting"],["difficult","more difficult"],["good","better"],["bad","worse"]];
function baseVerb(x){return ({running:"run",writing:"write"}[x]||x.replace(/ing$/,"") )}
function q(id,l,t,v,p,a,o,tip){return{id,level:l,theme:t,visual:v,prompt:p,answer:a,options:[...new Set([a,...o])].slice(0,4),tip}}
function bank(){let B=[],id=0;const add=(l,t,v,p,a,o,tip)=>B.push(q(`M${l}-${++id}`,l,t,v,p,a,o,tip));
family.forEach(([e,p],i)=>{add(1,"Family Members","👨‍👩‍👧",`Ana aponta para uma pessoa e diz: This is my ${e}. ${e} significa...`,p,[p,"professor","vizinho","amigo"],`${e} = ${p}.`);const rel=[["My mother's brother is my...","uncle",["uncle","cousin","brother","grandfather"],"Irmão da mãe = tio."],["My father's mother is my...","grandmother",["grandmother","aunt","sister","cousin"],"Mãe do pai = avó."],["My aunt's son is my...","cousin",["cousin","uncle","father","brother"],"Filho da tia = primo."],["My mother's father is my...","grandfather",["grandfather","uncle","brother","cousin"],"Pai da mãe = avô."],["My father's sister is my...","aunt",["aunt","mother","cousin","grandmother"],"Irmã do pai = tia."]][i%5];if(i<5)add(2,"Family Members","🧩",rel[0],rel[1],rel[2],rel[3]);add(3,"Family Life","🏠",`Leia: I live with my ${e}. A frase informa...`,"com quem a pessoa mora",["com quem a pessoa mora","uma comparação","uma ação no passado","uma quantidade"],"Live with = morar com.")});
actions.forEach(([e,p])=>{add(1,"Present Continuous","⏱️",`Uma pessoa está ${p} agora. Qual forma em inglês corresponde à ação?`,e,[e,baseVerb(e),"better","many"],"Use verbo-ing.");add(2,"Present Continuous","⏱️",`Complete: She is ___ now. Dica: ${p}`,e,[e,"are","am",baseVerb(e)],"She + is + verbo-ing.");add(4,"Present Information","❓",`A resposta é: They are ${e}. Qual pergunta combina?`,"What are they doing?",["What are they doing?","Where are they?","Who are they?","How old are they?"],"A resposta mostra ação.")});
[["all","todos"],["most","a maioria"],["many","muitos"],["a lot of","muitos"],["some","alguns"],["a few","poucos"],["not many","poucos"]].forEach(([e,p])=>{add(1,"Quantifiers","🔢",`${e} indica a ideia de...`,p,[p,"comparação","lugar","idade"],`${e} é quantifier.`);add(3,"Quantifiers","📊",`Qual opção completa melhor uma ideia de “${p} alunos”?`,e,[e,"better","where","family"],`Use ${e}.`)});
comps.forEach(([a,c])=>{add(2,"Comparatives","📏",`Qual é o comparativo correto de ${a}?`,c,[c,`more ${a}`,`${a}est`,`very ${a}`],`${a} → ${c}.`);add(4,"Comparatives","🧠",`Um aluno escreveu “more ${a} than”. Qual forma correta?`,c+" than",[c+" than",`more ${c} than`,`${a}est than`,`${a} than`],`Forma: ${c} than.`)});
const fixed=[[1,"Family Life","🏠","I live with my parents. O que a frase informa?","Eu moro com meus pais.",["Eu moro com meus pais.","Eu estudo com meus pais.","Eu moro sozinho.","Eu tenho muitos livros."],"Live with = morar com."],[1,"Present Information","❓","A resposta é: I'm studying now. Qual pergunta combina?","What are you doing?",["What are you doing?","Where are you?","Who are you?","How old are you?"],"Ação agora."],[2,"Quantifiers","📊","28 de 30 alunos vieram. Melhor quantifier:","most",["most","a few","not many","much"],"Most = a maioria."],[2,"Comparatives","📏","Pedro mede 1,70 m e Lucas 1,55 m.","Pedro is taller than Lucas.",["Pedro is taller than Lucas.","Lucas is taller than Pedro.","Pedro is more tall than Lucas.","Pedro is younger than Lucas."],"Tall → taller."],[3,"Present Continuous","🔎","Observe: She are studying now. Qual correção?","She is studying now.",["She is studying now.","She are studying now.","She studying is.","She am studying now."],"She + is."],[3,"Quantifiers","🔎","Observe: There are much books. Qual correção?","There are many books.",["There are many books.","There are much books.","There is many books.","There are better books."],"Books é contável."],[3,"Comparatives","🔎","Observe: This exercise is more easy. Qual correção?","This exercise is easier.",["This exercise is easier.","This exercise is more easy.","This exercise is easyer.","This exercise is easiest than."],"Easy → easier."],[4,"Family Life","🧠","My family is small, but my cousin's family is bigger. A frase...","compara duas famílias",["compara duas famílias","pergunta lugar","fala só de quantidade","está no passado"],"Bigger indica comparação."],[4,"Present Continuous","🧠","Most students are studying now. Há...","quantidade + ação em andamento",["quantidade + ação em andamento","família + passado","comparação + idade","somente vocabulário"],"Most + are studying."],[5,"Family Members","🏆","My aunt's daughter is my...","cousin",["cousin","sister","mother","grandmother"],"Filha da tia = prima."],[5,"Present Information","🏆","Resposta: My cousins are at the park. Pergunta ideal:","Where are your cousins?",["Where are your cousins?","What are your cousins doing?","Who are your cousins?","How old are your cousins?"],"Park indica lugar."],[5,"Quantifiers","🏆","Só 3 de 30 alunos estão lendo. Melhor frase:","A few students are reading.",["A few students are reading.","Most students are reading.","Much students are reading.","All students is reading."],"A few = poucos."],[5,"Comparatives","🏆","Bad tem qual comparativo?","worse",["worse","badder","more bad","worst"],"Bad → worse."],[5,"Family Life","🏆","Most people in my family live nearby. Most indica...","a maioria",["a maioria","todos","poucos","ninguém"],"Most = a maioria."]];fixed.forEach(x=>add(...x));
[["My family is big.","a família é grande"],["My family is small.","a família é pequena"],["We have dinner together.","a família janta junta"],["We spend time together.","a família passa tempo junta"],["My family is very close.","a família é muito unida"]].forEach(([p,a])=>add(1,"Family Life","🏠",`Leia: ${p} A ideia é...`,a,[a,"uma pergunta de lugar","uma comparação de idade","uma ação passada"],"Observe o sentido da frase."));
actions.forEach(([e,p],i)=>add(3,"Present Continuous","🔎",`Qual frase está correta para “${p} agora”?`,i%2?`They are ${e} now.`:`She is ${e} now.`,[i%2?`They are ${e} now.`:`She is ${e} now.`,i%2?`They is ${e} now.`:`She are ${e} now.`,`They ${e} now.`,`She ${baseVerb(e)} now.`],"Use am/is/are + verbo-ing."));
family.slice(0,5).forEach(([e])=>add(3,"Present Information","❓",`Resposta: My ${e} is at home. Qual pergunta busca essa informação?`,`Where is your ${e}?`,[`Where is your ${e}?`,`What is your ${e} doing?`,`Who is your ${e}?`,`How old is your ${e}?`],"At home indica lugar."));
[["30 de 30 alunos vieram.","all students"],["27 de 30 alunos vieram.","most students"],["20 alunos têm livros.","many students"],["10 alunos trouxeram cartazes.","some students"],["3 alunos faltaram.","a few students"],["Poucos alunos faltaram.","not many students"],["Há muitos livros na sala.","a lot of books"]].forEach(([p,a])=>add(4,"Quantifiers","🧠",`${p} Qual expressão combina melhor?`,a,[a,"where students","better students","family students"],"Escolha pelo sentido de quantidade."));
family.forEach(([e],i)=>add(5,"Family Life","🏆",`Desafio: My ${e} is ${i%2?"older":"younger"} than my cousin. A frase combina...`,`família + comparação`,["família + comparação","somente quantidade","pergunta de lugar","ação no passado"],"Há familiar + comparative + than."));
actions.forEach(([e,p],i)=>add(5,"Present Continuous","🏆",`Situação: agora ${i%2?"eles":"ela"} está ${p}. Qual frase é correta?`,i%2?`They are ${e} now.`:`She is ${e} now.`,[i%2?`They are ${e} now.`:`She is ${e} now.`,i%2?`They is ${e} now.`:`She are ${e} now.`,`They ${baseVerb(e)} now.`,`She does ${e} now.`],"Use am/is/are + verbo-ing."));
comps.forEach(([a,c])=>add(5,"Comparatives","🏆",`Million Challenge: complete corretamente — This is ___ than that. (${a})`,c,[c,`more ${a}`,`${a}est`,`very ${a}`],`Comparativo de ${a}: ${c}.`));
for(let l=1;l<=5;l++){let n=0;while(B.filter(x=>x.level===l).length<30){const [e,p]=family[n%family.length];add(l,"Family Members","🎯",`Desafio extra: escolha o significado de ${e}.`,p,[p,"escola","professor","cidade"],`${e} = ${p}.`);n++}}return B}
const BANK=bank(),HKEY="703-show-seen-v4";let S={},timer=null;const $=i=>document.getElementById(i);function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seen(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){return[]}}function fresh(pool,n){let s=new Set(seen()),c=[...sh(pool.filter(x=>!s.has(x.id))),...sh(pool.filter(x=>s.has(x.id)))].slice(0,n);try{localStorage.setItem(HKEY,JSON.stringify([...seen(),...c.map(x=>x.id)].filter((v,i,a)=>a.indexOf(v)===i).slice(-600)))}catch(e){}return c}
function deck(){let d=[];for(let l=1;l<=5;l++)d.push(...fresh(BANK.filter(x=>x.level===l),10));return d}function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function start(){let n=$("name").value.trim();if(!n)return alert("Digite o nome.");S={name:n,klass:$("klass").value||"703",school:$("school").value||"Escola Municipal Princesa Izabel",deck:deck(),idx:0,mission:0,round:0,score:0,correct:0,lives:MAX,skip:3,tip:false,fifty:false,answered:false};show("play");load()}
function load(){clearInterval(timer);let x=S.deck[S.idx];S.cur=x;S.answered=false;S.time=20;$("mission").textContent=`Missão ${S.mission+1}/5`;$("round").textContent=`${S.round+1}/10`;$("score").textContent=`${S.score} pts`;$("lives").textContent="❤️".repeat(S.lives)+"🖤".repeat(MAX-S.lives);$("time").textContent="20s";$("visual").textContent=x.visual;$("theme").textContent=x.theme;$("prompt").textContent=x.prompt;$("feed").textContent="";$("opts").innerHTML="";sh(x.options).forEach(o=>{let b=document.createElement("button");b.className="opt";b.textContent=o;b.dataset.answer=o;b.onclick=()=>answer(o,b);$("opts").appendChild(b)});$("skip").textContent=`Pular x${S.skip}`;$("tip").disabled=S.tip;$("fifty").disabled=S.fifty;tick()}
function tick(){timer=setInterval(()=>{S.time--;$("time").textContent=S.time+"s";$("bar").style.width=(S.time/20*100)+"%";if(S.time<=0){clearInterval(timer);wrong("⏰ Tempo esgotado!")}},1000)}
function answer(v,b){if(S.answered)return;clearInterval(timer);S.answered=true;let ok=v===S.cur.answer;document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.answer===S.cur.answer)x.classList.add("ok")});if(ok){S.correct++;S.score+=100*(S.mission+1);$("feed").textContent="✅ Correto! "+S.cur.tip}else{b.classList.add("bad");S.lives--;$("feed").textContent="❌ "+S.cur.tip}setTimeout(after,900)}
function wrong(msg){if(S.answered)return;S.answered=true;S.lives--;$("feed").textContent=msg+" "+S.cur.tip;setTimeout(after,800)}
function after(){if(S.lives<=0)return trans(false);S.idx++;S.round++;if(S.round>=10)return trans(true);load()}
function fifty(){if(S.fifty||S.answered)return;S.fifty=true;let w=[...document.querySelectorAll(".opt")].filter(b=>b.dataset.answer!==S.cur.answer);sh(w).slice(0,2).forEach(b=>b.style.display="none");$("fifty").disabled=true}
function skip(){if(S.skip<=0||S.answered)return;clearInterval(timer);S.skip--;S.idx++;S.round++;if(S.round>=10)return trans(true);load()}
function tip(){if(S.tip)return;S.tip=true;$("feed").textContent="💡 "+S.cur.tip;$("tip").disabled=true}
function stop(){clearInterval(timer);finish()}
function trans(win){clearInterval(timer);let last=S.mission===4;$("ov").classList.add("show");$("oi").textContent=win?"🌽🏆✨":"💪🌽";$("ot").textContent=win?(last?"DESAFIO FINAL CONCLUÍDO!":"MISSÃO CONCLUÍDA!"):"TRY AGAIN!";$("om").textContent=win?(last?"Você venceu todas as missões!":`Você concluiu a Missão ${S.mission+1}.`):`Você ficou sem vidas na Missão ${S.mission+1}. Tente novamente com perguntas diferentes.`;$("ob").textContent=win?(last?"VER RANKING 🏆":`COMEÇAR MISSÃO ${S.mission+2} 🚀`):`TENTAR MISSÃO ${S.mission+1} NOVAMENTE 🔁`;$("ob").onclick=()=>{$("ov").classList.remove("show");if(win){if(last)return finish();S.mission++;S.round=0;S.lives=MAX;load()}else{let start=S.mission*10;S.idx=start;S.round=0;S.lives=MAX;S.deck.splice(start,10,...fresh(BANK.filter(x=>x.level===S.mission+1),10));load()}}}
function finish(){clearInterval(timer);let p=Math.round(S.correct/TOTAL*100);$("final").textContent=`${S.name}, sua pontuação para o ranking é ${p}. Pontuação do jogo: ${S.score}.`;show("end");if(window.saveScore)window.saveScore(S.name,p,GAME,S.school,S.klass,S.score);if(window.loadRank)window.loadRank(GAME,"ranking",S.name,S.school)}
</script>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp,query,limit,onSnapshot}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";const db=getFirestore(initializeApp({apiKey:"AIzaSyCVTR3nnyo5mYTF28TJisgTUe-Xyjk1upg",authDomain:"english-game-hub.firebaseapp.com",projectId:"english-game-hub",storageBucket:"english-game-hub.firebasestorage.app",messagingSenderId:"131880771426",appId:"1:131880771426:web:cf29a6f34ca86be527d63b"}));window.saveScore=async(n,p,j,e,t,raw)=>{try{await addDoc(collection(db,"pontuacoes"),{nome:n.slice(0,24),pontos:Number(p)||0,pontosJogo:Number(raw)||0,jogo:j,escola:e,turma:t||"703",tipo:"real",timestamp:serverTimestamp()})}catch(x){}};window.loadRank=(j,id,cn,cs)=>{let box=document.getElementById(id),q=query(collection(db,"pontuacoes"),limit(900));onSnapshot(q,s=>{let m=new Map;s.forEach(d=>{let x=d.data();if(x.jogo!==j)return;let k=(x.nome||"").toLowerCase()+"|"+(x.escola||"").toLowerCase(),p=Number(x.pontos)||0,a=m.get(k);if(!a||p>a.pontos)m.set(k,{nome:x.nome,escola:x.escola,pontos:p})});let a=[...m.values()].sort((x,y)=>y.pontos-x.pontos);box.innerHTML="";a.slice(0,10).forEach((x,i)=>{let r=document.createElement("div"),you=x.nome?.toLowerCase()===cn?.toLowerCase()&&x.escola?.toLowerCase()===cs?.toLowerCase();r.className="row "+(i<3?"top ":"")+(you?"you":"");r.innerHTML=`<b>${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1+"º"}</b><span><b>${x.nome}${you?" ⭐ Você":""}</b><br><small>${x.escola||""}</small></span><b>${x.pontos} pts</b>`;box.appendChild(r)})})};</script></body></html>

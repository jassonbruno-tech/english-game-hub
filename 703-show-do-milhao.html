<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06081f">
<title>Show do Milhão — Turma 703</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06081f}#game{display:block;width:100%;height:100dvh;border:0;background:#06081f}
</style>
</head>
<body>
<iframe id="game" src="703-show-do-milhao-core.html?v=45" title="Show do Milhão — Turma 703" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('game');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const d=w.document;
    w.showRoundIntro=function(done){
      try{ const intro=d.getElementById('roundIntro'); if(intro) intro.classList.remove('active'); }catch(e){}
      if(typeof done==='function') done();
    };
    w.playIntroSound=function(){};
    const introAudio=d.getElementById('audioIntro');
    if(introAudio){ try{introAudio.pause();introAudio.currentTime=0;introAudio.muted=true}catch(e){} }
    const badge=d.createElement('div');
    badge.textContent='M45';
    badge.style.cssText='position:fixed;right:5px;bottom:5px;z-index:99999;font:700 9px Arial;color:rgba(255,255,255,.45);pointer-events:none';
    d.body.appendChild(badge);
  }catch(e){console.error('703 milhão patch',e)}
});
</script>
</body>
</html>

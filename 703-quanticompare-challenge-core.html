<title>Combinação de Vocabulário — Turma 703</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--cyan:#00eaff;--purple:#7c3aed;--gold:#ffe66d;--green:#22c55e;--red:#ef4444}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,#164897,#07142f 48%,#17042e);overflow-x:hidden}
body{min-height:100dvh;display:flex;justify-content:center;transition:filter .12s}
.app{width:min(100%,560px);min-height:100dvh;padding:8px;display:flex;flex-direction:column;gap:7px}
.hud{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:5px;position:sticky;top:0;z-index:5}
.pill{background:linear-gradient(180deg,rgba(23,48,117,.98),rgba(14,21,65,.98));border:1px solid rgba(255,230,109,.35);padding:7px 3px;border-radius:12px;text-align:center;font-size:12px;font-weight:1000;box-shadow:0 5px 15px rgba(0,0,0,.18)}
.card{background:linear-gradient(180deg,rgba(8,18,52,.94),rgba(18,8,54,.94));border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:8px;box-shadow:0 14px 38px rgba(0,0,0,.32);flex:1}
h2{text-align:center;margin:0 0 4px;color:#fff7c2;font-size:clamp(17px,4.8vw,23px)}.status{text-align:center;color:var(--gold);font-weight:900;min-height:19px;font-size:12px;margin-bottom:5px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:6px}.col{display:grid;gap:5px;align-content:start}
.word{min-height:42px;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 5px;background:linear-gradient(180deg,rgba(26,65,135,.72),rgba(12,29,81,.8));color:#fff;font-weight:900;font-size:clamp(10px,2.8vw,13px);line-height:1.12;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.16);transition:transform .12s,filter .12s,box-shadow .12s}
.word.pt{background:linear-gradient(180deg,rgba(115,48,190,.65),rgba(57,22,117,.82))}
.word:active{transform:scale(.97)}.word.sel{outline:3px solid var(--gold);filter:brightness(1.2);box-shadow:0 0 18px rgba(255,230,109,.55)}
.word.ok{background:linear-gradient(135deg,#16a34a,#4ade80)!important;color:#052e16;animation:correctCard .52s ease;box-shadow:0 0 28px rgba(74,222,128,.95)}
.word.bad{background:linear-gradient(135deg,#991b1b,#ef4444)!important;animation:shake .4s ease}
@keyframes correctCard{0%{transform:scale(1)}35%{transform:scale(1.09) rotate(-1deg)}70%{transform:scale(1.04) rotate(1deg)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:80;background:radial-gradient(circle,#fff 0,#7dffce 20%,rgba(0,234,255,.78) 48%,rgba(124,58,237,.56) 72%,transparent 100%)}
#flash.go{animation:flash .68s ease-out}
@keyframes flash{0%{opacity:0}16%{opacity:.94}36%{opacity:.18}53%{opacity:.72}100%{opacity:0}}
.spark{position:fixed;z-index:81;pointer-events:none;font-size:22px;animation:sparkFly .8s ease-out forwards}
@keyframes sparkFly{from{transform:translate(0,0) scale(.5) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.35) rotate(260deg);opacity:0}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);z-index:90}.overlay.show{display:flex}
.modal{width:min(100%,420px);text-align:center;border-radius:28px;padding:24px;background:linear-gradient(160deg,#101d5a,#421060);border:1px solid rgba(255,255,255,.2);box-shadow:0 0 60px rgba(0,234,255,.28)}.big{font-size:65px}.modal h2{font-size:30px;color:var(--gold)}.modal p{line-height:1.4;font-weight:850}
.btn{width:100%;padding:13px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--gold),#22c55e);font-weight:1000;font-size:15px;cursor:pointer;color:#10203a;text-decoration:none;text-align:center;display:block}
.end{display:none}.end.active{display:block}.game{display:none}.game.active{display:block}
.rank{display:grid;gap:6px;margin:10px 0}.row{display:grid;grid-template-columns:38px 1fr auto;gap:6px;background:#fff;color:#172033;border-radius:12px;padding:8px;align-items:center}.row.you{outline:3px solid #00eaff}.row.top{background:linear-gradient(135deg,#ffe66d,#fff7c2)}
.final-card{background:rgba(8,18,52,.94);border-radius:22px;padding:16px;margin-top:8px}.final-card h1{text-align:center;margin:0;color:var(--gold)}.sub{text-align:center;font-weight:800;color:#dbeafe}
.wait{display:flex;align-items:center;justify-content:center;min-height:100dvh;text-align:center;font-weight:900;color:#dbeafe;padding:20px}
@media(max-height:720px){.app{padding:5px}.word{min-height:35px;font-size:10px;padding:4px}.card{padding:6px}.pill{padding:5px 2px;font-size:10px}}

 <div class="hud"><div class="pill" id="phaseHud">Fase 1/10</div><div class="pill" id="livesHud">❤️❤️❤️❤️❤️</div><div class="pill" id="progressHud">0/10</div></div>
 <div class="card"><h2 id="phaseTitle">Fase 1</h2><div class="status" id="status">Escolha um item em inglês e encontre o par.</div><div class="board"><div class="col" id="enCol"></div><div class="col" id="ptCol"></div></div></div>
</section>

<script>
const GAME_NAME="703-quanticompare-challenge",MAX_LIVES=5,PAIRS_TO_WIN=10;
const BANKS=[{"level":1,"title":"Fase 1 — Family","pairs":[{"id":"L1-01","en":"mother","pt":"mãe"},{"id":"L1-02","en":"father","pt":"pai"},{"id":"L1-03","en":"sister","pt":"irmã"},{"id":"L1-04","en":"brother","pt":"irmão"},{"id":"L1-05","en":"aunt","pt":"tia"},{"id":"L1-06","en":"uncle","pt":"tio"},{"id":"L1-07","en":"cousin","pt":"primo/prima"},{"id":"L1-08","en":"grandmother","pt":"avó"},{"id":"L1-09","en":"grandfather","pt":"avô"},{"id":"L1-10","en":"parents","pt":"pais"}]},{"level":2,"title":"Fase 2 — Family in context","pairs":[{"id":"L2-01","en":"my mother","pt":"minha mãe"},{"id":"L2-02","en":"my father","pt":"meu pai"},{"id":"L2-03","en":"my aunt","pt":"minha tia"},{"id":"L2-04","en":"my uncle","pt":"meu tio"},{"id":"L2-05","en":"my cousin","pt":"meu primo/minha prima"},{"id":"L2-06","en":"I live with my parents.","pt":"Eu moro com meus pais."},{"id":"L2-07","en":"My family is big.","pt":"Minha família é grande."},{"id":"L2-08","en":"My family is small.","pt":"Minha família é pequena."},{"id":"L2-09","en":"We have dinner together.","pt":"Nós jantamos juntos."},{"id":"L2-10","en":"My family is very close.","pt":"Minha família é muito unida."}]},{"level":3,"title":"Fase 3 — Present Continuous","pairs":[{"id":"L3-01","en":"studying","pt":"estudando"},{"id":"L3-02","en":"reading","pt":"lendo"},{"id":"L3-03","en":"cooking","pt":"cozinhando"},{"id":"L3-04","en":"playing","pt":"jogando"},{"id":"L3-05","en":"working","pt":"trabalhando"},{"id":"L3-06","en":"sleeping","pt":"dormindo"},{"id":"L3-07","en":"talking","pt":"falando"},{"id":"L3-08","en":"watching TV","pt":"assistindo TV"},{"id":"L3-09","en":"I am studying.","pt":"Eu estou estudando."},{"id":"L3-10","en":"She is reading.","pt":"Ela está lendo."}]},{"level":4,"title":"Fase 4 — Questions","pairs":[{"id":"L4-01","en":"What are you doing?","pt":"O que você está fazendo?"},{"id":"L4-02","en":"What is he doing?","pt":"O que ele está fazendo?"},{"id":"L4-03","en":"What is she doing?","pt":"O que ela está fazendo?"},{"id":"L4-04","en":"Where are they?","pt":"Onde eles estão?"},{"id":"L4-05","en":"Who is she?","pt":"Quem é ela?"},{"id":"L4-06","en":"Where is your brother?","pt":"Onde está seu irmão?"},{"id":"L4-07","en":"Who is your cousin?","pt":"Quem é seu primo/prima?"},{"id":"L4-08","en":"Are they studying now?","pt":"Eles estão estudando agora?"},{"id":"L4-09","en":"What are your parents doing now?","pt":"O que seus pais estão fazendo agora?"},{"id":"L4-10","en":"Where is your grandmother now?","pt":"Onde está sua avó agora?"}]},{"level":5,"title":"Fase 5 — Quantifiers","pairs":[{"id":"L5-01","en":"many","pt":"muitos/muitas"},{"id":"L5-02","en":"some","pt":"alguns/algumas"},{"id":"L5-03","en":"a few","pt":"alguns poucos"},{"id":"L5-04","en":"all","pt":"todos/todas"},{"id":"L5-05","en":"most","pt":"a maioria"},{"id":"L5-06","en":"a lot of","pt":"muitos/muitas"},{"id":"L5-07","en":"many books","pt":"muitos livros"},{"id":"L5-08","en":"some friends","pt":"alguns amigos"},{"id":"L5-09","en":"a few students","pt":"poucos alunos"},{"id":"L5-10","en":"most students","pt":"a maioria dos alunos"}]},{"level":6,"title":"Fase 6 — Comparatives","pairs":[{"id":"L6-01","en":"taller","pt":"mais alto"},{"id":"L6-02","en":"older","pt":"mais velho"},{"id":"L6-03","en":"younger","pt":"mais jovem"},{"id":"L6-04","en":"better","pt":"melhor"},{"id":"L6-05","en":"worse","pt":"pior"},{"id":"L6-06","en":"bigger","pt":"maior"},{"id":"L6-07","en":"smaller","pt":"menor"},{"id":"L6-08","en":"easier","pt":"mais fácil"},{"id":"L6-09","en":"faster","pt":"mais rápido"},{"id":"L6-10","en":"happier","pt":"mais feliz"}]},{"level":7,"title":"Fase 7 — More Comparatives","pairs":[{"id":"L7-01","en":"more difficult","pt":"mais difícil"},{"id":"L7-02","en":"more interesting","pt":"mais interessante"},{"id":"L7-03","en":"more beautiful","pt":"mais bonito"},{"id":"L7-04","en":"more expensive","pt":"mais caro"},{"id":"L7-05","en":"farther","pt":"mais distante"},{"id":"L7-06","en":"This exercise is easier.","pt":"Este exercício é mais fácil."},{"id":"L7-07","en":"This book is more difficult.","pt":"Este livro é mais difícil."},{"id":"L7-08","en":"My English is better now.","pt":"Meu inglês está melhor agora."},{"id":"L7-09","en":"My brother is taller.","pt":"Meu irmão é mais alto."},{"id":"L7-10","en":"My sister is younger.","pt":"Minha irmã é mais jovem."}]},{"level":8,"title":"Fase 8 — Family Challenge","pairs":[{"id":"L8-01","en":"my mother's brother","pt":"meu tio"},{"id":"L8-02","en":"my father's mother","pt":"minha avó"},{"id":"L8-03","en":"my aunt's daughter","pt":"minha prima"},{"id":"L8-04","en":"my father's sister","pt":"minha tia"},{"id":"L8-05","en":"my mother's father","pt":"meu avô"},{"id":"L8-06","en":"my uncle's son","pt":"meu primo"},{"id":"L8-07","en":"My uncle's daughter is my cousin.","pt":"A filha do meu tio é minha prima."},{"id":"L8-08","en":"My grandparents are my parents' parents.","pt":"Meus avós são os pais dos meus pais."},{"id":"L8-09","en":"My family lives in Santarém.","pt":"Minha família mora em Santarém."},{"id":"L8-10","en":"We spend time together.","pt":"Nós passamos tempo juntos."}]},{"level":9,"title":"Fase 9 — Mixed Challenge","pairs":[{"id":"L9-01","en":"My mother is cooking.","pt":"Minha mãe está cozinhando."},{"id":"L9-02","en":"My father is working.","pt":"Meu pai está trabalhando."},{"id":"L9-03","en":"We are studying English.","pt":"Nós estamos estudando inglês."},{"id":"L9-04","en":"They are playing.","pt":"Eles estão jogando."},{"id":"L9-05","en":"He is not sleeping.","pt":"Ele não está dormindo."},{"id":"L9-06","en":"All students are in the classroom.","pt":"Todos os alunos estão na sala."},{"id":"L9-07","en":"A few students are reading now.","pt":"Poucos alunos estão lendo agora."},{"id":"L9-08","en":"Most students are studying now.","pt":"A maioria dos alunos está estudando agora."},{"id":"L9-09","en":"Some cousins live far away.","pt":"Alguns primos moram longe."},{"id":"L9-10","en":"A few cousins are visiting us.","pt":"Poucos primos estão nos visitando."}]},{"level":10,"title":"Fase 10 — Final Challenge","pairs":[{"id":"L10-01","en":"My family is bigger than your family.","pt":"Minha família é maior que sua família."},{"id":"L10-02","en":"My sister is younger than my brother.","pt":"Minha irmã é mais jovem que meu irmão."},{"id":"L10-03","en":"Today is better than yesterday.","pt":"Hoje está melhor que ontem."},{"id":"L10-04","en":"This street is busier than that street.","pt":"Esta rua é mais movimentada que aquela."},{"id":"L10-05","en":"Most people in my family live nearby.","pt":"A maioria das pessoas da minha família mora perto."},{"id":"L10-06","en":"My parents are working now.","pt":"Meus pais estão trabalhando agora."},{"id":"L10-07","en":"Who is talking to your mother?","pt":"Quem está falando com sua mãe?"},{"id":"L10-08","en":"My mother is cooking and my father is working.","pt":"Minha mãe está cozinhando e meu pai está trabalhando."},{"id":"L10-09","en":"Where are your cousins?","pt":"Onde estão seus primos?"},{"id":"L10-10","en":"What is your brother doing?","pt":"O que seu irmão está fazendo?"}]}];
let state={phase:0,lives:5,score:0,correct:0,selected:null,en:[],pt:[],player:null,phaseScore:0};
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function play(id,vol=0.65){try{const a=$(id);a.pause();a.currentTime=0;a.volume=vol;a.play().catch(()=>{})}catch(e){}}
function celebrate(btn){const f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,icons=["✨","⭐","💫","🎉","✅"];for(let i=0;i<12;i++){const s=document.createElement("span");s.className="spark";s.textContent=icons[i%icons.length];s.style.left=cx+"px";s.style.top=cy+"px";s.style.setProperty("--x",(Math.random()*220-110)+"px");s.style.setProperty("--y",(Math.random()*-220-35)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),850)}if(navigator.vibrate)navigator.vibrate([35,25,55])}
function startWithPlayer(name,school,klass){if(!String(name||"").trim()||!String(school||"").trim()||!String(klass||"").trim())return false;state={phase:0,lives:MAX_LIVES,score:0,correct:0,selected:null,en:[],pt:[],player:{name:String(name).trim(),school:String(school).trim(),klass:String(klass).trim()},phaseScore:0};$("wait").style.display="none";$("app").style.display="flex";startPhase();return true}
window.startWithPlayer=startWithPlayer;
function startGame(){return false} window.startGame=startGame;
function startPhase(){state.lives=MAX_LIVES;state.phaseScore=0;const pairs=shuffle(BANKS[state.phase].pairs).slice(0,PAIRS_TO_WIN);state.en=shuffle(pairs.map(x=>({...x,side:"en"})));state.pt=shuffle(pairs.map(x=>({...x,side:"pt"})));render();$("end").classList.remove("active");$("game").classList.add("active")}
function render(){$("phaseHud").textContent=`Fase ${state.phase+1}/${BANKS.length}`;$("livesHud").textContent="❤️".repeat(state.lives)+"🖤".repeat(MAX_LIVES-state.lives);$("progressHud").textContent=`${state.phaseScore}/${PAIRS_TO_WIN}`;$("phaseTitle").textContent=BANKS[state.phase].title;renderCol("enCol",state.en,"en");renderCol("ptCol",state.pt,"pt")}
function renderCol(id,arr,side){const c=$(id);c.innerHTML="";arr.forEach(x=>{const b=document.createElement("button");b.className="word "+(side==="pt"?"pt":"");b.textContent=side==="en"?x.en:x.pt;b.onclick=()=>pick(x,b);c.appendChild(b)})}
function pick(item,btn){if(!state.selected){state.selected={item,btn};btn.classList.add("sel");return}if(state.selected.item.side===item.side){state.selected.btn.classList.remove("sel");state.selected={item,btn};btn.classList.add("sel");return}const first=state.selected;state.selected=null;first.btn.classList.remove("sel");if(first.item.id===item.id){first.btn.classList.add("ok");btn.classList.add("ok");state.score+=10;state.correct++;state.phaseScore++;$("status").textContent=state.phaseScore%3===0?"🔥 COMBO! Excelente!":"✅ Par correto! Muito bem!";celebrate(btn);play(state.phaseScore%3===0?"sndCombo":"sndOk",.72);state.en=state.en.filter(x=>x.id!==item.id);state.pt=state.pt.filter(x=>x.id!==item.id);setTimeout(()=>{if(state.phaseScore>=PAIRS_TO_WIN)phaseWin();else render()},620)}else{state.lives--;first.btn.classList.add("bad");btn.classList.add("bad");$("status").textContent="❌ Não combina. Tente novamente.";play("sndBad",.45);setTimeout(()=>{if(state.lives<=0)phaseLose();else render()},430)}}
function phaseWin(){play("sndWin",.55);const last=state.phase===BANKS.length-1;showOverlay(true,last?"Você venceu as 10 fases!":`Fase ${state.phase+1} concluída! A próxima foi liberada.`,last?"VER RANKING 🏆":`COMEÇAR FASE ${state.phase+2} 🚀`,()=>{if(last)finish();else{state.phase++;startPhase()}})}
function phaseLose(){showOverlay(false,`Você ficou sem vidas na Fase ${state.phase+1}. Tente novamente!`,`TENTAR FASE ${state.phase+1} NOVAMENTE 🔁`,()=>startPhase())}
function showOverlay(win,text,label,fn){$("overlay").classList.add("show");$("icon").textContent=win?"🏆✨🎉":"💪❤️";$("ovTitle").textContent=win?"LEVEL COMPLETE!":"TRY AGAIN!";$("ovText").textContent=text;$("ovBtn").textContent=label;$("ovBtn").onclick=()=>{$("overlay").classList.remove("show");fn()}}
function finish(){const points=Math.round((state.correct/(PAIRS_TO_WIN*BANKS.length))*100);$("finalText").textContent=`${state.player.name}, você concluiu as 10 fases e fez ${points} pontos para o ranking.`;$("game").classList.remove("active");$("end").classList.add("active");if(window.salvarPontuacao)window.salvarPontuacao(state.player.name,points,GAME_NAME,state.player.school,state.player.klass);if(window.carregarRanking)window.carregarRanking(GAME_NAME,"ranking",state.player.name,state.player.school)}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp,query,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCVTR3nnyo5mYTF28TJisgTUe-Xyjk1upg",authDomain:"english-game-hub.firebaseapp.com",projectId:"english-game-hub",storageBucket:"english-game-hub.firebasestorage.app",messagingSenderId:"131880771426",appId:"1:131880771426:web:cf29a6f34ca86be527d63b"});
const db=getFirestore(app);
window.salvarPontuacao=async function(nome,pontos,jogo,escola,turma){try{await addDoc(collection(db,"pontuacoes"),{nome:String(nome).slice(0,24),pontos:Number(pontos)||0,jogo,escola,turma:turma||"703",tipo:"real",timestamp:serverTimestamp()})}catch(e){console.error(e)}};
window.carregarRanking=function(jogo,containerId,currentName,currentSchool){const box=document.getElementById(containerId);if(!box)return;const q=query(collection(db,"pontuacoes"),limit(700));onSnapshot(q,snap=>{const map=new Map();snap.forEach(d=>{const x=d.data();if(x.jogo!==jogo)return;const key=(x.nome||"").toLowerCase()+"|"+(x.escola||"").toLowerCase();const prev=map.get(key);if(!prev||Number(x.pontos)>prev.pontos)map.set(key,{nome:x.nome,escola:x.escola,pontos:Number(x.pontos)||0})});const arr=[...map.values()].sort((a,b)=>b.pontos-a.pontos);box.innerHTML="";arr.slice(0,10).forEach((x,i)=>{const row=document.createElement("div");const you=x.nome?.toLowerCase()===String(currentName||"").toLowerCase()&&x.escola?.toLowerCase()===String(currentSchool||"").toLowerCase();row.className="row "+(i<3?"top ":"")+(you?"you":"");row.innerHTML=`<b>${i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"º"}</b><span><strong>${x.nome}${you?" ⭐ Você":""}</strong><br><small>${x.escola||""}</small></span><strong>${x.pontos} pts</strong>`;box.appendChild(row)});if(!arr.length)box.textContent="Ainda não há pontuações.";})};
</script>

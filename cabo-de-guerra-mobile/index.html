<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Cabo de Guerra Mobile — Você vs CPU</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816}
iframe{border:0;width:100%;height:100%;display:block}
.rotate-warning{display:none;position:fixed;inset:0;z-index:999;background:#081423;color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font:900 20px Arial,sans-serif}
.rotate-box{max-width:520px;display:flex;flex-direction:column;gap:16px;align-items:center}
.rotate-box small{font-size:.72em;line-height:1.35;color:#cfe4ff}
.rotate-box button{border:0;border-radius:14px;padding:13px 20px;font-weight:1000;color:#fff;background:linear-gradient(135deg,#06b6d4,#7c3aed,#ec4899)}
</style>
</head>
<body>
<div class="rotate-warning" id="rotateWarning">
  <div class="rotate-box">
    📱 Gire o celular para o modo paisagem.
    <small>Se o aparelho já estiver deitado e esta tela continuar aparecendo:</small>
    <button id="forceBtn">JOGAR ASSIM MESMO</button>
  </div>
</div>
<iframe id="gameFrame" src="../jogos-em-equipe/tug-of-war.html?v=mobile-solo-original-1" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('gameFrame');

function syncOrientation(){
  const mobileLike=Math.min(innerWidth,innerHeight)<950;
  const landscape=innerWidth>innerHeight;
  const forced=sessionStorage.getItem('tug-force-landscape')==='1';
  document.getElementById('rotateWarning').style.display=(mobileLike&&!landscape&&!forced)?'flex':'none';
}
document.getElementById('forceBtn').onclick=()=>{sessionStorage.setItem('tug-force-landscape','1');syncOrientation()};
addEventListener('resize',syncOrientation);
addEventListener('orientationchange',()=>setTimeout(syncOrientation,180));
syncOrientation();

frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  const w=frame.contentWindow;
  if(!d)return;

  const style=d.createElement('style');
  style.textContent=`
  /* Base: preservar arena/personagens/corda do HTML original */
  html,body{height:100%!important;overflow:hidden!important;background:#050816!important}
  #cover{height:100dvh!important;padding-bottom:4dvh!important;background-position:center!important}
  .cover-play{font-size:clamp(18px,5vw,30px)!important;min-width:220px!important;padding:12px 28px!important}

  #game{
    height:100dvh!important;
    padding:4px 6px!important;
    gap:4px!important;
    grid-template-rows:36px 185px minmax(0,1fr) 0!important;
    background:radial-gradient(circle at 16% 0%,#5b21b655 0,transparent 32%),radial-gradient(circle at 85% 8%,#0891b255 0,transparent 30%),linear-gradient(145deg,#050816 0%,#0a1024 48%,#12103a 100%)!important;
  }
  .topbar{height:36px!important;min-height:0!important}
  .brand h1{font-size:clamp(15px,3.3vw,21px)!important}
  .brand small{display:none!important}
  .stage{font-size:clamp(8px,1.45vw,11px)!important;padding:4px 8px!important;background:#312e81!important;border-color:#c4b5fd66!important}
  .bracket{display:none!important}

  .arena{height:185px!important;border-radius:15px!important}
  .scoreboard{top:5px!important;padding:4px 8px!important;gap:6px!important;border-radius:10px!important}
  .score-team{min-width:100px!important;font-size:clamp(9px,1.55vw,12px)!important}
  .score-num{font-size:clamp(18px,3vw,24px)!important;min-width:23px!important}
  .arena-msg{bottom:3px!important;font-size:clamp(8px,1.45vw,11px)!important;padding:4px 8px!important;min-width:210px!important}

  /* Mantém a geometria original da mão/corda, só escala tudo junto no mobile */
  .arena-inner-mobile{transform-origin:center bottom}
  .team-people{bottom:10px!important;transform-origin:bottom center!important}
  .team-people.left{left:1.8%!important}
  .team-people.right{right:1.8%!important}
  .person{width:36px!important;height:96px!important;transform-origin:bottom center!important}
  .right .person{transform:scaleX(-1)!important}
  .person.short{transform:scale(.94)!important}
  .right .person.short{transform:scale(.94) scaleX(-1)!important}
  .person.tall{transform:scaleY(1.04)!important}
  .right .person.tall{transform:scaleY(1.04) scaleX(-1)!important}
  .rope-wrap{left:12%!important;right:12%!important;bottom:61px!important;height:18px!important}
  .rope{top:6px!important;height:8px!important}

  .play-area{
    min-height:0!important;height:100%!important;
    padding:5px 7px!important;gap:3px!important;
    grid-template-rows:35px auto minmax(0,1fr) auto!important;
    overflow:hidden!important;
    border-radius:12px!important;
    background:linear-gradient(145deg,#0b1227ee,#111a38ee)!important;
  }
  .question-top{height:35px!important}
  .qmeta{font-size:clamp(8px,1.35vw,10px)!important}
  .right-note{font-size:clamp(7px,1.2vw,9px)!important}
  .timer-label{font-size:7px!important}
  .timer{width:39px!important;height:39px!important;font-size:15px!important;border-width:3px!important}
  .question-text{font-size:clamp(12px,2vw,17px)!important;line-height:1.05!important;margin:0!important;min-height:22px!important}
  .teams{gap:6px!important;min-height:0!important;height:100%!important}
  .team-card{padding:4px 5px!important;border-radius:10px!important;grid-template-rows:24px minmax(0,1fr)!important;min-height:0!important;overflow:hidden!important}
  .team-header{margin-bottom:2px!important;height:24px!important}
  .team-name{font-size:clamp(9px,1.6vw,12px)!important}
  .status{font-size:clamp(7px,1.2vw,9px)!important;padding:2px 4px!important}
  .options{
    grid-template-columns:1fr 1fr!important;
    grid-template-rows:repeat(2,minmax(31px,1fr))!important;
    gap:4px!important;
    min-height:0!important;
    align-content:stretch!important;
  }
  .opt{
    min-height:31px!important;
    height:100%!important;
    padding:4px 6px!important;
    border-radius:8px!important;
    font-size:clamp(8px,1.4vw,11px)!important;
    line-height:1.05!important;
    white-space:normal!important;
    overflow:visible!important;
  }
  .result{font-size:clamp(8px,1.3vw,10px)!important;padding:3px 6px!important}
  .controls{height:0!important;overflow:hidden!important}
  #nextMatchBtn{display:none!important}
  .test-panel{display:none!important}

  .round-box,.countdown-box,.modal-card{min-width:min(500px,88vw)!important;padding:18px 24px!important;border-radius:18px!important}
  .round-number{font-size:clamp(34px,8vw,58px)!important}
  .ready-text{font-size:clamp(20px,4vw,34px)!important}
  .countdown-number{font-size:clamp(90px,22vw,170px)!important}
  `;
  d.head.appendChild(style);

  /* Rótulos solo */
  const brand=d.querySelector('.brand h1');
  if(brand)brand.textContent='🏆 Cabo de Guerra — Você vs CPU';
  const stage=d.getElementById('stageLabel');
  if(stage)stage.textContent='MODO SOLO';
  const rightNote=d.querySelector('.right-note');
  if(rightNote)rightNote.textContent='CPU responde automaticamente';

  /* Script novo: reutiliza TODA a mecânica visual original,
     inclusive pessoas, mãos, corda, puxada, expressões e animações. */
  const solo=d.createElement('script');
  solo.textContent=`
    // fixa uma única partida solo usando a estrutura original
    mi=0; fin=[]; L='blue'; R='red';

    const originalTeams=teams;
    teams=function(){
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('current'));
      L='blue'; R='red';
      document.getElementById('stageLabel').textContent='MODO SOLO';
      const a=T[L],b=T[R];
      document.getElementById('leftName').textContent='VOCÊ';
      document.getElementById('rightName').textContent='CPU';
      document.getElementById('leftTeamLabel').textContent='🔵 VOCÊ';
      document.getElementById('rightTeamLabel').textContent='🤖 CPU';
      document.getElementById('leftScoreName').style.color=a.color;
      document.getElementById('rightScoreName').style.color=b.color;
      document.getElementById('leftCard').style.setProperty('--team-color',a.color);
      document.getElementById('rightCard').style.setProperty('--team-color',b.color);
      [...document.getElementById('leftPeople').children].forEach(p=>p.style.setProperty('--shirt',a.color));
      [...document.getElementById('rightPeople').children].forEach(p=>p.style.setProperty('--shirt',b.color));
      resetMoods();
    };

    function cpuAutoAnswer(){
      if(rev || ra!==null)return;
      const q=qs[qi];
      const accuracy=.72;
      const choice=Math.random()<accuracy?q.a:sh(q.o.filter(x=>x!==q.a))[0];
      const buttons=[...document.getElementById('rightOptions').children];
      const btn=buttons.find(b=>b.dataset.value===choice);
      if(btn)pick('right',choice,btn);
    }

    const originalRender=render;
    render=function(){
      originalRender();
      document.getElementById('rightStatus').textContent='CPU pensando...';
      [...document.getElementById('rightOptions').children].forEach(b=>{b.onclick=null;b.style.pointerEvents='none'});
      const delay=1800+Math.random()*4200;
      auto=setTimeout(cpuAutoAnswer,delay);
    };

    // no tempo esgotado, a CPU ainda deve responder se ainda estiver pensando
    const originalTimeout=timeout;
    timeout=function(){
      if(ra===null)cpuAutoAnswer();
      originalTimeout();
    };

    // uma partida só; ao final mostra modal simples
    endMatch=function(){
      stop(); clearTimeout(auto);
      const playerWon=ls>rs;
      const tied=ls===rs;
      if(tied){
        sd=true;
        document.getElementById('resultBox').textContent='Empate! Morte súbita.';
        document.getElementById('resultBox').style.display='block';
        return setTimeout(next,1500);
      }
      const winner=playerWon?'blue':'red';
      document.getElementById('resultBox').textContent=(playerWon?'🏆 VOCÊ VENCEU!':'🤖 CPU VENCEU!')+' Placar: '+ls+' × '+rs;
      document.getElementById('resultBox').style.display='block';
      celebrate(winner);
      document.getElementById('arenaMsg').textContent='PARTIDA ENCERRADA';
      setTimeout(()=>{
        document.getElementById('championTitle').textContent=playerWon?'🏆 VOCÊ VENCEU!':'🤖 CPU VENCEU!';
        document.getElementById('championText').textContent='Placar final: '+ls+' × '+rs;
        document.getElementById('championModal').classList.add('show');
      },1800);
    };

    reset=function(){
      stop();clearTimeout(auto);
      mi=0;fin=[];L='blue';R='red';
      document.getElementById('championModal').classList.remove('show');
      startMatch();
    };

    document.getElementById('playAgain').onclick=()=>{
      document.getElementById('championModal').classList.remove('show');
      reset();
    };

    // remove painel de teste e ajusta textos do cover
    const test=document.querySelector('.test-panel'); if(test)test.remove();
    const btn=document.getElementById('startGame'); if(btn)btn.textContent='▶ JOGAR SOLO';
  `;
  d.body.appendChild(solo);
});
</script>
</body>
</html>

function clean(){try{const d=f.contentDocument;if(!d)return;d.querySelectorAll('a,button').forEach(e=>{const t=(e.textContent||'').trim().toUpperCase(),h=e.getAttribute('href')||'';if(t.includes('HUB')||t==='← VOLTAR'||t==='VOLTAR'||h.includes('index_turma_703_english_game_hub'))e.style.display='none'})}catch(e){}}
function wireStart(){
 try{
  const w=f.contentWindow,d=f.contentDocument;if(!w||!d)return false;

   }catch(err){console.error('Erro ao iniciar desafio de pronúncia',err);alert('Não foi possível iniciar o jogo. Atualize a página e tente novamente.');}
  });
  b.dataset.fixed703='1';return true;
 }catch(e){console.error(e);return false}

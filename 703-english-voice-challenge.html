<script>
const cover=document.getElementById('cover'),stage=document.getElementById('stage'),msg=document.getElementById('msg'),loading=document.getElementById('loading');
function fit(){const sc=Math.max(innerWidth/941,innerHeight/1672);stage.style.transform=`translate(-50%,-50%) scale(${sc})`}
addEventListener('resize',fit,{passive:true});addEventListener('orientationchange',fit);fit();
function extractPhases(text){const a=text.indexOf('const phases = ');if(a<0)throw new Error('Banco de fases da 703 não encontrado');const from=a+'const phases = '.length;const marker=';\n\n    let currentPhase';const b=text.indexOf(marker,from);if(b<0)throw new Error('Fim do banco de fases não encontrado');return JSON.parse(text.slice(from,b).trim())}
function makeTenPhases(source){
 const all=source.flatMap(p=>Array.isArray(p.items)?p.items:[]);
 const titles=[
  'Fase 1 - Listen & Repeat','Fase 2 - Family Words','Fase 3 - Present Actions','Fase 4 - Question Time','Fase 5 - Quantifiers',
  'Fase 6 - Comparatives','Fase 7 - Sentence Power','Fase 8 - Speaking Challenge','Fase 9 - Smart Review','Fase 10 - Final Voice Mission'
 ];
 const out=titles.map(title=>({title,items:[]}));
 all.forEach((item,i)=>out[i%10].items.push(item));
 return out;
}
async function launch(){
 const n=document.getElementById('studentName').value.trim(),s=document.getElementById('studentSchool').value.trim(),c=document.getElementById('studentClass').value.trim();
 if(!n||!s||!c){msg.textContent='Preencha Nome, Escola e Turma para começar.';return}
 cover.style.display='none';loading.style.display='flex';
 try{
   const [engine,content703]=await Promise.all([
     fetch('8ano-listening-speaking-game.html?v=703voiceengine4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Motor do 8º ano não carregou');return r.text()}),
     fetch('703-english-voice-challenge-core.html?v=703voicecontent4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Conteúdo da 703 não carregou');return r.text()})
   ]);
   const phases=makeTenPhases(extractPhases(content703));
   let html=engine;
   html=html.replace(/const NOME_DO_JOGO = "8ano-listening-speaking-game";\s*const phases = \[[\s\S]*?\];\s*\n\s*let currentPhase/,
     'const NOME_DO_JOGO = "703-english-voice-challenge";\n    const phases = '+JSON.stringify(phases)+';\n\n    let currentPhase');
   html=html.replaceAll('8ano.html','index_turma_703_english_game_hub.html')
     .replaceAll('8º Ano','Turma 703').replaceAll('8º ano','turma 703').replaceAll('8º ANO','TURMA 703')
     .replaceAll('Listening Game do turma 703','Desafio de Pronúncia da Turma 703')
     .replaceAll('Listening Game do Turma 703','Desafio de Pronúncia da Turma 703')
     .replaceAll('English Voice Challenge - Turma 703','Desafio de Pronúncia — Turma 703');
   const mobileCss=`<style>

 .feedback{padding:6px!important;margin-top:4px!important;font-size:.74rem!important;border-width:2px!important;border-radius:11px!important}

 .mini-note{font-size:.62rem!important;line-height:1.15!important;margin-top:4px!important}
 .teacher{font-size:.6rem!important;padding-top:3px!important}
 .phase-map{grid-template-columns:repeat(5,1fr)!important;gap:4px!important;margin:6px 0!important}
 .phase-tile{min-height:45px!important;border-radius:10px!important;font-size:.55rem!important}
 .phase-number{font-size:.82rem!important}
}
@media(max-width:380px),(max-height:680px){
 .screen{padding:6px!important}

 .hud-card{font-size:.58rem!important}.hud-card strong{font-size:.72rem!important}
 .phrase{font-size:1rem!important}.translation,.tip,.spoken-box{font-size:.64rem!important}

   html=html.replace('</head>',mobileCss+'</head>');
   const data=JSON.stringify({n,s,c});
   const boot=`renderPhaseMap(startPhaseMap, 0);\n    (function(){const p=${data};setTimeout(function(){try{const pn=document.getElementById('playerName');const ps=document.getElementById('playerSchool');if(pn)pn.value=p.n;if(ps)ps.value=p.s;if(window.speechSynthesis)window.speechSynthesis.resume();startGame();}catch(e){console.error('703 voice boot',e)}},60)})();`;

   document.open();document.write(html);document.close();

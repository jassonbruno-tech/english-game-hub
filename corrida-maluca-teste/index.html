<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Corrida Maluca Futurista — Filmes & Desenhos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#07111f}
button{font-family:inherit}
:root{
  --bg1:#07111f; --bg2:#0b1f39; --panel:#0f2038; --panel2:#132a49; --text:#f4f8ff;
  --muted:#b7caec; --line:#2d4d84; --glow:#5fd6ff; --glow2:#9a5bff;
}
.rotate-warning{display:none;position:fixed;inset:0;z-index:999;background:#081423;color:#fff;align-items:center;justify-content:center;text-align:center;padding:28px;font-weight:900;font-size:22px}
@media (orientation:portrait) and (max-width: 900px){.rotate-warning{display:flex}}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at top,#31206a 0,#10244c 34%,#08111f 72%,#04070d 100%)}
.stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:linear-gradient(180deg,#160d31 0%,#0b1830 38%,#07111f 100%);box-shadow:0 0 40px rgba(0,0,0,.45), inset 0 0 60px rgba(255,255,255,.02)}

/* decoração */
.grid{position:absolute;inset:0;background:
linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
background-size:3.2% 6%;opacity:.45;pointer-events:none}
.glow-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;pointer-events:none}
.orb1{width:22%;height:35%;left:-4%;top:-7%;background:#20d6ff}
.orb2{width:24%;height:38%;right:-6%;top:-9%;background:#ff3d9a}

.header{position:absolute;left:0;right:0;top:1.5%;display:flex;justify-content:center;pointer-events:none;z-index:10}
.title-box{background:linear-gradient(135deg,rgba(17,33,70,.88),rgba(10,20,40,.88));border:2px solid #4f6dff;border-radius:24px;padding:1.1% 2.8%;box-shadow:0 0 18px rgba(32,214,255,.28), 0 0 28px rgba(255,61,154,.14), inset 0 0 20px rgba(255,255,255,.05)}
.title{font-size:clamp(25px,3.9vw,54px);font-weight:1000;letter-spacing:1px;line-height:1;color:#ffd83d;text-shadow:0 0 14px rgba(255,216,61,.55), 0 0 28px rgba(255,216,61,.22)}
.subtitle{font-size:clamp(10px,1.2vw,18px);font-weight:900;color:#f4f8ff;text-align:center;margin-top:.4%}

.hud{position:absolute;right:1.6%;top:3%;width:18%;height:14%;display:grid;grid-template-rows:1fr 1fr;gap:8%;z-index:15}
.hud-card{background:linear-gradient(180deg,rgba(18,38,74,.92),rgba(10,21,41,.92));border:2px solid #4f6dff;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;box-shadow:0 0 14px rgba(32,214,255,.18), inset 0 0 14px rgba(255,255,255,.03)}
.hud-card span{color:#20d6ff;text-shadow:0 0 10px rgba(32,214,255,.45);margin-left:6px}

.track-wrap{position:absolute;left:4%;right:4%;top:17%;height:50%;border-radius:28px;background:linear-gradient(180deg,rgba(16,32,60,.84),rgba(8,16,32,.96));border:2px solid #3559a8;box-shadow:inset 0 0 22px rgba(0,0,0,.42),0 0 18px rgba(32,214,255,.16), 0 0 28px rgba(255,61,154,.08);overflow:hidden}
.track-wrap:before{content:"";position:absolute;inset:1.4%;border-radius:24px;border:1px solid rgba(160,193,255,.18)}
.start-tag,.finish-tag{position:absolute;top:3.2%;width:8.3%;height:9%;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(12px,1.2vw,18px);z-index:7}
.start-tag{left:1.8%;background:linear-gradient(135deg,#19f28a,#00c3a8);color:#03221f;box-shadow:0 0 18px rgba(25,242,138,.42)}
.finish-tag{right:1.8%;background:linear-gradient(135deg,#ff7a1a,#ff3d9a);color:#fff;box-shadow:0 0 18px rgba(255,61,154,.34)}

.lane-labels{position:absolute;left:1.8%;top:15%;width:10%;height:74%;display:grid;grid-template-rows:repeat(4,1fr);gap:4.2%;z-index:6}
.team-label{border-radius:18px;padding:0 8%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:1000;font-size:clamp(10px,1vw,15px);color:#fff;border:2px solid rgba(255,255,255,.18)}
.t1{background:linear-gradient(135deg,#20d6ff,#2d7cff)}
.t2{background:linear-gradient(135deg,#ff4d57,#ff7a1a)}
.t3{background:linear-gradient(135deg,#19f28a,#00c853)}
.t4{background:linear-gradient(135deg,#ffd83d,#ff9800);color:#21263a}

.lanes{position:absolute;left:12.5%;right:3%;top:15%;height:74%;display:grid;grid-template-rows:repeat(4,1fr);gap:4.2%;z-index:5}
.lane{position:relative;border-radius:18px;background:linear-gradient(180deg,#2d3f5d,#1a263b);border:1px solid rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 0 16px rgba(0,0,0,.28), 0 0 12px rgba(32,214,255,.08)}
.lane:before{content:"";position:absolute;left:2%;right:2%;top:50%;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 2.3%,transparent 2.3% 4.6%);transform:translateY(-50%)}
.lane:after{content:"";position:absolute;right:1.2%;top:0;bottom:0;width:2.4%;background:repeating-linear-gradient(180deg,#fff 0 10px,#202c43 10px 20px)}
.numbers{position:absolute;left:2.5%;right:5%;bottom:6%;display:grid;grid-template-columns:repeat(20,1fr);gap:0;pointer-events:none}
.numbers span{font-size:clamp(8px,.74vw,11px);font-weight:900;color:#dfe9ff;text-align:center;opacity:.94;text-shadow:0 0 8px rgba(255,255,255,.08)}

.car{position:absolute;left:2%;top:50%;transform:translate(-50%,-50%) scaleX(-1);width:auto;height:auto;font-size:clamp(28px,3vw,46px);line-height:1;transition:left .55s cubic-bezier(.22,.9,.3,1);filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));z-index:9}
.smoke{position:absolute;left:0;top:50%;transform:translate(-50%,-50%);font-size:clamp(12px,1vw,18px);opacity:0;z-index:8}
.smoke.go{animation:puff .6s ease-out}
@keyframes puff{0%{opacity:.95;transform:translate(-15px,-50%) scale(.7)}100%{opacity:0;transform:translate(-44px,-50%) scale(1.5)}}

.question-panel{position:absolute;left:3%;bottom:3.2%;width:57%;height:26%;background:linear-gradient(180deg,rgba(16,30,54,.92),rgba(11,22,41,.94));border:2px solid #4f6dff;border-radius:22px;box-shadow:0 0 20px rgba(32,214,255,.18), 0 0 24px rgba(255,61,154,.08);padding:1.15% 1.8%;z-index:12;overflow:hidden}
.q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.2%}
.q-badge{display:inline-flex;align-items:center;background:linear-gradient(135deg,#20d6ff,#6f58ff);padding:.6% 1.8%;border-radius:999px;color:#fff;box-shadow:0 0 12px rgba(32,214,255,.24);font-weight:1000;font-size:clamp(10px,1vw,14px)}
.question-text{color:#f4f8ff;font-size:clamp(12px,1.42vw,22px);font-weight:1000;line-height:1.08;min-height:20%;margin-top:.8%}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:4% 2.2%;margin-top:1%;height:61%}
.answer{border:2px solid #b7cbed;border-radius:14px;background:linear-gradient(180deg,#253955,#17263b);color:#fff;padding:1.6% 2.8%;font-size:clamp(9px,.96vw,14px);font-weight:900;text-align:left;box-shadow:0 2px 0 #8eadcf;min-height:34px;line-height:1.1}
.answer.good{background:linear-gradient(180deg,#18d968,#0fa852);border-color:#19f28a}
.answer.bad{background:linear-gradient(180deg,#ff5c67,#c12f48);border-color:#ff7b96}
.answer[disabled]{opacity:.65}
.answer:hover{box-shadow:0 0 14px rgba(32,214,255,.22);transform:translateY(-1px)}
.penalty{position:absolute;left:18%;right:18%;bottom:5%;padding:1.1% 2%;background:linear-gradient(135deg,#ff4d57,#a01a2d);color:#fff;border:2px solid #ffd54d;border-radius:12px;text-align:center;font-weight:1000;font-size:clamp(9px,.95vw,14px);display:none}
.penalty.show{display:block}

.score-panel{position:absolute;right:3%;bottom:3.2%;width:33%;height:26%;background:linear-gradient(180deg,rgba(16,30,54,.92),rgba(11,22,41,.94));border:2px solid #4f6dff;border-radius:22px;padding:1.35% 3.2%;box-shadow:0 0 20px rgba(32,214,255,.18), 0 0 24px rgba(255,61,154,.08);z-index:12;overflow:hidden}
.score-title{color:#fff;font-size:clamp(11px,1.1vw,17px);font-weight:1000;text-align:center;margin-bottom:1.8%;line-height:1.1}
.score-list{height:84%;display:flex;flex-direction:column;justify-content:space-evenly}
.score-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3%;height:21%}
.score-name{font-size:clamp(9px,.9vw,13px);font-weight:900;color:#fff;display:flex;align-items:center;line-height:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;box-shadow:0 0 8px currentColor}
.d1{background:#21b8ff;color:#21b8ff}.d2{background:#ff6347;color:#ff6347}.d3{background:#1ddb73;color:#1ddb73}.d4{background:#ffd33d;color:#ffd33d}
.score-pill{min-width:86px;text-align:center;background:linear-gradient(135deg,#ffffff,#dce7ff);border-radius:999px;box-shadow:0 0 12px rgba(32,214,255,.14);padding:5px 10px;font-size:clamp(9px,.82vw,12px);font-weight:1000;color:#10285a;line-height:1}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,15,28,.62);z-index:30}
.card{width:42%;background:linear-gradient(180deg,rgba(19,41,76,.95),rgba(10,24,48,.95));border:2px solid #5a8cff;b

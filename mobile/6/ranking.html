<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking — English Game Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../jogos-em-equipe/supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#07142f;color:#fff;font-family:system-ui;padding:18px}.wrap{max-width:560px;margin:auto}h1{text-align:center;color:#ffe66d}.sub{text-align:center;color:#bdd0ef}.row{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:12px;margin:8px 0;background:#ffffff0d;border:1px solid #ffffff18;border-radius:14px}.pos{font-weight:1000;font-size:1.15rem}.name{font-weight:900}.school{font-size:.76rem;color:#abc0df}.pts{font-weight:1000;color:#ffe66d}.empty{text-align:center;padding:35px;color:#b8c8df}.signature{text-align:center;color:#91a6cc;font-size:.76rem;margin:14px 0 4px}.go{display:block;text-align:center;text-decoration:none;margin:20px 0;padding:14px;border-radius:14px;background:#ffe66d;color:#172033;font-weight:1000}</style></head><body><main class="wrap"><h1 id="title">🏆 RANKING</h1><div class="sub" id="sub">Resultados reais do English Game Hub</div><div id="acc" style="text-align:center;margin:14px 0;padding:14px;border-radius:14px;background:#ffffff0d;border:1px solid #ffe66d55"><b style="color:#ffe66d;font-size:1.35rem">Pontuação acumulada: <span id="accPts">...</span> pts</b><div id="accBreak" style="font-size:.78rem;color:#bdd0ef;margin-top:5px"></div></div><div id="list"><div class="empty">Carregando ranking...</div></div><div class="signature">🇺🇸 🇬🇧 English Game Hub • Jogo idealizado pelo Prof. Jasson Bruno</div><a class="go" id="go" href="./mechanics-test.html">PRÓXIMO JOGO →</a></main><script src="./mobile-api.js"></script><script>const q=new URLSearchParams(location.search),phase=Number(q.get('phase')||0),names=['','Vocabulário','Forca','Roleta','Quiz','Semáforo','Corrida Final'];async function load(){try{if(phase){const progress=await EGHMobile.matchProgress();accPts.textContent=progress.total_points;accBreak.textContent=progress.phases.map(x=>names[x.phase]+': '+x.points).join(' + ')}else{acc.style.display='none'}const rows=phase?await EGHMobile.phaseRanking(phase):await EGHMobile.overall();title.textContent=phase?'🏆 RANKING — '+names[phase]:'🏆 RANKING GERAL';sub.textContent=phase?'Melhores resultados reais desta fase':'Classificação geral • partidas concluídas';list.innerHTML=rows.length?rows.map((x,i)=>'<div class="row"><div class="pos">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':x.rank_position+'º')+'</div><div><div class="name">'+esc(x.name)+'</div><div class="school">'+esc(x.school)+' • '+esc(x.class_name)+'</div></div><div class="pts">'+(phase?x.points:x.total_points)+' pts</div></div>').join(''):'<div class="empty">Ainda não há resultados concluídos neste ranking.</div>'}catch(e){list.innerHTML='<div class="empty">Não foi possível carregar o ranking.</div>';console.error(e)}}function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}if(!phase){go.textContent='VOLTAR AO HUB';go.href='../'}else if(phase>=1&&phase<6){go.textContent='PRÓXIMO JOGO →';go.href='./mechanics-test.html';go.onclick=e=>{e.preventDefault();sessionStorage.setItem('egh-mobile-phase',String(phase+1));location.href='./mechanics-test.html?game='+(phase+1)}}else if(phase===6){go.textContent='VER RANKING GERAL';go.onclick=async e=>{e.preventDefault();try{await EGHMobile.complete()}catch(err){console.error(err)}location.href='./ranking.html'};}load();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Campeonato Mobile — 6º Ano</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../jogos-em-equipe/supabase-config.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07142f;font-family:system-ui;color:#fff}.bar{height:52px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#061027;border-bottom:1px solid #ffffff20}.badge{font-weight:1000;color:#ffe66d}.brand{font-size:10px;color:#91a6cc;white-space:nowrap}.steps{margin-left:auto;font-size:12px;color:#bcd0ef}iframe{width:100%;height:calc(100% - 52px);border:0;background:#07142f}.wait{position:fixed;inset:52px 0 0;display:none;place-items:center;background:#07142f;z-index:9;text-align:center;padding:25px}.wait.show{display:grid}.wait b{color:#ffe66d;font-size:22px}</style></head><body><div class="bar"><span class="badge">🇺🇸 🇬🇧 6º ANO</span><span id="gameName">Vocabulário</span><span class="brand">English • Prof. Jasson Bruno</span><span class="steps" id="step">1/6</span></div><iframe id="game" allow="autoplay; microphone"></iframe><div class="wait" id="wait"><div><b>Salvando seu resultado...</b><p>Preparando o ranking real desta fase.</p></div></div><script src="./mobile-api.js"></script><script>const phases=[['Vocabulário','./vocabulary.html'],['Forca','./hangman.html'],['Roleta','./roulette.html'],['Quiz','./quiz.html'],['Semáforo','./traffic-light.html?demo=1'],['Corrida Final','./final-race.html?demo=1']];const requested=Number(new URLSearchParams(location.search).get('game')||0);let current=Math.max(1,Math.min(6,requested||Number(sessionStorage.getItem('egh-mobile-phase')||1)));sessionStorage.setItem('egh-mobile-phase',String(current));if(!EGHMobile.state()){location.href='./'}function load(){gameName.textContent=phases[current-1][0];step.textContent=current+'/6';game.src=phases[current-1][1]}async function done(d){if(Number(d.phase)!==current)return;wait.classList.add('show');try{await EGHMobile.submit(current,d.points||0,d.correct||0,d.wrong||0);sessionStorage.setItem('egh-mobile-phase',String(Math.min(6,current+1)));location.href='./ranking.html?phase='+current}catch(e){console.error(e);wait.innerHTML='<div><b>Não foi possível salvar.</b><p>Verifique a internet e tente novamente.</p><button onclick="location.reload()">TENTAR NOVAMENTE</button></div>'}}addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='egh-phase-finish')return;done(e.data)});load();</script></body></html>

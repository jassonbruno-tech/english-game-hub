<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07142f"><title>Teste Mobile — English Championship</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07142f;font-family:Arial,sans-serif}.shell{height:100dvh;display:flex;flex-direction:column}.bar{flex:0 0 auto;background:#06102b;color:#fff;padding:max(7px,env(safe-area-inset-top)) 8px 7px;border-bottom:1px solid #ffffff22}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:1000;font-size:14px;color:#ffe66d}.step{font-size:11px;font-weight:900;color:#cfe8ff}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}.dot{border:0;border-radius:9px;padding:7px 2px;background:#162b57;color:#a9c7ef;font-size:10px;font-weight:1000}.dot.active{background:#ffe66d;color:#172033}.framewrap{position:relative;flex:1;min-height:0}.game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07142f}.controls{position:fixed;z-index:999999;right:9px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:7px}.ctl{border:2px solid #fff6a7;border-radius:999px;padding:10px 13px;background:#09245cdd;color:#fff;font-weight:1000;font-size:12px;box-shadow:0 6px 18px #0008}.ctl.next{background:#ffe66d;color:#172033;border-color:#fff}.notice{position:fixed;left:8px;bottom:max(11px,env(safe-area-inset-bottom));z-index:999998;color:#fff7c2;background:#06102bcc;border:1px solid #ffffff22;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900;max-width:47vw}</style></head><body><div class="shell"><div class="bar"><div class="head"><div class="title">🏆 TESTE MOBILE • 6º ANO</div><div class="step" id="step"></div></div><div class="nav" id="nav"></div></div><div class="framewrap"><iframe class="game" id="game" allow="autoplay; microphone"></iframe></div></div><div class="notice">TESTE DE MECÂNICA • conteúdo reduzido vem depois da validação</div><div class="controls"><button class="ctl" id="prev">←</button><button class="ctl next" id="next">PRÓXIMO JOGO →</button></div>
<script>
const games=[
 {n:'VOCAB',t:'Combinação de Vocabulário',u:'../../703-quanticompare-challenge.html?v=mobiletest1'},
 {n:'FORCA',t:'Jogo da Forca',u:'../../703-quanticompare-hangman.html?v=mobiletest1'},
 {n:'ROLETA',t:'Roleta do Inglês',u:'../../703-english-spin-and-answer.html?v=mobiletest1'},
 {n:'QUIZ',t:'Show do Milhão',u:'../../703-show-do-milhao.html?v=mobiletest1'},
 {n:'🚦',t:'Semáforo do Inglês',u:'../../6ano-campeonato/opinions-suggestions.html?demo=1&v=mobiletest1'},
 {n:'🏎️',t:'Corrida Final',u:'../../6ano-campeonato/final-race.html?demo=1&v=mobiletest1'}
];let i=0;const frame=document.getElementById('game'),nav=document.getElementById('nav'),step=document.getElementById('step');
function load(k){i=Math.max(0,Math.min(games.length-1,k));frame.src=games[i].u;step.textContent=(i+1)+'/6 • '+games[i].t;nav.innerHTML=games.map((g,j)=>'<button class="dot '+(j===i?'active':'')+'" data-i="'+j+'">'+g.n+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>load(+b.dataset.i));document.getElementById('prev').style.visibility=i?'visible':'hidden';document.getElementById('next').textContent=i===5?'REINICIAR TESTE ↻':'PRÓXIMO JOGO →'}
document.getElementById('prev').onclick=()=>load(i-1);document.getElementById('next').onclick=()=>i===5?load(0):load(i+1);load(0);
</script></body></html>

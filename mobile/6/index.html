<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>6º Ano — English Game Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../jogos-em-equipe/supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(160deg,#08152f,#17356d);color:#fff;font-family:system-ui;padding:22px;display:grid;place-items:center}.card{width:min(100%,480px);padding:28px 20px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff0d}.tag{text-align:center;color:#b9c9ee;font-size:.8rem;letter-spacing:.1em}h1{text-align:center;font-size:2.3rem;margin:8px 0 4px}.sub{text-align:center;color:#c8d4ee;margin:0 0 24px}label{display:block;font-size:.85rem;color:#c8d4ee;margin:12px 0 5px}input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid #ffffff2e;border-radius:13px;background:#071126;color:#fff}.go{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;font:800 1rem system-ui;background:#ffe66d;color:#172033}.go:disabled{opacity:.55}.msg{text-align:center;min-height:20px;margin-top:10px;color:#ffe9a7;font-size:.85rem}.back{display:block;text-align:center;color:#aebdde;text-decoration:none;margin-top:12px;font-size:.85rem}</style></head><body><main class="card"><div class="tag">🇺🇸 🇬🇧 • ENGLISH GAME HUB • MOBILE</div><h1>6º ANO</h1><p class="sub">Identifique-se para iniciar o campeonato.</p><form id="player"><label>Seu nome</label><input name="name" required maxlength="60"><label>Turma</label><input name="class" required maxlength="30"><label>Escola</label><input name="school" required maxlength="100"><button class="go" id="go">COMEÇAR CAMPEONATO</button><div class="msg" id="msg"></div></form><div style="text-align:center;margin-top:18px;color:#91a6cc;font-size:.76rem">🇺🇸 🇬🇧 English • Jogo idealizado pelo Prof. Jasson Bruno</div><a class="back" href="../">← Voltar ao English Game Hub</a></main><script src="./mobile-api.js"></script><script>player.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('go'),m=document.getElementById('msg'),fd=new FormData(e.currentTarget),p={name:String(fd.get('name')).trim(),studentClass:String(fd.get('class')).trim(),school:String(fd.get('school')).trim(),grade:6};if(!p.name||!p.studentClass||!p.school)return;b.disabled=true;m.textContent='Preparando seu campeonato...';try{await EGHMobile.register(p);sessionStorage.setItem('egh-mobile-player',JSON.stringify(p));location.href='./mechanics-test.html'}catch(err){m.textContent='Não foi possível iniciar. Tente novamente.';b.disabled=false;console.error(err)}};</script></body></html>

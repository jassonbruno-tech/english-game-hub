<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>6º Ano — English Game Hub Mobile</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#0b1633;color:#fff;font-family:system-ui;padding:22px;display:grid;place-items:center}.card{width:min(100%,480px);padding:28px 20px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff0d}.tag{text-align:center;color:#b9c9ee;font-size:.8rem;letter-spacing:.1em}h1{text-align:center;font-size:2.3rem;margin:8px 0 4px}.sub{text-align:center;color:#c8d4ee;margin:0 0 24px}label{display:block;font-size:.85rem;color:#c8d4ee;margin:12px 0 5px}input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid #ffffff2e;border-radius:13px;background:#071126;color:#fff;outline:none}input:focus{border-color:#8eacef}.go{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;font:800 1rem system-ui;background:#fff;color:#0b1633}.back{display:block;text-align:center;color:#aebdde;text-decoration:none;margin-top:18px;font-size:.85rem}</style></head><body><main class="card"><div class="tag">ENGLISH GAME HUB • MOBILE</div><h1>6º ANO</h1><p class="sub">Campeonato individual</p><form id="player"><label for="name">Seu nome</label><input id="name" name="name" autocomplete="name" required maxlength="50"><label for="class">Turma</label><input id="class" name="class" inputmode="numeric" required maxlength="12"><label for="school">Escola</label><input id="school" name="school" required maxlength="80"><button class="go" type="submit">COMEÇAR CAMPEONATO</button></form><a class="back" href="../">← Escolher outra série</a></main><script>document.getElementById('player').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const p={name:String(fd.get('name')).trim(),studentClass:String(fd.get('class')).trim(),school:String(fd.get('school')).trim(),grade:6};if(!p.name||!p.studentClass||!p.school)return;sessionStorage.setItem('egh-mobile-player',JSON.stringify(p));location.href='./championship.html';});</script></body></html>

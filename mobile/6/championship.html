<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>6º Ano — Teste Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#09142d;color:#fff;font-family:system-ui;padding:16px;min-height:100svh}.wrap{max-width:520px;margin:auto}.top,.card{border:1px solid #ffffff20;border-radius:19px;background:#ffffff0d;padding:17px}.top{margin-bottom:14px}.muted{color:#b9c9ee}.score{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}.bar{height:7px;background:#ffffff18;border-radius:99px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;width:0;transition:.25s}.card h2{margin:0 0 7px}.q{font-size:1.08rem;margin:20px 0 13px}.answers{display:grid;gap:9px}.answers button,.next{border:1px solid #ffffff28;border-radius:13px;background:#13264d;color:#fff;padding:14px;font:inherit;text-align:left}.answers button:disabled{opacity:.7}.ok{outline:2px solid #7ce7a6}.bad{outline:2px solid #ff8e8e}.feedback{min-height:28px;margin:12px 0;color:#dce6ff}.next{width:100%;text-align:center;font-weight:800;background:#fff;color:#0b1633;border:0}.rank{display:grid;gap:8px;margin:16px 0}.row{display:flex;justify-content:space-between;padding:11px;border-radius:11px;background:#ffffff0b}.me{border:1px solid #ffffff55}.race{margin:18px 0}.lane{margin:14px 0}.track{height:38px;border-radius:99px;background:#ffffff12;position:relative;overflow:hidden}.car{position:absolute;top:7px;left:2%;font-size:22px;transition:left .35s}.finish{position:absolute;right:8px;top:0;font-size:27px}.hidden{display:none}.tiny{font-size:.78rem}.center{text-align:center}
</style></head><body><main class="wrap"><section class="top"><div class="score"><b id="who">6º ANO</b><span>Pontos: <b id="total">0</b></span></div><div id="meta" class="muted tiny"></div><div class="bar"><i id="progress"></i></div></section><section id="game" class="card"></section></main>
<script>
const phases=[
 {name:'1. Vocabulário',qs:[['MOTHER significa:',['Mãe','Irmã','Avó'],0],['BROTHER significa:',['Pai','Irmão','Primo'],1],['GRANDMOTHER significa:',['Tia','Avó','Filha'],1]]},
 {name:'2. Forca',qs:[['Complete: F _ T H E R',['A','O','I'],0],['Complete: S I S T _ R',['E','A','O'],0],['Complete: U N C _ E',['L','R','T'],0]]},
 {name:'3. Quiz',qs:[['My sister ___ 12 years old.',['am','is','are'],1],['I ___ a student.',['am','is','are'],0],['They ___ my cousins.',['am','is','are'],2]]},
 {name:'4. Roleta',qs:[['Escolha o possessivo: Maria has a book. It is ___ book.',['his','her','their'],1],['John has a dog. It is ___ dog.',['his','her','our'],0],['We have a house. It is ___ house.',['our','his','my'],0]]},
 {name:'5. Semáforo',qs:[['___ you like English?',['Do','Does','Is'],0],['___ Ana study here?',['Do','Does','Are'],1],['Where ___ you live?',['do','does','is'],0]]}
];
let player;try{player=JSON.parse(sessionStorage.getItem('egh-mobile-player'))}catch(e){}
if(!player){location.replace('./');throw 0}
const game=document.getElementById('game'),totalEl=document.getElementById('total'),prog=document.getElementById('progress');
document.getElementById('who').textContent=player.name+' • 6º ANO';document.getElementById('meta').textContent=player.studentClass+' • '+player.school;
let phase=0,q=0,total=0,phaseScore=0,locked=false;
const rivals=[['Ana',270],['Carlos',220]];
function setProgress(){prog.style.width=((phase/6)*100)+'%'}
function renderQ(){setProgress();const P=phases[phase],Q=P.qs[q];game.innerHTML='<div class="muted tiny">FASE '+(phase+1)+' DE 6</div><h2>'+P.name+'</h2><div class="q">'+Q[0]+'</div><div class="answers">'+Q[1].map((a,i)=>'<button data-i="'+i+'">'+String.fromCharCode(65+i)+') '+a+'</button>').join('')+'</div><div id="fb" class="feedback"></div>';game.querySelectorAll('.answers button').forEach(b=>b.addEventListener('click',answer));}
function answer(e){if(locked)return;locked=true;const i=+e.currentTarget.dataset.i,Q=phases[phase].qs[q],correct=i===Q[2];game.querySelectorAll('.answers button').forEach((b,j)=>{b.disabled=true;if(j===Q[2])b.classList.add('ok')});if(!correct)e.currentTarget.classList.add('bad');else{total+=100;phaseScore+=100;totalEl.textContent=total}document.getElementById('fb').textContent=correct?'✓ Correto! +100 pontos':'✕ Resposta incorreta';setTimeout(()=>{q++;locked=false;if(q<3)renderQ();else showRank();},650)}
function showRank(){const rows=[[player.name,phaseScore],...rivals].sort((a,b)=>b[1]-a[1]);game.innerHTML='<div class="muted tiny">FASE CONCLUÍDA</div><h2>Ranking — '+phases[phase].name+'</h2><div class="rank">'+rows.map((r,i)=>'<div class="row '+(r[0]===player.name?'me':'')+'"><span>'+(i+1)+'º '+r[0]+'</span><b>'+r[1]+' pts</b></div>').join('')+'</div><button class="next">PRÓXIMA FASE</button>';game.querySelector('.next').onclick=()=>{phase++;q=0;phaseScore=0;if(phase<5)renderQ();else raceIntro()}}
function raceIntro(){phase=5;setProgress();game.innerHTML='<div class="muted tiny">FASE 6 DE 6</div><h2>6. Corrida Final</h2><p>Você vai correr contra <b>Lucas</b>. Neste teste, são apenas <b>3 acertos</b> para chegar.</p><button class="next">INICIAR CORRIDA</button>';game.querySelector('.next').onclick=startRace}
let raceStart,ghostTimers=[],raceHits=0,raceDone=false;
const raceQs=[['FATHER',['Pai','Mãe','Irmão'],0],['Does she ___ English?',['likes','like','liking'],1],['___ is your mother?',['Who','How many','Does'],0]];
function startRace(){raceStart=performance.now();raceHits=0;raceDone=false;game.innerHTML='<h2>Corrida Final</h2><div class="race"><div class="lane"><div class="tiny">'+player.name+'</div><div class="track"><span id="meCar" class="car">🏎️</span><span class="finish">🏁</span></div></div><div class="lane"><div class="tiny">Lucas</div><div class="track"><span id="ghCar" class="car">🏎️</span><span class="finish">🏁</span></div></div></div><div id="rq"></div>';[3500,7200,11200].forEach((t,i)=>ghostTimers.push(setTimeout(()=>move('ghCar',i+1),t)));renderRaceQ()}
function move(id,h){const el=document.getElementById(id);if(el)el.style.left=(2+h*28)+'%'}
function renderRaceQ(){if(raceDone)return;const Q=raceQs[raceHits],box=document.getElementById('rq');box.innerHTML='<div class="q">'+Q[0]+'</div><div class="answers">'+Q[1].map((a,i)=>'<button data-i="'+i+'">'+a+'</button>').join('')+'</div><div id="rf" class="feedback"></div>';box.querySelectorAll('button').forEach(b=>b.onclick=raceAnswer)}
function raceAnswer(e){const Q=raceQs[raceHits],i=+e.currentTarget.dataset.i;if(i===Q[2]){raceHits++;total+=150;totalEl.textContent=total;move('meCar',raceHits);if(raceHits===3){raceDone=true;ghostTimers.forEach(clearTimeout);setTimeout(finish,450)}else renderRaceQ()}else{document.getElementById('rf').textContent='✕ Tente novamente';e.currentTarget.disabled=true}}
function finish(){prog.style.width='100%';const sec=((performance.now()-raceStart)/1000).toFixed(1);const all=[['Ana',1150],['Carlos',980],[player.name,total]].sort((a,b)=>b[1]-a[1]);game.innerHTML='<div class="center"><div class="muted tiny">TESTE CONCLUÍDO</div><h2>🏆 Ranking Geral</h2><p>Corrida: <b>'+sec+' s</b></p></div><div class="rank">'+all.map((r,i)=>'<div class="row '+(r[0]===player.name?'me':'')+'"><span>'+(i+1)+'º '+r[0]+'</span><b>'+r[1]+' pts</b></div>').join('')+'</div><button id="again" class="next">TESTAR NOVAMENTE</button>';document.getElementById('again').onclick=()=>location.reload()}
renderQ();
</script></body></html>
